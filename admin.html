<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SCP Admin — StudioYou</title>
<link rel="icon" type="image/png" href="assets/SY_OFFICIAL_SHUTTER_KEY.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04060E;
  --surface:rgba(14,21,48,0.85);
  --surface2:rgba(24,34,64,0.6);
  --border:rgba(0,200,255,0.12);
  --border-bright:rgba(0,200,255,0.35);
  --cyan:#00C8FF;
  --cyan-dim:rgba(0,200,255,0.6);
  --text:rgba(240,242,255,0.92);
  --mute:rgba(240,242,255,0.5);
  --dim:rgba(240,242,255,0.35);
  --red:#FF4466;
  --green:#00FF88;
  --amber:#FFB800;
  --font-display:'Bebas Neue',sans-serif;
  --font-mono:'DM Mono',monospace;
  --font-body:'DM Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body)}
body{overflow-x:hidden}

/* ── GATE ── */
#gate{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:999;
}
.gate-box{
  width:380px;padding:48px 40px;
  background:linear-gradient(155deg,rgba(24,34,64,0.9) 0%,rgba(9,13,30,0.95) 100%);
  border:1px solid var(--border-bright);
  box-shadow:inset 1px 1px 0 rgba(0,200,255,0.25),inset -1px -1px 0 rgba(0,0,0,0.8),0 24px 64px rgba(0,0,0,0.8);
  text-align:center;
}
.gate-logo{font-family:var(--font-display);font-size:28px;letter-spacing:0.12em;color:var(--cyan);margin-bottom:6px}
.gate-sub{font-family:var(--font-mono);font-size:11px;color:var(--mute);letter-spacing:0.15em;margin-bottom:36px}
.gate-input{
  width:100%;padding:12px 16px;
  background:rgba(0,0,0,0.5);
  border:1px solid var(--border);
  border-radius:4px;color:var(--text);
  font-family:var(--font-mono);font-size:14px;
  outline:none;transition:border 0.2s;margin-bottom:16px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.6);
}
.gate-input:focus{border-color:var(--border-bright)}
.gate-btn{
  width:100%;padding:13px;
  background:linear-gradient(135deg,rgba(0,200,255,0.15),rgba(0,200,255,0.05));
  border:1px solid var(--border-bright);
  color:var(--cyan);font-family:var(--font-display);font-size:18px;letter-spacing:0.1em;
  cursor:pointer;transition:all 0.2s;
}
.gate-btn:hover{background:rgba(0,200,255,0.2)}
.gate-err{font-family:var(--font-mono);font-size:11px;color:var(--red);margin-top:12px}

/* ── LAYOUT ── */
#app{display:none;height:100vh;flex-direction:column}
#app.visible{display:flex}

/* ── TOP BAR ── */
.topbar{
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;border-bottom:1px solid var(--border);
  background:rgba(4,6,18,0.95);flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{font-family:var(--font-display);font-size:22px;letter-spacing:0.1em;color:var(--cyan)}
.topbar-badge{
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.15em;
  padding:3px 8px;background:rgba(255,68,102,0.15);border:1px solid rgba(255,68,102,0.3);
  color:var(--red);text-transform:uppercase;
}
.topbar-right{font-family:var(--font-mono);font-size:11px;color:var(--mute)}
.topbar-right span{color:var(--cyan-dim)}

/* ── NAV TABS ── */
.nav{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  background:rgba(4,6,18,0.8);flex-shrink:0;padding:0 28px;
}
.nav-tab{
  padding:14px 24px;font-family:var(--font-display);font-size:15px;letter-spacing:0.08em;
  color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;
  transition:all 0.2s;user-select:none;
}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ── MAIN CONTENT ── */
.content{flex:1;overflow-y:auto;padding:28px}

/* ── STAT CARDS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{
  padding:20px 22px;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:inset 1px 1px 0 rgba(0,200,255,0.15),inset -1px -1px 0 rgba(0,0,0,0.6);
}
.stat-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:var(--mute);text-transform:uppercase;margin-bottom:8px}
.stat-value{font-family:var(--font-display);font-size:42px;letter-spacing:0.02em;color:var(--cyan);line-height:1}
.stat-sub{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:6px}

/* ── SECTION HEADER ── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.section-title{font-family:var(--font-display);font-size:18px;letter-spacing:0.1em;color:var(--text)}
.section-count{font-family:var(--font-mono);font-size:11px;color:var(--mute)}

/* ── SEARCH BAR ── */
.search-bar{
  display:flex;gap:12px;margin-bottom:18px;
}
.search-input{
  flex:1;padding:10px 14px;
  background:rgba(0,0,0,0.4);border:1px solid var(--border);
  color:var(--text);font-family:var(--font-mono);font-size:12px;
  outline:none;transition:border 0.2s;
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.5);
}
.search-input:focus{border-color:var(--border-bright)}
.filter-select{
  padding:10px 14px;background:rgba(0,0,0,0.4);border:1px solid var(--border);
  color:var(--text);font-family:var(--font-mono);font-size:11px;
  outline:none;cursor:pointer;
}
.filter-select option{background:#0a0f22}
.refresh-btn{
  padding:10px 18px;background:rgba(0,200,255,0.08);border:1px solid var(--border);
  color:var(--cyan-dim);font-family:var(--font-mono);font-size:11px;
  cursor:pointer;transition:all 0.2s;letter-spacing:0.1em;
}
.refresh-btn:hover{background:rgba(0,200,255,0.15);border-color:var(--border-bright)}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:rgba(0,0,0,0.4);border-bottom:1px solid var(--border-bright)}
th{
  padding:10px 14px;text-align:left;
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.18em;
  color:var(--mute);text-transform:uppercase;white-space:nowrap;
}
tbody tr{
  border-bottom:1px solid rgba(0,200,255,0.05);
  transition:background 0.15s;cursor:pointer;
}
tbody tr:hover{background:rgba(0,200,255,0.04)}
td{padding:12px 14px;font-family:var(--font-mono);font-size:12px;color:var(--text)}
td.mute{color:var(--mute)}
td.email{color:var(--cyan-dim)}

/* ── TIER BADGE ── */
.tier-badge{
  display:inline-block;padding:2px 8px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;
}
.tier-badge.independent{background:rgba(0,200,255,0.1);border:1px solid rgba(0,200,255,0.25);color:var(--cyan)}
.tier-badge.operator{background:rgba(255,184,0,0.1);border:1px solid rgba(255,184,0,0.25);color:var(--amber)}
.tier-badge.player{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.25);color:var(--green)}
.tier-badge.none{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--dim)}

/* ── DELETE BTN ── */
.del-btn{
  padding:4px 10px;background:rgba(255,68,102,0.08);border:1px solid rgba(255,68,102,0.2);
  color:var(--red);font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;
  cursor:pointer;transition:all 0.2s;
}
.del-btn:hover{background:rgba(255,68,102,0.2);border-color:rgba(255,68,102,0.5)}

/* ── USER DETAIL DRAWER ── */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;
  display:flex;justify-content:flex-end;
}
.drawer{
  width:520px;height:100%;overflow-y:auto;
  background:linear-gradient(180deg,rgba(14,21,48,0.99) 0%,rgba(4,6,18,0.99) 100%);
  border-left:1px solid var(--border-bright);
  padding:32px 28px;
}
.drawer-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
.drawer-name{font-family:var(--font-display);font-size:26px;letter-spacing:0.06em;color:var(--text)}
.drawer-email{font-family:var(--font-mono);font-size:11px;color:var(--cyan-dim);margin-top:4px}
.drawer-close{
  background:none;border:1px solid var(--border);color:var(--mute);
  padding:6px 12px;font-family:var(--font-mono);font-size:11px;cursor:pointer;
  transition:all 0.2s;flex-shrink:0;
}
.drawer-close:hover{border-color:var(--border-bright);color:var(--text)}
.drawer-section{margin-bottom:24px}
.drawer-section-title{
  font-family:var(--font-mono);font-size:9px;letter-spacing:0.2em;color:var(--mute);
  text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.drawer-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.drawer-key{font-family:var(--font-mono);font-size:11px;color:var(--dim);flex-shrink:0;width:140px}
.drawer-val{font-family:var(--font-mono);font-size:11px;color:var(--text);text-align:right;word-break:break-all}
.drawer-val.cyan{color:var(--cyan-dim)}
.formation-answers{
  background:rgba(0,0,0,0.3);border:1px solid var(--border);
  padding:14px;max-height:280px;overflow-y:auto;
}
.formation-q{font-family:var(--font-mono);font-size:10px;color:var(--mute);margin-bottom:2px}
.formation-a{font-family:var(--font-mono);font-size:11px;color:var(--text);margin-bottom:12px}
.drawer-del-btn{
  width:100%;margin-top:16px;padding:12px;
  background:rgba(255,68,102,0.08);border:1px solid rgba(255,68,102,0.25);
  color:var(--red);font-family:var(--font-display);font-size:16px;letter-spacing:0.1em;
  cursor:pointer;transition:all 0.2s;
}
.drawer-del-btn:hover{background:rgba(255,68,102,0.18)}

/* ── CONFIRM MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;
  display:flex;align-items:center;justify-content:center;
}
.modal-box{
  width:400px;padding:36px;
  background:linear-gradient(155deg,rgba(24,34,64,0.98) 0%,rgba(9,13,30,0.99) 100%);
  border:1px solid rgba(255,68,102,0.35);
  box-shadow:inset 1px 1px 0 rgba(255,68,102,0.15),0 24px 64px rgba(0,0,0,0.9);
}
.modal-title{font-family:var(--font-display);font-size:22px;letter-spacing:0.08em;color:var(--red);margin-bottom:12px}
.modal-body{font-family:var(--font-mono);font-size:12px;color:var(--mute);line-height:1.7;margin-bottom:28px}
.modal-body strong{color:var(--text)}
.modal-actions{display:flex;gap:12px}
.modal-cancel{
  flex:1;padding:12px;background:none;border:1px solid var(--border);
  color:var(--mute);font-family:var(--font-mono);font-size:12px;cursor:pointer;transition:all 0.2s;
}
.modal-cancel:hover{border-color:var(--border-bright);color:var(--text)}
.modal-confirm{
  flex:1;padding:12px;background:rgba(255,68,102,0.15);border:1px solid rgba(255,68,102,0.4);
  color:var(--red);font-family:var(--font-display);font-size:16px;letter-spacing:0.1em;cursor:pointer;transition:all 0.2s;
}
.modal-confirm:hover{background:rgba(255,68,102,0.28)}

/* ── ANALYTICS ── */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.chart-card{
  padding:24px;background:var(--surface);border:1px solid var(--border);
  box-shadow:inset 1px 1px 0 rgba(0,200,255,0.1),inset -1px -1px 0 rgba(0,0,0,0.5);
}
.chart-title{font-family:var(--font-display);font-size:14px;letter-spacing:0.1em;color:var(--text);margin-bottom:20px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{font-family:var(--font-mono);font-size:10px;color:var(--mute);width:90px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.1em}
.bar-track{flex:1;height:6px;background:rgba(255,255,255,0.06);position:relative}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),rgba(0,200,255,0.4));transition:width 0.8s ease}
.bar-fill.amber{background:linear-gradient(90deg,var(--amber),rgba(255,184,0,0.4))}
.bar-fill.green{background:linear-gradient(90deg,var(--green),rgba(0,255,136,0.4))}
.bar-count{font-family:var(--font-mono);font-size:10px;color:var(--dim);width:30px;text-align:right}

/* ── HEALTH ── */
.health-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.health-card{padding:24px;background:var(--surface);border:1px solid var(--border)}
.health-title{font-family:var(--font-display);font-size:14px;letter-spacing:0.1em;color:var(--text);margin-bottom:16px}
.health-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.04)}
.health-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.health-key{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:0.1em}
.health-val{font-family:var(--font-mono);font-size:10px;color:var(--text)}
.health-val.ok{color:var(--green)}
.health-val.warn{color:var(--amber)}
.health-val.cyan{color:var(--cyan-dim)}

/* ── LOADING / EMPTY ── */
.loading{padding:60px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--mute)}
.empty{padding:60px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--dim)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;right:28px;z-index:500;
  padding:12px 20px;font-family:var(--font-mono);font-size:12px;
  background:rgba(0,255,136,0.12);border:1px solid rgba(0,255,136,0.3);color:var(--green);
  animation:toastIn 0.3s ease;
}
.toast.error{background:rgba(255,68,102,0.12);border-color:rgba(255,68,102,0.3);color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">STUDIOYOU</div>
    <div class="gate-sub">ADMIN CONSOLE · RESTRICTED ACCESS</div>
    <input class="gate-input" type="password" id="gate-pw" placeholder="Password" autocomplete="off"/>
    <button class="gate-btn" onclick="checkGate()">ENTER</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app"></div>

<script>
const ADMIN_PW = 'Cre8tivepeeps!';

document.getElementById('gate-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkGate();
});

function checkGate() {
  const pw = document.getElementById('gate-pw').value;
  if (pw === ADMIN_PW) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    window._mountAdmin();
  } else {
    document.getElementById('gate-err').textContent = 'Access denied.';
    document.getElementById('gate-pw').value = '';
  }
}
</script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = 'https://studioyou-api-198959034459.us-east1.run.app';
const ADMIN_KEY = 'SY-ADMIN-2026';

const headers = { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_KEY };

function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) +
    ' ' + d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
}

function TierBadge({ tier }) {
  const t = (tier || '').toLowerCase();
  return <span className={`tier-badge ${t || 'none'}`}>{tier || 'No tier'}</span>;
}

function Toast({ msg, type, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3000); return () => clearTimeout(t); }, []);
  return <div className={`toast ${type === 'error' ? 'error' : ''}`}>{msg}</div>;
}

// ── SUBSCRIBERS TAB ──────────────────────────────────────────────────────────
function SubscribersTab({ users, loading, onRefresh, onDelete }) {
  const [search, setSearch] = useState('');
  const [tierFilter, setTierFilter] = useState('all');
  const [selected, setSelected] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);

  const filtered = (users || []).filter(u => {
    const q = search.toLowerCase();
    const matchQ = !q ||
      (u.email || '').toLowerCase().includes(q) ||
      (u.first_name || '').toLowerCase().includes(q) ||
      (u.last_name || '').toLowerCase().includes(q) ||
      (u.studio_name || '').toLowerCase().includes(q);
    const tier = ((u.data || {}).tier || '').toLowerCase();
    const matchT = tierFilter === 'all' || tier === tierFilter;
    return matchQ && matchT;
  });

  function handleDelete(u, e) {
    e.stopPropagation();
    setDeleteTarget(u);
  }

  function confirmDelete() {
    onDelete(deleteTarget.email);
    if (selected && selected.email === deleteTarget.email) setSelected(null);
    setDeleteTarget(null);
  }

  function getFormation(u) {
    try {
      const fd = typeof u.formation_data === 'string' ? JSON.parse(u.formation_data) : (u.formation_data || []);
      return Array.isArray(fd) ? fd : [];
    } catch { return []; }
  }

  return (
    <div>
      <div className="search-bar">
        <input className="search-input" placeholder="Search name, email, studio..." value={search} onChange={e => setSearch(e.target.value)} />
        <select className="filter-select" value={tierFilter} onChange={e => setTierFilter(e.target.value)}>
          <option value="all">All Tiers</option>
          <option value="independent">Independent</option>
          <option value="operator">Operator</option>
          <option value="player">Player</option>
          <option value="">No Tier</option>
        </select>
        <button className="refresh-btn" onClick={onRefresh}>↺ REFRESH</button>
      </div>

      <div className="section-header">
        <div className="section-title">SUBSCRIBERS</div>
        <div className="section-count">{filtered.length} of {(users||[]).length} records</div>
      </div>

      {loading ? (
        <div className="loading">Loading...</div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Studio</th>
                <th>Tier</th>
                <th>Billing</th>
                <th>Subscribed</th>
                <th>Formed</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.length === 0 ? (
                <tr><td colSpan={8} className="empty">No records found</td></tr>
              ) : filtered.map(u => {
                const data = u.data || {};
                const tier = data.tier || '';
                const billing = data.billing || '';
                const subAt = data.subscribed_at;
                return (
                  <tr key={u.email} onClick={() => setSelected(u)}>
                    <td>{[u.first_name, u.last_name].filter(Boolean).join(' ') || '—'}</td>
                    <td className="email">{u.email}</td>
                    <td className="mute">{u.studio_name || '—'}</td>
                    <td><TierBadge tier={tier} /></td>
                    <td className="mute">{billing || '—'}</td>
                    <td className="mute">{fmt(subAt)}</td>
                    <td className="mute">{fmt(u.created_at)}</td>
                    <td><button className="del-btn" onClick={e => handleDelete(u, e)}>DELETE</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* Detail Drawer */}
      {selected && (
        <div className="drawer-overlay" onClick={() => setSelected(null)}>
          <div className="drawer" onClick={e => e.stopPropagation()}>
            <div className="drawer-header">
              <div>
                <div className="drawer-name">{[selected.first_name, selected.last_name].filter(Boolean).join(' ') || 'Unknown'}</div>
                <div className="drawer-email">{selected.email}</div>
              </div>
              <button className="drawer-close" onClick={() => setSelected(null)}>CLOSE</button>
            </div>

            <div className="drawer-section">
              <div className="drawer-section-title">Studio</div>
              <div className="drawer-row"><span className="drawer-key">Studio Name</span><span className="drawer-val">{selected.studio_name || '—'}</span></div>
              <div className="drawer-row"><span className="drawer-key">Archetype</span><span className="drawer-val">{selected.archetype || '—'}</span></div>
              <div className="drawer-row"><span className="drawer-key">Brand Story</span><span className="drawer-val">{selected.brand_story || '—'}</span></div>
            </div>

            <div className="drawer-section">
              <div className="drawer-section-title">Subscription</div>
              <div className="drawer-row"><span className="drawer-key">Tier</span><span className="drawer-val"><TierBadge tier={(selected.data||{}).tier} /></span></div>
              <div className="drawer-row"><span className="drawer-key">Billing</span><span className="drawer-val">{(selected.data||{}).billing || '—'}</span></div>
              <div className="drawer-row"><span className="drawer-key">Subscribed</span><span className="drawer-val">{fmtTime((selected.data||{}).subscribed_at)}</span></div>
            </div>

            <div className="drawer-section">
              <div className="drawer-section-title">Account</div>
              <div className="drawer-row"><span className="drawer-key">Created</span><span className="drawer-val">{fmtTime(selected.created_at)}</span></div>
              <div className="drawer-row"><span className="drawer-key">Verified</span><span className="drawer-val">{fmtTime(selected.verified_at)}</span></div>
              <div className="drawer-row"><span className="drawer-key">Updated</span><span className="drawer-val">{fmtTime(selected.updated_at)}</span></div>
              <div className="drawer-row"><span className="drawer-key">Deleted</span><span className="drawer-val">{selected.deleted_at ? fmtTime(selected.deleted_at) : <span style={{color:'var(--green)'}}>Active</span>}</span></div>
            </div>

            {getFormation(selected).length > 0 && (
              <div className="drawer-section">
                <div className="drawer-section-title">Formation Answers</div>
                <div className="formation-answers">
                  {getFormation(selected).map((item, i) => (
                    <div key={i}>
                      <div className="formation-q">Q{i+1} {item.question || ''}</div>
                      <div className="formation-a">{Array.isArray(item.answer) ? item.answer.join(', ') : (item.answer || '—')}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <button className="drawer-del-btn" onClick={() => { setDeleteTarget(selected); setSelected(null); }}>DELETE USER</button>
          </div>
        </div>
      )}

      {/* Confirm Delete Modal */}
      {deleteTarget && (
        <div className="modal-overlay">
          <div className="modal-box">
            <div className="modal-title">DELETE USER</div>
            <div className="modal-body">
              This will soft-delete <strong>{deleteTarget.email}</strong> and mark their record inactive. Their data remains in Supabase. This cannot be undone from the panel.
            </div>
            <div className="modal-actions">
              <button className="modal-cancel" onClick={() => setDeleteTarget(null)}>CANCEL</button>
              <button className="modal-confirm" onClick={confirmDelete}>DELETE</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ANALYTICS TAB ─────────────────────────────────────────────────────────────
function AnalyticsTab({ users }) {
  const all = users || [];
  const total = all.length;
  const withTier = all.filter(u => (u.data||{}).tier);
  const subs = withTier.length;
  const verified = all.filter(u => u.verified_at).length;
  const convRate = total > 0 ? Math.round((subs / total) * 100) : 0;

  const tierCounts = { independent: 0, operator: 0, player: 0 };
  const billingCounts = { annual: 0, monthly: 0 };
  const archetypeCounts = {};

  all.forEach(u => {
    const d = u.data || {};
    if (d.tier) tierCounts[d.tier] = (tierCounts[d.tier] || 0) + 1;
    if (d.billing) billingCounts[d.billing] = (billingCounts[d.billing] || 0) + 1;
    if (u.archetype) archetypeCounts[u.archetype] = (archetypeCounts[u.archetype] || 0) + 1;
  });

  const topArchetypes = Object.entries(archetypeCounts)
    .sort((a,b) => b[1]-a[1]).slice(0,6);
  const maxArch = topArchetypes[0]?.[1] || 1;

  // Signups by week (last 8 weeks)
  const now = new Date();
  const weeks = Array.from({length:8}, (_,i) => {
    const d = new Date(now);
    d.setDate(d.getDate() - (7 * (7-i)));
    return d;
  });
  const weekCounts = weeks.map((wStart, i) => {
    const wEnd = i < 7 ? weeks[i+1] : new Date();
    const count = all.filter(u => {
      if (!u.created_at) return false;
      const d = new Date(u.created_at);
      return d >= wStart && d < wEnd;
    }).length;
    return { label: `W${i+1}`, count };
  });
  const maxWeek = Math.max(...weekCounts.map(w => w.count), 1);

  return (
    <div>
      <div className="stat-grid">
        <div className="stat-card">
          <div className="stat-label">Total Users</div>
          <div className="stat-value">{total}</div>
          <div className="stat-sub">{verified} verified</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Subscribers</div>
          <div className="stat-value">{subs}</div>
          <div className="stat-sub">with tier selected</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Conversion</div>
          <div className="stat-value" style={{color:'var(--green)'}}>{convRate}%</div>
          <div className="stat-sub">formation → tier</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Annual</div>
          <div className="stat-value" style={{color:'var(--amber)'}}>{billingCounts.annual||0}</div>
          <div className="stat-sub">{billingCounts.monthly||0} monthly</div>
        </div>
      </div>

      <div className="analytics-grid">
        <div className="chart-card">
          <div className="chart-title">TIER BREAKDOWN</div>
          {[
            { label:'INDEPENDENT', count: tierCounts.independent||0, cls:''},
            { label:'OPERATOR',    count: tierCounts.operator||0,    cls:'amber'},
            { label:'PLAYER',      count: tierCounts.player||0,      cls:'green'},
          ].map(({label,count,cls}) => (
            <div key={label} className="bar-row">
              <span className="bar-label">{label}</span>
              <div className="bar-track">
                <div className={`bar-fill ${cls}`} style={{width: subs > 0 ? `${(count/subs)*100}%` : '0%'}} />
              </div>
              <span className="bar-count">{count}</span>
            </div>
          ))}
        </div>

        <div className="chart-card">
          <div className="chart-title">SIGNUPS BY WEEK</div>
          {weekCounts.map(({label,count}) => (
            <div key={label} className="bar-row">
              <span className="bar-label">{label}</span>
              <div className="bar-track">
                <div className="bar-fill" style={{width:`${(count/maxWeek)*100}%`}} />
              </div>
              <span className="bar-count">{count}</span>
            </div>
          ))}
        </div>

        <div className="chart-card">
          <div className="chart-title">BILLING SPLIT</div>
          {[
            { label:'ANNUAL',  count: billingCounts.annual||0,  cls:'green'},
            { label:'MONTHLY', count: billingCounts.monthly||0, cls:'amber'},
          ].map(({label,count,cls}) => (
            <div key={label} className="bar-row">
              <span className="bar-label">{label}</span>
              <div className="bar-track">
                <div className={`bar-fill ${cls}`} style={{width: subs > 0 ? `${(count/subs)*100}%` : '0%'}} />
              </div>
              <span className="bar-count">{count}</span>
            </div>
          ))}
        </div>

        <div className="chart-card">
          <div className="chart-title">TOP ARCHETYPES</div>
          {topArchetypes.length === 0 ? (
            <div className="empty" style={{padding:'20px 0'}}>No archetype data yet</div>
          ) : topArchetypes.map(([arch,count]) => (
            <div key={arch} className="bar-row">
              <span className="bar-label" style={{fontSize:'9px'}}>{arch.substring(0,14)}</span>
              <div className="bar-track">
                <div className="bar-fill" style={{width:`${(count/maxArch)*100}%`}} />
              </div>
              <span className="bar-count">{count}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── ROOT APP ─────────────────────────────────────────────────────────────────
function AdminApp() {
  const [tab, setTab] = useState('subscribers');
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);

  const loadUsers = useCallback(() => {
    setLoading(true);
    fetch(`${API}/api/admin/users`, { headers })
      .then(r => r.json())
      .then(d => {
        setUsers(d.users || []);
        setLoading(false);
      })
      .catch(err => {
        setToast({ msg: 'Failed to load users: ' + err.message, type: 'error' });
        setLoading(false);
      });
  }, []);

  useEffect(() => { loadUsers(); }, []);

  function handleDelete(email) {
    fetch(`${API}/api/admin/users/delete`, {
      method: 'POST', headers,
      body: JSON.stringify({ email })
    })
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          setUsers(prev => prev.filter(u => u.email !== email));
          setToast({ msg: `${email} deleted.`, type: 'ok' });
        } else {
          setToast({ msg: d.error || 'Delete failed.', type: 'error' });
        }
      })
      .catch(() => setToast({ msg: 'Delete failed.', type: 'error' }));
  }

  const now = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });

  return (
    <>
      <div className="topbar">
        <div className="topbar-left">
          <div className="topbar-logo">STUDIOYOU</div>
          <div className="topbar-badge">ADMIN</div>
        </div>
        <div className="topbar-right">SuperCreativePeople, Inc. · <span>{now}</span></div>
      </div>

      <div className="nav">
        {[['subscribers','SUBSCRIBERS'],['analytics','ANALYTICS'],['health','APP HEALTH']].map(([id,label]) => (
          <div key={id} className={`nav-tab ${tab===id?'active':''}`} onClick={() => setTab(id)}>{label}</div>
        ))}
      </div>

      <div className="content">
        {tab === 'subscribers' && (
          <SubscribersTab users={users} loading={loading} onRefresh={loadUsers} onDelete={handleDelete} />
        )}
        {tab === 'analytics' && (
          <>
            <div className="section-header" style={{marginBottom:24}}>
              <div className="section-title">ANALYTICS</div>
              <div className="section-count">Derived from {users.length} records</div>
            </div>
            <AnalyticsTab users={users} />
          </>
        )}
        {tab === 'health' && (
          <>
            <div className="section-header" style={{marginBottom:24}}>
              <div className="section-title">APP HEALTH</div>
            </div>
            <HealthTab />
          </>
        )}
      </div>

      {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}
    </>
  );
}

window._mountAdmin = function() {
  ReactDOM.render(<AdminApp />, document.getElementById('app'));
};
</script>
