  --border-m: rgba(0,200,255,0.14);
  --border-h: rgba(0,200,255,0.22);
  --ghost:    rgba(240,242,255,0.06);
}
html, body, #root { height: 100%; }
body {
  background: var(--black); color: var(--white);
  font-family: 'Outfit', sans-serif; font-weight: 300;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}

  background-size: 256px; pointer-events: none; z-index: 9999;
}
.amb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
.amb-1 { top:-20vh; left:-10vw; width:70vw; height:70vh; background: radial-gradient(ellipse,rgba(0,200,255,0.04) 0%,transparent 70%); }
.amb-2 { bottom:-10vh; right:-15vw; width:60vw; height:60vh; background: radial-gradient(ellipse,rgba(123,53,212,0.05) 0%,transparent 70%); }

/* ── PAGE SHELL ───────────────────────────────────────────────────────── */
.page { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 10; }

/* ── TOPBAR ───────────────────────────────────────────────────────────── */
.topbar {

.tb-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 0.26em;
  background: var(--gradT); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

.status-pill  { display: flex; align-items: center; gap: 7px; }

.reactor-btn {

/* ── BODY ─────────────────────────────────────────────────────────────── */
.body { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* ── LEFT RAIL ────────────────────────────────────────────────────────── */
.left-rail {

.arch-card-name  { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.08em; line-height: 1.1; color: var(--white); }
.arch-card-badge {

.video-area {
  flex: 1; display: flex; flex-direction: column;

}

/* static background */
.video-bg {

@keyframes kbZoom { from { transform: scale(1.0); } to { transform: scale(1.07); } }
.video-bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom,rgba(6,9,26,0.78) 0%,rgba(6,9,26,0.52) 38%,rgba(6,9,26,0.72) 82%,rgba(6,9,26,0.97) 100%);
}
.video-bg::before {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(to right,rgba(6,9,26,0.65) 0%,transparent 55%);
}

/* helios stream */
.helios-video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 1; pointer-events: none;
  transition: opacity 1.4s ease;
}

/* content overlay */
.video-content {

.video-eyebrow {

.video-eyebrow::before { content: ''; width: 18px; height: 1px; background: var(--green); opacity: 0.5; }
.video-title {

.video-spacer { flex: 1; }

/* status bar at bottom of video content */
.video-statusbar {

.vsb-name  { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.06em; color: var(--white); }

  margin-top: 14px; padding: 10px 14px;
  border: 1px solid rgba(255,107,107,0.3); background: rgba(255,107,107,0.05);

  display: flex; align-items: flex-start; gap: 8px;

/* ── ANIMATIONS ───────────────────────────────────────────────────────── */
@keyframes pg     { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(76,255,145,0.4)} 50%{opacity:0.7;box-shadow:0 0 0 5px rgba(76,255,145,0)} }

}

// Status display config
const STATUS = {
  idle:       { text: 'SELECT A CREATOR TYPE', color: '#7a7c94',       dot: 'rgba(0,200,255,0.35)', anim: 'none' },
  connecting: { text: 'CONNECTING TO HELIOS',  color: 'var(--cyan)',   dot: 'var(--cyan)',          anim: 'pgCyan 2s infinite' },
  waiting:    { text: 'GPU WARMING UP',         color: 'var(--gold)',   dot: 'var(--gold)',          anim: 'pgGold 1.4s ease-in-out infinite' },
  live:       { text: 'HELIOS LIVE',            color: 'var(--green)',  dot: 'var(--green)',         anim: 'pg 2s infinite' },
  error:      { text: 'CONNECTION ERROR',       color: 'rgba(255,107,107,0.8)', dot: 'rgba(255,107,107,0.8)', anim: 'none' },
};

function ArchetypesPage() {
  const [selected, setSelected]       = useState(null);   // archetype id
  const [heliosState, setHeliosState] = useState('idle');
  const [errorMsg, setErrorMsg]       = useState(null);

  const videoRef      = useRef(null);
  const reactorRef    = useRef(null);
  const sessionTimer  = useRef(null);
  const mountedRef    = useRef(true);

  // Cleanup helper — disconnect reactor + clear timers
  function cleanup() {
    if (sessionTimer.current) { clearTimeout(sessionTimer.current); sessionTimer.current = null; }
    if (reactorRef.current) {
      try { reactorRef.current.disconnect(); } catch(_) {}
      reactorRef.current = null;
    }
    window._heliosReactor = null;
  }

  useEffect(() => {
    mountedRef.current = true;
    return () => {
      mountedRef.current = false;
      cleanup();
    };
  }, []);

  // Pause/resume on tab visibility
  useEffect(() => {
    const onVis = () => {
      if (!reactorRef.current) return;
      const cmd = document.hidden ? 'pause' : 'resume';
      reactorRef.current.sendCommand(cmd, {}).catch(() => {});
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  async function selectArchetype(archetype) {
    // Tear down previous session first
    cleanup();
    if (videoRef.current) { videoRef.current.srcObject = null; }

    setSelected(archetype.id);
    setHeliosState('connecting');
    setErrorMsg(null);

    try {
      // 1 — Token from backend
      const tokenRes = await fetch(`${API_URL}/api/reactor/token`);
      if (!tokenRes.ok) throw new Error(`Token request failed (${tokenRes.status})`);
      const { token } = await tokenRes.json();
      if (!token) throw new Error('No token returned from backend');

      // 2 — Wait for SDK module (polled; module runs async parallel to Babel)
      let attempts = 0;
      while (!window._Reactor && attempts < 50) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
      }
      if (!window._Reactor) throw new Error('Reactor SDK did not load');

      // 3 — Create reactor instance
      const reactor = new window._Reactor({ modelName: 'helios' });
      reactorRef.current = reactor;
      window._heliosReactor = reactor;

      // Track stream ref — may arrive before or after start()
      let reactorStream = null;
      const attachStream = (stream) => {
        reactorStream = stream;
        if (videoRef.current) videoRef.current.srcObject = stream;
      };

      reactor.on('trackReceived', (_name, _track, stream) => {
        attachStream(stream);
      });

      reactor.on('statusChanged', (status) => {
        if (status === 'waiting' && mountedRef.current) setHeliosState('waiting');
      });

      reactor.on('error', (error) => {
        console.warn('[Helios] error:', error.code, error.message);
        if (error.recoverable) {
          setTimeout(() => {
            if (reactorRef.current) reactorRef.current.reconnect().catch(() => {});
          }, (error.retryAfter || 3) * 1000);
        }
      });

      // 4 — Connect
      await reactor.connect(token);

      // 5 — Wait for ready
      await new Promise((resolve, reject) => {
        if (reactor.getStatus() === 'ready') { resolve(); return; }
        const onStatus = (status) => {
          if (status === 'ready') { reactor.off('statusChanged', onStatus); resolve(); }
        };
        reactor.on('statusChanged', onStatus);
        setTimeout(() => {
          reactor.off('statusChanged', onStatus);
          reject(new Error('Timed out waiting for GPU'));
        }, 30000);
      });

      if (!mountedRef.current) return;

      // 6 — Reference image (per-archetype, best-effort — skip silently on failure)
      if (archetype.refImage) {
        try {
          const imgRes  = await fetch('https://studioyou.app/' + archetype.refImage);
          const imgBlob = await imgRes.blob();
          const imgFile = new File([imgBlob], archetype.refImage.split('/').pop(), { type: 'image/jpeg' });
          const ref     = await reactor.uploadFile(imgFile);
          await reactor.sendCommand('set_image', { image: ref });
        } catch(imgErr) {
          console.warn('[Helios] Ref image skipped:', imgErr.message);
        }
      }

      // 7 — Schedule prompts + start
      // Schedule all 5 acts upfront, 6 chunks apart (~6s each = 30s of explicit direction)
      const acts = [archetype.act1, archetype.act2, archetype.act3, archetype.act4, archetype.act5];
      for (let i = 0; i < acts.length; i++) {
        await reactor.sendCommand('schedule_prompt', { prompt: acts[i], chunk: i * 6 });
      }
      await reactor.sendCommand('start', {});

      // 8 — Play video
      if (mountedRef.current && videoRef.current) {
        if (reactorStream) videoRef.current.srcObject = reactorStream;
        try { await videoRef.current.play(); } catch(_) {}
      }

      if (mountedRef.current) setHeliosState('live');

      // 9 — Prompt cycling on chunk boundary — cycles from the full 5-act pool
      let actIndex = 0;
      reactor.on('message', (msg) => {
        if (msg.type === 'event' && msg.data?.event === 'prompt_switched') {
          actIndex = (actIndex + 1) % acts.length;
          const nextChunk = msg.data.chunk + 6;
          reactor.sendCommand('schedule_prompt', { prompt: acts[actIndex], chunk: nextChunk }).catch(() => {});
        }
      });

      // 10 — 3-minute session limit
      sessionTimer.current = setTimeout(() => {
        try { reactor.sendCommand('pause', {}); } catch(_) {}
        if (mountedRef.current) setHeliosState('idle');
      }, SESSION_LIMIT_MS);

    } catch(err) {
      console.error('[Helios] init failed:', err);
      if (mountedRef.current) {
        setHeliosState('error');
        setErrorMsg(err.message);
      }
    }
  }

  const sc           = STATUS[heliosState] || STATUS.idle;
  const activeArch   = ARCHETYPES.find(a => a.id === selected);

  // badge on active card
  const badgeState = heliosState === 'live' ? 'live'
                   : (heliosState === 'waiting') ? 'generating'
                   : (heliosState === 'connecting') ? 'connecting'
                   : null;
  const badgeText  = heliosState === 'live' ? 'LIVE'
                   : heliosState === 'waiting' ? 'BUILDING'
                   : heliosState === 'connecting' ? 'LINKING'
                   : null;

  return (
    <div className="page">

      {/* TOPBAR */}
      <div className="topbar">
        <div className="topbar-left">
          <div className="tb-logo">
            <img src="assets/SY_LOGO_2D_OFFICIAL.png" alt="StudioYou" />
          </div>
          <div className="tb-sep" />
          <div className="tb-title">Creator Archetypes</div>
        </div>
        <div className="topbar-right">
          <div className="status-pill">
            <div className="status-dot" style={{background:sc.dot, animation:sc.anim}} />
            <span className="status-text" style={{color:sc.color}}>{sc.text}</span>
          </div>
          <div className="tb-sep" />
          <div className="reactor-btn" onClick={()=>window.open('https://www.reactor.inc','_blank')}>
            <img src="assets/reactor-logo-dark.svg" alt="Reactor" />
          </div>
        </div>
      </div>

      {/* BODY */}
      <div className="body">

        {/* LEFT RAIL */}
        <div className="left-rail">
          <div className="rail-head">
            <div className="rail-eyebrow">Creator Type</div>
            <div className="rail-sub">Select to generate your studio world with Helios.</div>
          </div>
          <div className="rail-list">
            {ARCHETYPES.map(a => {
              const isActive = selected === a.id;
              const showBadge = isActive && !!badgeState;
              return (
                <div
                  key={a.id}
                  className={"arch-card" + (isActive ? " active" : "")}
                  onClick={() => selectArchetype(a)}
                  role="button"
                  tabIndex={0}
                  onKeyDown={e => { if (e.key === 'Enter') selectArchetype(a); }}
                >
                  <div className="arch-card-row">
                    <div className="arch-card-name">{a.label}</div>
                    {showBadge && (
                      <div className={"arch-card-badge badge-" + badgeState}>{badgeText}</div>
                    )}
                  </div>
                  <div className="arch-card-mood">{a.mood}</div>
                </div>
              );
            })}
          </div>
        </div>

        {/* VIDEO AREA */}
        <div className="video-area">
          <div className="video-bg" />

          <video
            ref={videoRef}
            autoPlay
            muted
            playsInline
            className="helios-video"
            style={{opacity: heliosState === 'live' ? 1 : 0.01}}
          />

          {/* Reactor brand overlay — generative filmmaker only, live only */}
          {selected === 'generative_filmmaker' && heliosState === 'live' && (
            <div className="reactor-overlay">
              <img src="assets/reactor-logo-dark.svg" alt="Reactor" />
              <span className="reactor-overlay-label">Powered by Reactor</span>
            </div>
          )}

          <div className="video-content">
            {!selected ? (
              /* Initial idle — nothing selected */
              <div className="idle-wrap">
                <div className="idle-label">Helios · Real-Time World Generation</div>
                <div className="idle-text">
                  Select a creator type to generate your studio world. Each archetype renders a unique cinematic environment — built live, shaped by your creative identity.
                </div>
              </div>
            ) : (
              /* Archetype selected — show info + status */
              <>
                <div className="video-eyebrow fade-up">Helios World Engine</div>
                <div className="video-title fade-up">{activeArch ? activeArch.label : ''}</div>
                <div className="video-mood fade-up">{activeArch ? activeArch.mood : ''}</div>
                {heliosState === 'error' && (
                  <div className="error-strip fade-up">
                    <span style={{flexShrink:0}}>⚠</span>
                    <span>{errorMsg || "Connection failed. Select the archetype again to retry."}</span>
                  </div>
                )}
                <div className="video-spacer" />
                <div className="video-statusbar">
                  <div className="vsb-left">
                    <div className="status-dot" style={{background:sc.dot, animation:sc.anim}} />
                    <div className="vsb-state" style={{color:sc.color}}>{sc.text}</div>
                  </div>
                  {activeArch && (
                    <div className="vsb-right">
                      <div className="vsb-name">{activeArch.label}</div>
                      <div className="vsb-mood">{activeArch.mood}</div>
                    </div>
                  )}
                </div>
              </>
            )}
          </div>
        </div>

      </div>{/* end body */}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ArchetypesPage />);
</script>
