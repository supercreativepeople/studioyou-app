  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [namingMode,setNamingMode]=useState(false);
  const [namePills,setNamePills]=useState([]);
  const [nameCustom,setNameCustom]=useState('');
  const [nameSelected,setNameSelected]=useState('');
  const [isFresh,setIsFresh]=useState(false);
  const [sessionId,setSessionId]=useState(localStorage.getItem('sy_session_id')||null);
  const [exchangeCount,setExchangeCount]=useState(0);
  const [closerOffered,setCloserOffered]=useState(false);
  const [closerLoading,setCloserLoading]=useState(false);
  // Scripted triage — FY on the dashboard is a router. Two fixed questions,
  // no model in the loop until the routing call. 'idle'|'q1'|'q2'|'routing'|'done'
  const [triageStage, setTriageStage]=useState('idle');
  const [pillsVisible, setPillsVisible]=useState(false);
  const triageBranch=useRef('idea');
  const threadRef=useRef(null);
  const inputRef=useRef(null);
  const twRef=useRef(null);
  const awaitingBrandProbe=useRef(false); // true after FY asks "why that name"
  const email=localStorage.getItem('sy_email')||'';

  useEffect(()=>{
    const fresh=localStorage.getItem('sy_fresh_formation')==='true';
    setIsFresh(fresh);
    const stored=localStorage.getItem('sy_first_words');
    const r=localStorage.getItem('sy_recommended_building');
    if(r) onRec(r);
    if(fresh){ localStorage.removeItem('sy_fresh_formation'); setStatus('loading'); generate(); }
    else if(stored){ setStatus('loading'); returnGreeting(stored,r||''); }
    else { setStatus('ready'); }
  },[]);

  useEffect(()=>{ if(threadRef.current) threadRef.current.scrollTop=threadRef.current.scrollHeight; },[messages,loading,triageStage]);
  useEffect(()=>{ if(triageStage!=='q1') setPillsVisible(false); },[triageStage]);

  // ── Scripted triage ─────────────────────────────────────────────────────
  const TRIAGE_Q1="Do you have an idea, a treatment, or a script?";
  // Per-archetype Q1 pill sets. Every archetype below is a placeholder using
  // the same idea/treatment/script split — this is plumbing, not content.
  // Lee's methodology transfer (which archetypes actually route on this
  // three-way split vs. a different first question) still needs to happen,
  // same pattern as the PLAN/Vault specs. An archetype with no entry here
  // gets no Q1 pills at all — question still asks, answer just typed free-text.
  const ARCHETYPE_TRIAGE_PILLS={
    filmmaker:['An idea','A treatment','A script'],
    documentarian:['An idea','A treatment','A script'],
    content_creator:['An idea','A treatment','A script'],
    podcaster:['An idea','A treatment','A script'],
    musician:['An idea','A treatment','A script'],
    influencer:['An idea','A treatment','A script'],
  };
  function getTriagePills(){
    var arch=concludeArchetype().id;
    return ARCHETYPE_TRIAGE_PILLS[arch]||null;
  }

  function saveConv(list){
    var conv=list.filter(function(m){return m.content&&m.content!=='__CLOSER__';}).map(function(m){return {role:m.role==='user'?'user':'fy',text:m.content};});
    localStorage.setItem('sy_fy_conversation',JSON.stringify(conv));
  }
  function classifyBranch(t){
    // Picks Q2 flavor only — routing always runs on the raw text, so
    // non-linear archetypes (visual series, podcast, etc.) fall through to
    // the idea branch and Fable routes them on content.
    var m=t.toLowerCase();
    if(/\bscript\b|screenplay|shooting draft/.test(m)) return 'script';
    if(/treatment|outline|bible|beat sheet/.test(m)) return 'treatment';
    return 'idea';
  }

  // Kick Q1 the moment first words finish and the conversation is empty.
  useEffect(function(){
    if(status==='ready'&&triageStage==='idle'&&messages.length===0){
      var t=setTimeout(function(){
        setMessages([{role:'assistant',content:TRIAGE_Q1}]);
        speakLine(TRIAGE_Q1);
        setTriageStage('q1');
        // Pills surface only after FY finishes speaking the question, not
        // alongside it. No completion callback exists from session.say() over
        // the data channel, so this estimates playout the same way the
        // handoff-to-studio navigation does: longer hold when the avatar is
        // actually live and speaking, shorter when it's text-only.
        var avatarLive=window._fyRoom&&window._fyRoom.state==='connected';
        var speechDelay=avatarLive?4000:1600;
        var pt=setTimeout(function(){ setPillsVisible(true); },speechDelay);
        t._pillTimer=pt;
      },700);
      return function(){clearTimeout(t);if(t._pillTimer)clearTimeout(t._pillTimer);};
    }
  },[status,triageStage,messages.length]);

  async function handleTriageAnswer(msg){
    var updated=[...messages,{role:'user',content:msg}];
    setMessages(updated); saveConv(updated);
    if(triageStage==='q1'){
      var br=classifyBranch(msg); triageBranch.current=br;
      var q2= br==='script' ? "What's the one sentence — and what do you need next?"
        : br==='treatment' ? "What's the one sentence — and what's the treatment still missing?"
        : "What's the one sentence — the logline that describes your basic idea?";
      var withQ2=[...updated,{role:'assistant',content:q2}];
      setMessages(withQ2); saveConv(withQ2); speakLine(q2); setTriageStage('q2');
    } else {
      var chartingLine = "I've got enough to start with. I'm charting your course now — give me a few moments.";
      var withCharting=[...updated,{role:'assistant',content:chartingLine}];
      setMessages(withCharting); saveConv(withCharting); speakLine(chartingLine);
      setTriageStage('routing');
      var sid=sessionId; if(!sid) sid=await startSession();
      routeNow(updated,sid);
    }
  }
  function localFallbackRoute(){
    // Deterministic route when the orchestrator fails twice — never strand the creator.
    // idea/treatment branches skip past the step that just re-asks the one-sentence
    // logline triage already captured — same rule as SESSION_CLOSER_PROMPT in main.py.
    var br=triageBranch.current;
    if(br==='script') return {success:true,building_slug:'develop',section_name:'Script & Content',step_title:"What's the Structure?"};
    if(br==='treatment') return {success:true,building_slug:'develop',section_name:'Story & Structure',step_title:"Who's It For?"};
    return {success:true,building_slug:'ideate',section_name:'Gut Check',step_title:'Does This Have Legs?'};
  }
  async function routeNow(msgsUi,sid){
    var msgs=msgsUi.filter(function(m){return m.content&&m.content!=='__CLOSER__';}).map(function(m){return {role:m.role==='user'?'user':'assistant',content:m.content};});
    var d=await closeSession(msgs,sid);
    if(!d) d=await closeSession(msgs,sid); // one silent retry
    if(!d){ console.warn('[FY] routing failed twice — deterministic fallback'); d=localFallbackRoute(); }
    announceAndGo(d);
  }
  function announceAndGo(d){
    setTriageStage('done');
    var b=BUILDINGS.find(function(x){return x.id===d.building_slug;});
    var title=b?b.title:String(d.building_slug||'IDEATE').toUpperCase();
    var line="Let's move into "+title+" — I'll show you exactly where to start.";
    setMessages(function(p){var n=[...p,{role:'assistant',content:line}];saveConv(n);return n;});
    speakLine(line);
    if(onPlanReady) onPlanReady(d);
  }

  async function generate() {
    try {
      const b=briefing||{};
      const payload={first_name:firstName||'',last_name:localStorage.getItem('sy_last_name')||'',studio_name:studioName||'',email:localStorage.getItem('sy_email')||'',arsenal:normalizePill(b.arsenal),roadblock:normalizePill(b.roadblock),horizon:normalizePill(b.horizon),briefing_answers:buildQ(formation||[])};
      const res=await fetch(`${API_URL}/api/formation/initialize`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const data=await res.json();
      if(data.success&&data.first_words){
        localStorage.setItem('sy_first_words',data.first_words);
        if(data.recommended_building){localStorage.setItem('sy_recommended_building',data.recommended_building);onRec(data.recommended_building);}
        if(data.archetype) localStorage.setItem('sy_archetype',data.archetype);
        if(data.phase) localStorage.setItem('sy_phase',data.phase);
        setFw(data.first_words); setStatus('pre_reveal'); setTimeout(()=>{ setStatus('typing'); typewrite(data.first_words); }, 2200);
      } else throw new Error('no first_words');
    } catch(e){
      const fb="Your briefing is in. FutureYou has everything it needs. The studio is open — let's get to work.";
      setFw(fb); setDisplayed(fb); setStatus('ready');
    }
  }

  async function returnGreeting(firstWords,recBuilding) {
    try {
      const b=briefing||{};
      const arch=localStorage.getItem('sy_archetype')||'';
      const ctx=(Array.isArray(formation)?formation:[]).map((a,i)=>`Q${i+1}: ${a||'(no answer)'}`).join('\n');
      const returnPrompt=["You are FutureYou — this creator's future self, back to guide the build.","The creator completed their formation briefing and saw your first words. They have now returned to their studio.",`Studio: ${studioName||'(unnamed)'} | Archetype: ${arch}`,`Arsenal: ${normalizePill(b.arsenal)} | Roadblock: ${normalizePill(b.roadblock)} | Horizon: ${normalizePill(b.horizon)}`,`Your previous recommendation: ${recBuilding||'not set'}`,`Formation Q&A:\n${ctx}`,"","Write a 2-3 sentence return greeting. Acknowledge they are back. Reference the specific building you recommended by name. Ask if they want to pick up there or go a different direction.","Peer register. No filler. No exclamation marks. No hedging. Under 60 words."].join("\n");
      const res=await fetch(API_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:'I am back.'}],system:returnPrompt,email:localStorage.getItem('sy_email')||''})});
      const data=await res.json();
      const reply=(data.response||data.message||'').trim();
      if(reply){ setFw(reply); setStatus('typing'); typewrite(reply); }
      else throw new Error('empty');
    } catch(e){
      const fb="You're back. The lot's open. Where do you want to start?";
      setFw(fb); setDisplayed(fb); setStatus('ready');
    }
  }

  function typewrite(text){ let i=0; setDisplayed(''); if(twRef.current) clearInterval(twRef.current); twRef.current=setInterval(()=>{i++;setDisplayed(text.slice(0,i));if(i>=text.length){clearInterval(twRef.current);setStatus('ready');}},16); }

  function sysPrompt(){
    var nl=String.fromCharCode(10);
    var b=briefing||{};
    var arch=localStorage.getItem('sy_archetype')||'';
    var ctx=(Array.isArray(formation)?formation:[]).map(function(a,i){return 'Q'+(i+1)+': '+(a||'(no answer)');}).join(nl);
    var triageOnly=[
      'You are a routing assistant for StudioYou. Your entire job is two questions — nothing else.',
      '',
      'Creator archetype: '+arch,
      'Briefing: Arsenal: '+normalizePill(b.arsenal)+' | Roadblock: '+normalizePill(b.roadblock),
      'Formation answers: '+ctx,
      '',
      'PROTOCOL - follow exactly:',
      'Message 1: Ask what they are working on. Use their archetype to make it specific. One sentence. No preamble.',
      'Message 2: Acknowledge in 3 words max. Then ask exactly: "Where are you in the process - a raw idea? a story or outline? a script? or something further along?"',
      '',
      'DO NOT: analyze ideas, ask creative questions, give feedback, make comparisons, develop concepts, or ask a third question. Route only. The conversation ends after message 2 regardless of what happens next — do not try to keep it going.'
    ];
    return triageOnly.join(nl);
  }

  function isNamingIntent(msg){ const m=msg.toLowerCase(); const noName=!studioName||studioName==='YOUR STUDIO'||studioName==='Your Studio'; const wantsName=m.includes('name')||m.includes('call my studio')||m.includes('call it')||m.includes('what should i call'); if(noName&&wantsName) return true; return m.includes('rename')||m.includes('change')||m.includes('make it')||m.includes('actually')||m.includes('instead')||m.includes('studios')||m.includes('productions')||m.includes('different')||m.includes('update the name')||m.includes('update my studio'); }
  function extractNamePills(text){ const lines=text.split('\n').map(l=>l.replace(/^[\d\-\*\.\)\s]+/,'').replace(/^[""]/,'').replace(/[""].*$/,'').trim()); return lines.filter(l=>l.length>2&&l.length<42&&/^[A-Z]/.test(l)&&!l.includes('Pick')&&!l.includes('tell me')).slice(0,3); }

  async function startSession() {
    if (sessionId) return sessionId;
    try {
      const res = await fetch(`${API_URL}/api/session/start`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email, session_type: 'text' })
      });
      const d = await res.json();
      if (d.session_id) {
        localStorage.setItem('sy_session_id', d.session_id);
        setSessionId(d.session_id);
        return d.session_id;
      }
    } catch(e) { console.warn('[FY] session start failed:', e); }
    return null;
  }

  async function closeSession(msgs, sid) {
    // Routing call only. Announcement + navigation live in announceAndGo so the
    // handoff line fires exactly once, on whichever path produced the route.
    if (!sid || msgs.length < 2) return null;
    setCloserLoading(true);
    try {
      const res = await fetch(`${API_URL}/api/session/close`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          email,
          session_id: sid,
          exchange_count: Math.ceil(msgs.length / 2),
          messages: msgs,
          project_id: localStorage.getItem('sy_active_project_id') || ''
        })
      });
      const d = await res.json();
      if (d.success) {
        localStorage.removeItem('sy_session_id');
        setSessionId(null);
        return d;
      }
    } catch(e) { console.warn('[FY] session close failed:', e); }
    finally { setCloserLoading(false); }
    return null;
  }

  async function send(){
    if(!input.trim()||loading) return;
    const msg=input.trim(); setInput('');
    const isNaming=isNamingIntent(msg);

    // Scripted triage intercepts everything except naming — no model call,
    // no agent chat, no third question possible.
    if((triageStage==='q1'||triageStage==='q2')&&!isNaming){ handleTriageAnswer(msg); return; }
    if(triageStage==='routing'||triageStage==='done') return;

    // If FY just asked "why that name" — this reply is the brand story
    if(awaitingBrandProbe.current && msg.length > 8){
      localStorage.setItem('sy_brand_story', msg);
      awaitingBrandProbe.current=false;
      // Persist cross-device — write to Supabase via update-studio
      const em=localStorage.getItem('sy_email')||'';
      if(em) fetch(API_URL+'/api/update-studio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,brand_story:msg})}).catch(()=>{});
    }

    // Start session on first exchange
    let sid = sessionId;
    if (!sid) sid = await startSession();

    const newCount = exchangeCount + 1;
    setExchangeCount(newCount);

    const updatedMsgs = [...messages, {role:'user',content:msg}];
    setMessages(updatedMsgs);
    setStatus('chat'); setLoading(true); setNamingMode(false); setNamePills([]);
    try{
      const currentName=studioName&&studioName!=='YOUR STUDIO'&&studioName!=='Your Studio'?studioName:null;
      const hasTypedName = msg.trim().length > 1 && !msg.toLowerCase().includes('help') && !msg.toLowerCase().includes('what should') && !msg.toLowerCase().includes('ideas') && !msg.toLowerCase().includes('suggest') && !msg.toLowerCase().includes('what do you think i should');
      const namingSuffix=isNaming?[
        "\n\nSPECIAL TASK: The creator wants to name their creative entity.",
        "First: understand what kind of entity this is — personal brand, production company, agency, collective, or something else entirely — based on their formation data. The word 'studio' may not fit them.",
        hasTypedName && !currentName
          ? "They have typed a name: \""+msg.trim()+"\". Do NOT evaluate it yet. Do NOT suggest alternatives yet. Ask one question: why that name, what does it mean to them? Because the answer is almost always the brand position hiding in plain sight. The creator who explains the meaning just handed you the entire brand story. The one who says they just liked how it sounded just told you there is work to do. One question only. Under 30 words."
          : currentName
            ? "Current name: "+currentName+". They want to refine or change it. Ask what is not working about it, or what they want it to do that it does not do now. One question. Under 30 words."
            : "They do not have a name yet. Ask one question about what they want the name to signal — craft, scale, personality, legacy. Not a list. One question that opens the right conversation. Under 30 words. After they answer, suggest exactly 3 names on separate lines in quotes, each with one sentence on what it signals and why it fits this specific creator.",
        "A name is the first public act of a brand. It signals craft, scale, ambition, and personality before a single frame is seen or word is heard. The wrong name is a ceiling. The right name is a door.",
        "Never say great name, love it, or anything evaluative until you understand the meaning behind it."
      ].join(" "):"";
      var reply;
      var fyRoom = window._fyRoom;
      if (fyRoom && fyRoom.state === 'connected') {
        // Route through LiveKit agent via native text channel
        reply = await new Promise(function(resolve, reject) {
          var timeout = setTimeout(function() { reject(new Error('timeout')); }, 30000);
          function onReply(e) {
            clearTimeout(timeout);
            window.removeEventListener('fy_agent_reply', onReply);
            resolve(e.detail.text);
          }
          window.addEventListener('fy_agent_reply', onReply);
          try {
            var chatPayload = new TextEncoder().encode(JSON.stringify({ type: 'fy_chat', text: msg }));
            fyRoom.localParticipant.publishData(chatPayload, { topic: 'fy_chat', reliable: true });
          } catch(e) {
            clearTimeout(timeout);
            window.removeEventListener('fy_agent_reply', onReply);
            reject(e);
          }
        }).catch(function() { return null; });
        // Fallback to /api/chat if agent didn't respond
        if (!reply) {
          var controller=new AbortController(); var timeout2=setTimeout(function(){controller.abort();},30000);
          var res2=await fetch(API_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:updatedMsgs,system:sysPrompt()+namingSuffix}),signal:controller.signal});
          clearTimeout(timeout2);
          var d2=await res2.json();
          reply=d2.message||d2.content||'Connection issue.';
        }
      } else {
        // No room — use /api/chat directly
        var controller=new AbortController(); var timeout3=setTimeout(function(){controller.abort();},30000);
        var res3=await fetch(API_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:updatedMsgs,system:sysPrompt()+namingSuffix}),signal:controller.signal});
        clearTimeout(timeout3);
        var d3=await res3.json();
        reply=d3.message||d3.content||'Connection issue.';
      }

      const finalMsgs = [...updatedMsgs, {role:'assistant',content:reply}];
      setMessages(finalMsgs);
      // Save for Dashboard→Studio handoff
      const conv = finalMsgs
        .filter(m => m.content && m.content !== '__CLOSER__')
        .map(m => ({ role: m.role === 'user' ? 'user' : 'fy', text: m.content }));
      localStorage.setItem('sy_fy_conversation', JSON.stringify(conv));

      if(isNaming){ const pills=extractNamePills(reply); if(pills.length>0){setNamePills(pills);setNamingMode(true);}
        // Detect if FY asked the probe question — next user reply is brand story
        const probeSignals=['why that name','what does it mean','mean to you','why did you choose','what does that name','tell me why'];
        if(probeSignals.some(s=>reply.toLowerCase().includes(s))){ awaitingBrandProbe.current=true; }
      }

      // Routing is handled by the scripted triage path above — the legacy
      // exchange-count trigger is gone. This model path now serves naming only.
    }catch(err){
      setMessages(p=>[...p,{role:'assistant',content:err?.name==='AbortError'?'FutureYou took too long. Try again.':"Can't reach FutureYou right now."}]);
    }
    finally{ setLoading(false); setTimeout(()=>inputRef.current?.focus(),50); }
  }


  function confirmName(name){ const n=(name||nameCustom||nameSelected).trim(); if(!n) return; onNameStudio?.(n); setNamingMode(false); setNamePills([]); setNameCustom(''); setNameSelected(''); setMessages(p=>[...p,{role:'assistant',content:n+' is on the gate. That name goes everywhere now — your work travels under it.'}]); }
  function onKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }

  return (
    <div className="fy-panel fade-up" ref={panelRef}>
      
      {status==='loading'&&<div className="fy-loading"><div className="fy-dots"><span/><span/><span/></div><span>FutureYou is reviewing your briefing...</span></div>}
      {status==='pre_reveal'&&(
        <div className="fy-first-words" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,padding:'12px 0 8px'}}>
          <img src="assets/award-ceremony.gif" style={{width:60,height:60,objectFit:'contain'}} alt=""/>
          <div style={{fontSize:'9px',letterSpacing:'0.22em',textTransform:'uppercase',color:'var(--green)',opacity:0.7}}>FUTUREYOU — FIRST WORDS</div>
        </div>
      )}
      {/* fy-thread always renders as the flex:1 scroll container */}
      <div className="fy-thread" ref={threadRef}>
        {(status==='typing'||status==='ready'||status==='chat')&&(
          <div className="fy-fw-text" style={{paddingTop:16,paddingBottom:8}}>{displayed}{status==='typing'&&<span className="fy-cursor"/>}</div>
        )}
        {status==='ready'&&!localStorage.getItem('sy_avatar_status')&&(
          <div style={{margin:'4px 0 8px',padding:'10px 12px',background:'rgba(0,200,255,0.03)',border:'1px solid rgba(0,200,255,0.1)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
            <div style={{flex:1,fontSize:11,color:'rgba(240,242,255,0.55)',lineHeight:1.5,fontFamily:"'Playfair Display',serif",fontStyle:'italic'}}>Want to see who's talking to you?</div>
            <div style={{fontSize:9,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--cyan)',cursor:'pointer',whiteSpace:'nowrap'}} onClick={()=>window.dispatchEvent(new Event('sy_avatar_start'))}>Set up ↑</div>
          </div>
        )}
        {messages.length>0&&(<><div className="fy-divider"/>{messages.map((m,i)=>{
          return <div key={i} className={m.role==='user'?'msg-user':'msg-fy'}>{m.content}</div>;
        })}{loading&&<div className="fy-dots" style={{padding:'4px 0'}}><span/><span/><span/></div>}</>)}
      </div>
      {triageStage==='q1'&&pillsVisible&&!namingMode&&!loading&&getTriagePills()&&(
        <div className="name-pills" style={{padding:'2px 0 8px',flexShrink:0}}>
          {getTriagePills().map((p,i)=><button key={i} className="name-pill" onClick={()=>{setInput('');handleTriageAnswer(p);}}>{p}</button>)}
        </div>
      )}
      {triageStage==='routing'&&(
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'6px 0 10px',flexShrink:0}}>
          <img src="assets/shutter1.gif" alt="" style={{width:34,height:34,objectFit:'contain'}}/>
          <div style={{fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:'var(--cyan)'}}>Charting your path…</div>
        </div>
      )}
      {namingMode&&namePills.length>0&&(
        <div className="name-suggest-wrap">
          <div className="name-suggest-label">FUTUREYOU SUGGESTS</div>
          <div className="name-pills">{namePills.map((n,i)=><button key={i} className={"name-pill"+(nameSelected===n?" selected":"")} onClick={()=>setNameSelected(n)}>{n}</button>)}</div>
          <div className="name-custom-row">
            <input className="name-custom-input" placeholder="Or type your own..." value={nameCustom} onChange={e=>{setNameCustom(e.target.value);setNameSelected('');}} onKeyDown={e=>{if(e.key==='Enter'&&(nameCustom.trim()||nameSelected)) confirmName(nameCustom||nameSelected);}} autoComplete="off"/>
            <button className="name-confirm-btn" disabled={!nameSelected&&!nameCustom.trim()} onClick={()=>confirmName(nameSelected||nameCustom)}>LOCK IT IN</button>
          </div>
        </div>
      )}
      {status!=='loading'&&status!=='init'&&(
        <div className="fy-input-row">
          <MicButton onTranscript={t=>setInput(p=>(p?p+' ':'')+t)} disabled={loading||status==='typing'||triageStage==='routing'||triageStage==='done'} />
          <textarea ref={el=>{inputRef.current=el;if(extRef)extRef.current=el;}} className="fy-input sy-input-3d" rows="1" placeholder="Talk to FutureYou..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={onKey} disabled={loading||status==='typing'||triageStage==='routing'||triageStage==='done'} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" name="fy-chat-input"/>
          <button className="fy-send" onClick={send} disabled={!input.trim()||loading||status==='typing'||triageStage==='routing'||triageStage==='done'}>SEND</button>
        </div>
      )}
      
    </div>
  );
}

    'building-card sy-card-3d',
    status === 'active'   ? 'card-active'   : '',
    status === 'complete' ? 'card-complete'  : '',

  return (

  );

function DashTour({ onClose }) {
  const [step, setStep] = React.useState(0);
  const [rect, setRect] = React.useState(null);
  const PAD = 10;
  const TW = 260;

  React.useEffect(() => {
    const s = TOUR_STEPS[step];
    const el = s.targetId
      ? document.getElementById(s.targetId)
      : document.querySelector(s.targetQuery);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    const measure = () => {
      const r = el.getBoundingClientRect();
      setRect({ left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height });
    };
    setTimeout(measure, 380);
  }, [step]);

  React.useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') done(); }
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  function done() { localStorage.setItem('sy_tour_seen','1'); onClose(); }
  function advance() {
    const s = TOUR_STEPS[step];
    if (step === TOUR_STEPS.length - 1) {
      if (s.closingAction === 'open-recommended') {
        const card = document.querySelector('[data-recommended="true"]');
        if (card) card.click();
      }
      done();
    } else {
      setStep(p => p+1);
    }
  }
  function back() { if (step > 0) setStep(s => s-1); }

  const W = window.innerWidth;
  const H = window.innerHeight;
  const s = TOUR_STEPS[step];
  const isLast = step === TOUR_STEPS.length - 1;

  // SVG spotlight path — evenodd cuts transparent hole over target
  const svgPath = React.useMemo(() => {
    if (!rect) return `M0,0 H${W} V${H} H0 Z`;
    const x1 = Math.max(0, rect.left - PAD);
    const y1 = Math.max(0, rect.top - PAD);
    const x2 = Math.min(W, rect.right + PAD);
    const y2 = Math.min(H, rect.bottom + PAD);
    return `M0,0 H${W} V${H} H0 Z M${x1},${y1} H${x2} V${y2} H${x1} Z`;
  }, [rect, W, H]);

  // Spotlight border rect
  const spotRect = rect ? {
    position: 'fixed',
    left: Math.max(0, rect.left - PAD),
    top: Math.max(0, rect.top - PAD),
    width: Math.min(W, rect.right + PAD) - Math.max(0, rect.left - PAD),
    height: Math.min(H, rect.bottom + PAD) - Math.max(0, rect.top - PAD),
    border: '1.5px solid rgba(0,200,255,0.7)',
    boxShadow: '0 0 0 2px rgba(0,200,255,0.08), 0 0 20px rgba(0,200,255,0.2)',
    pointerEvents: 'none',
    zIndex: 9502,
  } : null;

  // Tooltip positioning
  const ttStyle = React.useMemo(() => {
    const base = { position: 'fixed', width: TW, zIndex: 9503 };
    if (!rect) return { ...base, top: '50%', left: '50%', transform: 'translate(-50%,-50%)' };
    const gap = 18;
    const x1 = Math.max(0, rect.left - PAD);
    const y1 = Math.max(0, rect.top - PAD);
    const x2 = Math.min(W, rect.right + PAD);
    const y2 = Math.min(H, rect.bottom + PAD);
    switch (s.side) {
      case 'right': return { ...base, left: x2 + gap, top: Math.min(y1, H - 280) };
      case 'left':  return { ...base, right: W - x1 + gap, top: Math.min(y1, H - 280) };
      case 'below': return { ...base, top: y2 + gap, left: Math.min(Math.max(x1, gap), W - TW - gap) };
      case 'above': return { ...base, bottom: H - y1 + gap, left: Math.min(Math.max(x1, gap), W - TW - gap) };
      case 'center':
      default:      return { ...base, top: '50%', left: '50%', transform: 'translate(-50%,-50%)' };
    }
  }, [rect, s.side, W, H]);

  return (
    <div style={{position:'fixed',inset:0,zIndex:9500,pointerEvents:'all'}}>
      {/* SVG spotlight overlay — pointer-events:fill means clicks on dark areas skip tour,
           clicks in the transparent cutout pass through to underlying elements */}
      <svg style={{position:'fixed',inset:0,width:'100%',height:'100%',display:'block',pointerEvents:'none'}}>
        <path
          fillRule="evenodd"
          fill="rgba(2,4,14,0.84)"
          d={svgPath}
          style={{cursor:'pointer',pointerEvents:'fill'}}
          onClick={done}
        />
      </svg>
      {/* Spotlight border */}
      {spotRect && <div style={spotRect} />}
      {/* Tooltip */}
      <div className="tour-tooltip" style={ttStyle} onClick={e=>e.stopPropagation()}>
        <div className="tour-tooltip-eyebrow">{s.eyebrow} · {step+1}/{TOUR_STEPS.length}</div>
        <div className="tour-tooltip-title">{s.title}</div>
        <div className="tour-tooltip-body">{s.body}</div>
        <div className="tour-tooltip-actions">
          <div className="tour-dots">
            {TOUR_STEPS.map((_,i)=><div key={i} className={`tour-dot${i===step?' active':''}`}/>)}
          </div>
          <div className="tour-btn-row">
            {step > 0 && <button className="tour-btn skip" onClick={back}>← Back</button>}
            <button className="tour-btn skip" onClick={done}>Skip</button>
            <button className="tour-btn next" onClick={advance}>{isLast ? "Let's Go →" : 'Next →'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Dashboard() {
  const [activeId,setActiveId]=useState('ideate');
  const [rec,setRec]=useState(()=>localStorage.getItem('sy_recommended_building')||'');
  const interactedRef=useRef(false);
  const [showTour,setShowTour]=useState(false);

  // Fire tour for any user who hasn't seen it yet
  React.useEffect(()=>{
    const tourSeen=localStorage.getItem('sy_tour_seen')==='1';
    if(!tourSeen){ setTimeout(()=>setShowTour(true),1400); }
    // Also listen for manual trigger from logo menu
    function onStartTour(){ setShowTour(true); }
    window.addEventListener('sy_start_tour',onStartTour);
    return ()=>window.removeEventListener('sy_start_tour',onStartTour);
  },[]);

  const email=localStorage.getItem('sy_email')||'';
  const firstName=localStorage.getItem('sy_first_name')||'';
  const [studioName,setStudioNameState]=useState(()=>(localStorage.getItem('sy_studio_name')||'').trim()||'YOUR STUDIO');

  function updateStudioName(name){
    const n=name.trim(); if(!n) return;
    localStorage.setItem('sy_studio_name',n); setStudioNameState(n);
    fetch(API_URL+'/api/update-studio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:localStorage.getItem('sy_email')||'',studio_name:n})}).catch(()=>{});
  }
  const formation=()=>{try{const v=JSON.parse(localStorage.getItem('sy_formation')||'[]');return Array.isArray(v)?v:[];}catch{return[];}};
  const briefing=()=>{try{return JSON.parse(localStorage.getItem('sy_briefing')||'{}');}catch{return{};}};

  const [journeyPlans,setJourneyPlans]=useState([]);
  const [projects,setProjects]=useState([]);
  const [activeProject,setActiveProject]=useState(null);
  const fyPanelRef=useRef(null);
  const fyInputRef=useRef(null);
  function scrollToFY(){ setTimeout(()=>fyInputRef.current?.focus(),100); }

  async function loadProjects() {
    if (!email) return;
    try {
      // Guard: mark auto-create attempted this session to prevent duplicate inserts on rapid reloads
      const autoCreateKey = 'sy_project_init_' + email;
      const headers = {'Content-Type':'application/json'};
      if (!localStorage.getItem(autoCreateKey)) {
        localStorage.setItem(autoCreateKey, '1');
      }
      const res = await fetch(`${API_URL}/api/projects/list?email=${encodeURIComponent(email)}`);
      const d = await res.json();
      if (d.success && d.projects && d.projects.length) {
        setProjects(d.projects);
        // Prefer previously active project if stored
        const storedId = localStorage.getItem('sy_active_project_id');
        const preferred = storedId && d.projects.find(p=>p.id===storedId);
        const active = preferred || d.projects[0];
        setActiveProject(active);
        localStorage.setItem('sy_active_project_id', active.id);
        localStorage.setItem('sy_active_project_name', active.name || '');
      }
    } catch(e) { console.warn('[Projects] load failed:', e); }
  }

  async function handleProjectSwitch(project) {
    setActiveProject(project);
    localStorage.setItem('sy_active_project_id', project.id);
    localStorage.setItem('sy_active_project_name', project.name || '');
    fetch(API_URL+'/api/projects/set-active', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ project_id: project.id, email })
    }).catch(()=>{});
  }

  async function handleProjectDelete(project) {
    const tier = localStorage.getItem('sy_tier') || 'operator';
    try {
      const res = await fetch(API_URL+'/api/projects/delete', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ project_id: project.id, email })
      });
      const d = await res.json();
      if (d.success) {
        await loadProjects();
        // If deleted project was active, switch to first remaining
        if (activeProject && activeProject.id === project.id) {
          setActiveProject(null);
          localStorage.removeItem('sy_active_project_id');
        }
      }
    } catch(e) { console.warn('[Projects] delete failed:', e); }
  }

  async function handleProjectCreate() {
    const tier = localStorage.getItem('sy_tier') || 'operator';
    try {
      const res = await fetch(API_URL+'/api/projects/create', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, tier })
      });
      const d = await res.json();
      if (d.success && d.project) {
        await loadProjects();
        setActiveProject(d.project);
      } else if (d.limit_hit) {
        console.warn('[Projects] limit hit:', d.error);
      }
    } catch(e) { console.warn('[Projects] create failed:', e); }
  }

  async function fetchJourney() {
    if (!email) return;
    try {
      const res = await fetch(`${API_URL}/api/session/journey?email=${encodeURIComponent(email)}`);
      const d = await res.json();
      if (d.success && d.plans) setJourneyPlans(d.plans);
    } catch(e) { console.warn('[Journey] fetch failed:', e); }
  }
  useEffect(()=>{ fetchJourney(); loadProjects(); },[]);

  function handlePlanReady(plan) {
    fetchJourney();
    if (plan.building_slug) {
      // Write nav destination so studio knows where to land
      if (plan.section_name) localStorage.setItem('sy_nav_section', plan.section_name);
      else localStorage.removeItem('sy_nav_section');
      if (plan.step_title) localStorage.setItem('sy_nav_step', plan.step_title);
      else localStorage.removeItem('sy_nav_step');
      const b = BUILDINGS.find(b => b.id === plan.building_slug);
      // Navigate after a beat — long enough to read the handoff line, short enough
      // not to feel like a stall. FY at this stage is a router, not a conversation.
      // When the avatar session is live, the agent is speaking the handoff line —
      // hold longer so TTS playout completes before navigation tears the page down.
      // Studio spins up its own fresh avatar session on load (new Runway worker
      // joining the room), so there's an unavoidable respawn gap the user will see.
      // A short "See you there." close, spoken right before navigating, covers
      // that gap narratively instead of just going silent mid-cut.
      const avatarLive = window._fyRoom && window._fyRoom.state === 'connected';
      if (b) {
        if (avatarLive) {
          setTimeout(() => {
            speakLine('See you there.');
            setTimeout(() => handleOpenBuilding(b), 3200);
          }, 5000);
        } else {
          setTimeout(() => handleOpenBuilding(b), 2200);
        }
      }
    } else {
    }
  }

  function handleActionClick(action) {
    if (action.id) {
      fetch(`${API_URL}/api/session/action/complete`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action_id: action.id, click: true })
      }).catch(()=>{});
    }
    if (action.action_type === 'open_building' && action.target_building) {
      const b = BUILDINGS.find(b => b.id === action.target_building);
      if (b) handleOpenBuilding(b);
    }
  }

  function handleOpenBuilding(b){
    // Write active state to fy_projects.buildings before navigating
    const email = localStorage.getItem('sy_email') || '';
    if (activeProject && email) {
      const current = (activeProject.buildings && activeProject.buildings[b.id]) || {};
      // Don't downgrade a complete building to active
      if (current.state !== 'complete') {
        const updatedBuildings = {
          ...(activeProject.buildings || {}),
          [b.id]: { ...current, state: 'active', last_visited: new Date().toISOString() }
        };
        fetch(API_URL + '/api/projects/update', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project_id: activeProject.id, email, buildings: updatedBuildings })
        }).catch(() => {});
        setActiveProject(prev => ({ ...prev, buildings: updatedBuildings }));
      }
    }
    // Pause Helios if running
    if (window._heliosReactor) {
      try { window._heliosReactor.sendCommand('pause', {}); } catch(_) {}
    }
    // Explicitly disconnect any live avatar session before navigating — don't rely on
    // the browser's default unload behavior to trigger cleanup server-side.
    if (window._fyRoom) { try { window._fyRoom.disconnect(); } catch(e) {} }
    window.location.href = '/studio.html?building=' + b.id;
  }

  return (
    <div className="dashboard">
      {showTour && <DashTour onClose={()=>setShowTour(false)} />}
      <Sidebar
        activeId={activeId} onNav={id=>setActiveId(id)}
        onOpenBuilding={handleOpenBuilding}
        journeyPlans={journeyPlans}
        onActionClick={handleActionClick}
      />
      <div className="main">
        <div id="tour-topbar" className="topbar">
          <div className="topbar-left">
            <LogoButton />
            <div className="topbar-sep"/>
            <div className="topbar-stage">Phase 1 — Established</div>
            <div className="topbar-sep"/>
            <div className="topbar-stage">12 Buildings Open</div>
          </div>
          <div className="studio-name">{studioName.toUpperCase()}</div>
          <div className="topbar-right">
            {firstName&&<span className="topbar-welcome">Welcome back, {firstName}</span>}
            {firstName&&<div className="topbar-sep"/>}
            {email&&<><span className="topbar-signed-label">Signed In</span><span className="topbar-user-email topbar-gold">{email}</span></>}
            {email&&<div className="topbar-sep"/>}
            {localStorage.getItem('sy_tier')&&<div className={`sy-badge-3d ${localStorage.getItem('sy_tier')==='operator'?'sy-badge-3d-gold':'sy-badge-3d-cyan'}`} style={{fontSize:'8px',padding:'4px 10px'}}><div className="sy-badge-3d-dot" style={{width:'4px',height:'4px'}}></div>{localStorage.getItem('sy_tier').charAt(0).toUpperCase()+localStorage.getItem('sy_tier').slice(1)}</div>}
            {localStorage.getItem('sy_tier')&&<div className="topbar-sep"/>}
            <div className="sy-badge-3d sy-badge-3d-green" style={{fontSize:'7px',padding:'4px 10px'}}><div className="sy-badge-3d-dot" style={{width:'4px',height:'4px',animation:'pg 2s infinite'}}></div>FUTUREYOU LIVE</div>
          </div>
        </div>
        <div className="dash-body">
          <div id="tour-buildings" className="dash-content-col">
            <div id="tour-hero">
              <StudioWorldHero
                studioName={studioName}
                archetype={concludeArchetype()}
                phase={localStorage.getItem('sy_phase')||'1'}
                seed={Math.floor(Math.random() * 99999)}
                activeProject={activeProject}
                projects={projects}
                onProjectSwitch={handleProjectSwitch}
                onProjectCreate={handleProjectCreate}
                onProjectDelete={handleProjectDelete}
                email={email}
                tier={localStorage.getItem('sy_tier')||'operator'}
              />
            </div>
            <div className="main-body">
              <div className="main-canvas">
                <div className="content">
                  <div className="buildings-grid fade-up d1">
                    {BUILDINGS.map((b,i) => {
                      const bldgState = (activeProject && activeProject.buildings && activeProject.buildings[b.id]) || null;
                      return <BuildingCard key={b.id} b={b} status={getStatus(b, rec, bldgState)} delay={0.025*i} onOpen={handleOpenBuilding}/>;
                    })}
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div id="tour-fy-rail" className="fy-rail">
            <FYAvatarSlot />
            <div className="fy-rail-controls">
              <span style={{display:'flex',alignItems:'center',gap:'8px'}}><span className="fy-rail-dot"/><span className="fy-rail-label">FutureYou Chat</span></span>
              <span style={{display:'flex',alignItems:'center',gap:'8px'}}>
                <span style={{fontSize:9,letterSpacing:'0.14em',textTransform:'uppercase',color:'rgba(240,242,255,0.2)',cursor:'pointer'}} onClick={()=>window.dispatchEvent(new Event('sy_avatar_reset'))}>↺ RESET</span>
                <FYVideoToggle />
              </span>
            </div>
            <div className="fy-rail-body">
              <FYPanel
                panelRef={fyPanelRef} inputRef={fyInputRef}
                firstName={firstName} formation={formation()} briefing={briefing()}
                studioName={studioName}
                onRec={r=>{setRec(r);localStorage.setItem('sy_recommended_building',r);}}
                onNameStudio={updateStudioName}
                onPlanReady={handlePlanReady}
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
