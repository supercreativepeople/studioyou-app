<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudioYou — Your Studio</title>
<link rel="icon" type="image/png" href="assets/SY_OFFICIAL_SHUTTER_KEY.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sy-3d.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --black:#06091a; --navy:#0b0d1a; --navy-2:#0f1228; --navy-3:#141830; --navy-mid:#0e1020;
    --white:#f0f2ff;
    --sy-cyan:#00c8ff; --sy-purple:#7b35d4; --sy-gold:#e8c97a; --sy-green:#4cff91; --sy-red:#ff6b6b;
    --cyan:#00c8ff; --purple:#7b35d4; --green:#00e676;
    --grad:linear-gradient(135deg,#00c8ff 0%,#5e28a8 60%,#7b35d4 100%);
    --gradT:linear-gradient(135deg,#00c8ff 0%,#a06be8 100%);
    --border:rgba(0,200,255,0.08); --border-mid:rgba(0,200,255,0.14); --border-h:rgba(0,200,255,0.22);
    --ghost:rgba(240,242,255,0.06);
    --sidebar-w:248px;
  }
  html,body,#root { height:100%; }
  body { background:var(--black); color:var(--white); font-family:'Outfit',sans-serif; font-weight:300; overflow:hidden; }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    background-size:256px; pointer-events:none; z-index:9999;
  }
  .amb { position:fixed; border-radius:50%; pointer-events:none; z-index:0; }
  .amb-1 { top:-20vh; left:-10vw; width:70vw; height:70vh; background:radial-gradient(ellipse,rgba(0,200,255,0.04) 0%,transparent 70%); }
  .amb-2 { bottom:-10vh; right:-15vw; width:60vw; height:60vh; background:radial-gradient(ellipse,rgba(123,53,212,0.05) 0%,transparent 70%); }

  /* CINEMATIC BACKGROUND */
  .bg-cinema { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .bg-layer {
    position:absolute; inset:0;
    background-image:url('assets/STUDIO_WS_BASE.jpg');
    background-size:110%; background-position:center; background-repeat:no-repeat;
    animation:kenBurns 28s ease-out forwards;
  }
  @keyframes kenBurns { from{transform:scale(1.0) translate(10px,0px)} to{transform:scale(1.08) translate(-8px,-10px)} }
  .bg-layer::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom,rgba(6,9,26,0.82) 0%,rgba(6,9,26,0.72) 40%,rgba(6,9,26,0.80) 70%,rgba(6,9,26,0.95) 100%); }
  .bg-layer::before { content:''; position:absolute; inset:0; background:linear-gradient(to right,rgba(6,9,26,0.7) 0%,transparent 50%,rgba(6,9,26,0.4) 100%); z-index:1; }

  /* LAYOUT */
  .dashboard { display:flex; height:100vh; position:relative; z-index:10; }

  /* SIDEBAR */
  .sidebar {
    width:var(--sidebar-w); flex-shrink:0;
    background:rgba(11,13,26,0.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-right:1px solid var(--border); display:none;
  }
  .logo-wrap { position:relative; cursor:pointer; }
  .logo-menu {
    position:fixed; top:54px; left:28px;
    background:rgba(11,13,26,0.96); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border-mid); min-width:200px; z-index:10000;
    animation:fadeUp 0.18s ease both;
  }
  .logo-menu-backdrop {
    position:fixed; inset:0; z-index:9999; background:transparent;
  }
  .logo-menu-item {
    display:flex; align-items:center; gap:10px; padding:11px 16px; font-size:12px; font-weight:300;
    color:#c8cadc; cursor:pointer; transition:all 0.15s; border-bottom:1px solid var(--border);
  }
  .logo-menu-item:last-child { border-bottom:none; }
  .logo-menu-item:hover { color:var(--white); background:var(--ghost); }
  .logo-menu-item.danger:hover { color:#ff5c5c; }
  .logo-menu-icon { font-size:12px; opacity:0.6; width:14px; text-align:center; }
  .logo-menu-section-label { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#7a7c94; padding:8px 16px 4px; opacity:0.6; }

  .sidebar-logo { padding:18px 18px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .sidebar-logo img { height:26px; width:auto; }
  .sb-scroll { flex:1; overflow-y:auto; scrollbar-width:none; }
  .sb-scroll::-webkit-scrollbar { display:none; }

  @keyframes pg { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,230,118,0.4)} 50%{opacity:0.7;box-shadow:0 0 0 5px rgba(0,230,118,0)} }
  @keyframes pgGold { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .sb-journey-block { padding:14px 16px 12px; border-bottom:1px solid var(--border); }
  .sb-section-label { font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:#7a7c94; margin-bottom:10px; opacity:0.7; }
  .journey-phase-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .journey-phase-name { font-size:12px; color:var(--white); font-weight:400; }
  .journey-phase-pct { font-size:11px; color:var(--cyan); }
  .journey-bar { height:2px; background:var(--ghost); margin-bottom:8px; overflow:hidden; }
  .journey-bar-fill { height:100%; background:var(--grad); }
  .journey-next { font-size:10px; color:#7a7c94; line-height:1.5; }


  .sb-nav-section { padding:10px 0 4px; }
  .sb-nav-label { font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:#7a7c94; padding:0 16px 6px; opacity:0.7; }
  .sb-nav-item {
    display:flex; align-items:center; gap:9px; padding:7px 16px;
    font-size:12px; font-weight:300; color:#c8cadc; cursor:pointer;
    transition:all 0.18s; border-left:2px solid transparent;
  }
  .sb-nav-item:hover { color:var(--white); background:var(--ghost); }
  .sb-nav-item.active { color:var(--cyan); border-left-color:var(--cyan); background:rgba(0,200,255,0.05); }
  .sb-nav-dot { width:4px; height:4px; border-radius:50%; background:#7a7c94; flex-shrink:0; transition:background 0.18s; }
  .sb-nav-item.active .sb-nav-dot { background:var(--cyan); box-shadow:0 0 6px rgba(0,200,255,0.5); }
  .sb-nav-icon { font-size:13px; width:18px; text-align:center; flex-shrink:0; line-height:1; }



  /* MAIN */
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  .main-body { flex:1; display:flex; overflow:hidden; min-width:0; }
  .dash-body { flex:1; display:flex; overflow:hidden; min-height:0; }
  .dash-content-col { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  .main-canvas { flex:1; overflow-y:auto; overflow-x:hidden; min-width:0; scrollbar-width:thin; scrollbar-color:rgba(0,200,255,0.15) transparent; }
  .main-canvas::-webkit-scrollbar { width:3px; }
  .main-canvas::-webkit-scrollbar-thumb { background:rgba(0,200,255,0.15); border-radius:2px; }
  .fy-rail {
    width:300px; flex-shrink:0;
    background:rgba(11,13,26,0.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden;
  }
  .fy-rail-header {
    padding:12px 16px 10px; border-bottom:1px solid var(--border); flex-shrink:0;
    display:flex; align-items:center; gap:8px; justify-content:space-between;
  }
  .fy-rail-dot { width:5px; height:5px; border-radius:50%; background:var(--sy-green); animation:pg 2s infinite; flex-shrink:0; }
  .fy-rail-label { font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--sy-green); font-weight:500; }
  .fy-rail-controls {
    padding:8px 16px; border-bottom:1px solid var(--border); flex-shrink:0;
    display:flex; align-items:center; gap:8px; justify-content:space-between;
  }
  .fy-rail-body { flex:1; overflow:hidden; display:flex; flex-direction:column; min-height:0; }

  /* TOPBAR */
  .topbar {
    height:54px; flex-shrink:0; position:relative; z-index:50;
    background:rgba(11,13,26,0.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border); padding:0 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar-left { display:flex; align-items:center; gap:12px; }
  .topbar-right { display:flex; align-items:center; gap:8px; }
  .studio-name {
    font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.05em;
    background:var(--gradT); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; pointer-events:none;
  }
  .topbar-sep { width:1px; height:14px; background:var(--border-mid); flex-shrink:0; }
  .topbar-stage { font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:#7a7c94; }
  .topbar-stage.lot { color:rgba(200,202,220,0.7); font-weight:400; }
  .tier-badge { padding:3px 10px; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; font-weight:500; border:1px solid rgba(0,200,255,0.3); color:var(--cyan); background:rgba(0,200,255,0.07); flex-shrink:0; }
  .tier-badge.tier-operator { border-color:rgba(212,175,55,0.4); color:#d4af37; background:rgba(212,175,55,0.07); }
  .topbar-welcome { font-size:10px; letter-spacing:0.08em; color:#d4af37; font-weight:500; }
  .topbar-signed-label { font-size:10px; letter-spacing:0.10em; text-transform:uppercase; color:#d4af37; margin-right:4px; animation:pgGold 2.4s ease-in-out infinite; }
  .topbar-gold { color:#d4af37 !important; }
  .topbar-user-email { font-size:10px; color:#7a7c94; letter-spacing:0.04em; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fy-live-global { display:flex; align-items:center; gap:6px; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--sy-green); flex-shrink:0; }
  .fy-live-global-dot { width:5px; height:5px; border-radius:50%; background:var(--sy-green); animation:pg 2s infinite; }

  /* CONTENT */
  .content { padding:24px 24px 60px; }

  .fy-panel {
    flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0;
    background:rgba(14,16,32,0.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border-mid); position:relative;
  }
  .fy-panel::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:var(--grad); z-index:1; }
  .fy-eyebrow { padding:14px 22px 0; font-size:9px; letter-spacing:0.28em; text-transform:uppercase; color:var(--green); opacity:0.85; display:flex; align-items:center; gap:8px; }
  .fy-eyebrow::before { content:''; width:14px; height:1px; background:var(--green); opacity:0.5; }
  .fy-first-words { padding:16px 22px 8px; flex-shrink:0; }
  .fy-fw-text { font-family:'Playfair Display',serif; font-style:italic; font-size:13px; line-height:1.8; color:var(--white); }
  .fy-cursor { display:inline-block; width:2px; height:1em; background:var(--green); margin-left:2px; animation:blink 1.1s step-end infinite; vertical-align:text-bottom; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .fy-loading { padding:16px 22px; display:flex; align-items:center; gap:10px; color:#7a7c94; font-size:13px; flex-shrink:0; }
  .fy-dots { display:flex; gap:4px; }
  .fy-dots span { width:4px; height:4px; border-radius:50%; background:var(--green); animation:dp 1.4s infinite; }
  .fy-dots span:nth-child(2){animation-delay:0.2s} .fy-dots span:nth-child(3){animation-delay:0.4s}
  @keyframes dp { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
  .fy-thread {
    flex:1; overflow-y:auto; padding:0 22px;
    display:flex; flex-direction:column; gap:10px;
    scrollbar-width:thin; scrollbar-color:rgba(0,200,255,0.1) transparent;
    min-height:0;
  }
  .fy-thread::-webkit-scrollbar { width:2px; }
  .fy-thread::-webkit-scrollbar-thumb { background:rgba(0,200,255,0.12); }
  /* Avatar slot accordion — collapses when video is off */
  .fy-avatar-slot { transition:all 0.35s ease; }
  .fy-avatar-slot.collapsed { aspect-ratio:unset; height:0; overflow:hidden; border-bottom:none; }
  .fy-divider { height:1px; background:var(--border); margin:6px 0; }
  .msg-fy { font-family:'Playfair Display',serif; font-style:italic; font-size:13px; line-height:1.75; color:var(--white); }
  .msg-user { font-size:12px; color:#c8cadc; text-align:right; padding-left:48px; line-height:1.6; }
  .fy-input-row {
    display:flex; margin:14px 22px 18px; flex-shrink:0;
    border:1px solid var(--border-mid); background:rgba(0,200,255,0.02); transition:border-color 0.25s;
  }
  .fy-input-row:focus-within { border-color:rgba(0,230,118,0.3); }
  .fy-input {
    flex:1; background:transparent; border:none; color:var(--white);
    font-family:'Outfit',sans-serif; font-size:14px; font-weight:300;
    padding:11px 14px; outline:none; resize:none; min-height:44px; max-height:100px;
    caret-color:var(--green); line-height:1.5;
  }
  .fy-input::placeholder { color:#7a7c94; }
  .fy-input:disabled { opacity:0.35; }
  .fy-send {
    background:transparent; border:none; border-left:1px solid var(--border);
    color:var(--green); font-family:'Bebas Neue',sans-serif; font-size:16px;
    letter-spacing:0.08em; padding:0 18px; height:44px; cursor:pointer;
    flex-shrink:0; transition:background 0.18s; align-self:flex-end;
  }
  .fy-send:hover { background:rgba(0,230,118,0.06); }

  /* ── SY pills — triage choices + FY name suggestions (3D system language) ── */
  .name-pills { display:flex; flex-wrap:wrap; gap:8px; }
  .name-pill {
    font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--cyan);
    background:linear-gradient(180deg, rgba(0,200,255,0.07), rgba(0,200,255,0.02));
    border:1px solid rgba(0,200,255,0.35); border-radius:999px;
    padding:7px 18px 6px; cursor:pointer; position:relative;
    box-shadow:0 2px 0 rgba(0,90,120,0.45), 0 3px 10px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    transition:transform 0.12s, box-shadow 0.12s, background 0.15s, border-color 0.15s;
  }
  .name-pill:hover {
    transform:translateY(-1px);
    background:linear-gradient(180deg, rgba(0,200,255,0.14), rgba(0,200,255,0.04));
    border-color:rgba(0,200,255,0.6);
    box-shadow:0 3px 0 rgba(0,90,120,0.5), 0 6px 16px rgba(0,200,255,0.12), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .name-pill:active { transform:translateY(1px); box-shadow:0 1px 0 rgba(0,90,120,0.45), inset 0 1px 3px rgba(0,0,0,0.3); }
  .name-pill.selected {
    color:var(--sy-green); border-color:rgba(76,255,145,0.55);
    background:linear-gradient(180deg, rgba(76,255,145,0.12), rgba(76,255,145,0.03));
    box-shadow:0 2px 0 rgba(20,110,60,0.5), 0 3px 12px rgba(76,255,145,0.12), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .name-suggest-wrap { padding:10px 0 12px; flex-shrink:0; }
  .name-suggest-label { font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:var(--sy-green); margin-bottom:8px; }
  .name-custom-row { display:flex; gap:8px; margin-top:10px; }
  .name-custom-input {
    flex:1; background:rgba(6,9,26,0.6); border:1px solid var(--border); color:var(--fg, #f0f2ff);
    font-family:'Outfit',sans-serif; font-size:12px; padding:8px 12px; border-radius:6px; outline:none;
  }
  .name-custom-input:focus { border-color:rgba(0,200,255,0.4); }
  .name-confirm-btn {
    font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:0.1em; color:#06091a;
    background:var(--sy-green); border:none; border-radius:6px; padding:0 16px; cursor:pointer;
    box-shadow:0 2px 0 rgba(20,110,60,0.6);
  }
  .name-confirm-btn:disabled { opacity:0.35; cursor:default; }
  .fy-send:disabled { opacity:0.25; cursor:default; }

  /* LOT */

  /* BUILDINGS GRID */
  .buildings-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); }
  .buildings-grid .sy-card-3d-wrap { display:block; }
  .building-card {
    background:rgba(14,16,32,0.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    padding:22px 22px 18px; cursor:pointer; position:relative; overflow:hidden;
    min-height:185px; display:flex; flex-direction:column; transition:background 0.2s;
  }
  .building-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--grad); opacity:0; transition:opacity 0.2s; }
  .building-card:hover { background:rgba(11,13,26,0.88); }
  .building-card:hover::before { opacity:1; }

  .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
  .card-icon { font-size:22px; line-height:1; }
  .card-status-tag { font-size:8px; letter-spacing:0.16em; text-transform:uppercase; font-weight:500; padding:3px 7px; border:1px solid; flex-shrink:0; }
  .tag-open { color:#7a7c94; border-color:rgba(240,242,255,0.12); }
  .tag-fy-strategic { color:var(--green); border-color:rgba(0,230,118,0.4); background:rgba(0,230,118,0.07); }
  .tag-fy-advisory { color:var(--cyan); border-color:rgba(0,200,255,0.4); background:rgba(0,200,255,0.07); }

  .card-title { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.06em; margin-bottom:7px; color:var(--white); line-height:1; }
  .card-desc { font-size:11px; color:#7a7c94; line-height:1.65; flex:1; margin-bottom:14px; }
  .card-cta { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--cyan); display:flex; align-items:center; gap:6px; transition:gap 0.18s; margin-top:auto; }
  .building-card:hover .card-cta { gap:10px; }
  .card-cta-green { color:var(--green); }

  /* Building card project-state treatments */
  .building-card.card-active {
    background:rgba(0,200,255,0.05);
    border-left:2px solid rgba(0,200,255,0.35);
  }
  .building-card.card-active::before { opacity:0.55; }
  .building-card.card-complete {
    background:rgba(76,255,145,0.03);
    border-left:2px solid rgba(76,255,145,0.32);
  }
  .building-card.card-complete::before {
    background:linear-gradient(90deg,var(--sy-green),var(--cyan) 70%,transparent);
    opacity:0.8;
  }
  .building-card.card-complete .card-title { color:rgba(240,242,255,0.68); }
  .building-card.card-complete .card-desc { color:rgba(122,124,148,0.7); }

  .phase-note { padding:11px 18px; background:var(--ghost); border:1px solid var(--border); margin-top:18px; }
  .phase-note-text { font-size:10px; color:#7a7c94; letter-spacing:0.06em; line-height:1.5; }

  /* SYB BUTTONS — base shared properties */
  .syb {
    font-family:'Bebas Neue',sans-serif; letter-spacing:0.12em; text-transform:uppercase;
    border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    font-size:14px; padding:11px 24px; transition:all 0.18s ease;
  }
  .syb-grad {
    background:var(--grad); color:var(--black);
  }
  .syb-grad:hover { opacity:0.88; }
  .syb-primary {

// Reads the archetype set by the backend at formation. Falls back to content_creator.
function concludeArchetype() {
  const stored = localStorage.getItem('sy_archetype');
  return ARCHETYPES[stored] || ARCHETYPES['content_creator'];
}

function generateSeed(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = (h * 33) ^ str.charCodeAt(i);
  return (h >>> 0) % 99999;
}


// ── PROJECT MODAL ────────────────────────────────────────────────────────────
function ProjectModal({ projects, activeProject, onSwitch, onCreate, onDelete, onClose, email, tier }) {
  const TIER_ACTIVE_LIMITS = { operator:10, independent:3, player:5 };
  const tierKey = (tier||'operator').toLowerCase();
  const activeProjects = (projects||[]).filter(p=>p.status==='active');
  const atLimit = activeProjects.length >= (TIER_ACTIVE_LIMITS[tierKey]||10);
  const [confirmId, setConfirmId] = React.useState(null);

  function relativeDate(iso) {
    if (!iso) return '';
    const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + 'd ago';
    return Math.floor(days/7) + 'w ago';
  }

  function handleDelete(e, p) {
    e.stopPropagation();
    setConfirmId(p.id);
  }

  function confirmDelete(e, p) {
    e.stopPropagation();
    setConfirmId(null);
    onDelete(p);
  }

  function cancelDelete(e) {
    e.stopPropagation();
    setConfirmId(null);
  }

  return ReactDOM.createPortal(
    <>
      <div className="proj-modal-backdrop" onClick={()=>{ if(confirmId){ setConfirmId(null); return; } onClose(); }}/>
      <div className="proj-modal">
        <div className="proj-modal-header">
          <span className="proj-modal-title">Projects</span>
          <span className="proj-modal-count">{activeProjects.length} of {TIER_ACTIVE_LIMITS[tierKey]||10} active</span>
          <button className="proj-modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="proj-modal-body">
          {activeProjects.map((p,i)=>(
            <div key={p.id}>
              <div
                className={"proj-modal-item"+(p.id===(activeProject&&activeProject.id)?" proj-modal-active":"")}
                onClick={()=>{ if(confirmId) return; if(p.id!==(activeProject&&activeProject.id)){ onSwitch(p); } onClose(); }}>
                <span className="proj-modal-item-num">{i+1}</span>
                {p.id===(activeProject&&activeProject.id) && <span className="proj-modal-item-dot"/>}
                <span className="proj-modal-item-name">{p.name}</span>
                <span className="proj-modal-item-meta">{confirmId===p.id ? '' : relativeDate(p.last_accessed)}</span>
                {confirmId===p.id
                  ? <div className="proj-confirm-inline" onClick={e=>e.stopPropagation()}>
                      <span className="proj-confirm-inline-text">Sure?</span>
                      <button className="proj-confirm-btn danger" onClick={e=>{e.stopPropagation();confirmDelete(e,p);}}>Yes</button>
                      <button className="proj-confirm-btn cancel" onClick={e=>{e.stopPropagation();cancelDelete(e);}}>No</button>
                    </div>
                  : <button className="proj-modal-delete-btn" onClick={e=>handleDelete(e,p)}>✕</button>
                }
              </div>
            </div>
          ))}
          {activeProjects.length===0 && (
            <div className="proj-modal-item" style={{color:'#7a7c94',cursor:'default'}}>No projects yet</div>
          )}
        </div>
        <button className={"proj-modal-new"+(atLimit?" at-limit":"")}
          onClick={()=>{ if(!atLimit){ onCreate(); } onClose(); }}>
          {atLimit ? 'PROJECT LIMIT REACHED' : '+ NEW PROJECT'}
        </button>
      </div>
    </>,
    document.body
  );
}

// ── PROJECT STATUS PANEL ─────────────────────────────────────────────────────
function ProjectStatusPanel({ project, projects, onSwitch, onCreate, onDelete, email, tier, location }) {
  const [showModal, setShowModal] = React.useState(false);
  const [editing, setEditing] = React.useState(false);
  const [nameVal, setNameVal] = React.useState('');

  const name = (project && project.name) ? project.name : 'LOADING...';
  const progress = project ? Math.round((project.journey_progress || 0) * 100) : 0;

  const TIER_ACTIVE_LIMITS = { operator:10, independent:3, player:5 };
  const activeCount = (projects||[]).filter(p=>p.status==='active').length;
  const tierKey = (tier||'operator').toLowerCase();
  const atLimit = activeCount >= (TIER_ACTIVE_LIMITS[tierKey] || 10);
  const tierMax = TIER_ACTIVE_LIMITS[tierKey] || 10;

  const vaultCount = (project && project.vault_count) || 0;
  const buildings = (project && project.buildings) || {};
  const buildingsTouched = Object.values(buildings).filter(b => b.state && b.state !== 'untouched').length;
  const statusLabel = (project && project.status) ? project.status.toUpperCase() : 'ACTIVE';

  function relativeDate(iso) {
    if (!iso) return '—';
    const diff = Date.now() - new Date(iso).getTime();
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + ' days ago';
    if (days < 30) return Math.floor(days/7) + ' wks ago';
    return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  function shortDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});
  }

  function startEdit() { setNameVal(name); setEditing(true); }
  function commitEdit(e) {
    const val = (e.target.value||nameVal).trim();
    setEditing(false);
    if (!val || val === name || !project) return;
    fetch(API_URL+'/api/projects/update', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ project_id: project.id, name: val, email })
    }).then(r=>r.json()).then(d=>{ if(d.success && onSwitch) onSwitch({...project, name:val}); }).catch(()=>{});
  }
  function handleKey(e) {
    if (e.key==='Enter') { e.target.blur(); commitEdit(e); }
    if (e.key==='Escape') { setEditing(false); }
  }

  return (
    <div className="psp">
      {showModal && (
        <ProjectModal
          projects={projects} activeProject={project}
          onSwitch={p=>{ onSwitch(p); setShowModal(false); }}
          onCreate={()=>{ onCreate(); setShowModal(false); }}
          onDelete={p=>{ onDelete(p); }}
          onClose={()=>setShowModal(false)}
          email={email} tier={tier}
        />
      )}

      <div className="psp-top-row">
        <div className="psp-top-left">
          <div className="psp-panel-title">Project Status</div>
          <div className="psp-active-label">
            <span className="psp-active-dot"/>
            <span className="psp-active-text">Active Project</span>
          </div>
          <div className="psp-name-row">
            {editing
              ? <input className="psp-name-input" autoFocus value={nameVal}
                  onChange={e=>setNameVal(e.target.value)} onBlur={commitEdit} onKeyDown={handleKey}/>
              : <div className="psp-name" onClick={()=>setShowModal(true)}>{name}</div>
            }
          </div>
        </div>
        <div className="psp-top-gif">
          <img src="assets/SY_OFFICIAL_SHUTTER_BGSQ.gif" alt="" className="psp-shutter-gif"/>
        </div>
      </div>

      <div className="psp-divider"/>

      <div className="psp-je">
        <div className="psp-je-title-row">
          <span className="psp-je-title">Journey Engine</span>
          <span className="psp-je-pct">{progress}%</span>
        </div>
        <div className="psp-je-bar">
          <div className="psp-je-bar-fill" style={{width:progress+'%'}}/>
        </div>
        <div className="psp-je-meta">
          <span className="psp-je-meta-label">FY Path</span>
          <span className="psp-je-meta-val">
            {project && project.fy_path && project.fy_path.length > 0
              ? project.fy_path.length + ' buildings'
              : 'Loading...'}
          </span>
        </div>
        <div className="psp-je-meta">
          <span className="psp-je-meta-label">Next Up</span>
          <span className="psp-je-meta-val">
            {project && project.fy_path && project.fy_path.length > 0
              ? project.fy_path[0].toUpperCase()
              : '—'}
          </span>
        </div>
      </div>

      <div className="psp-divider"/>

      <div className="psp-stats">
        <div className="psp-stat-row">
          <span className="psp-stat-label">Project Status</span>
          <span className="psp-stat-val psp-stat-active">{statusLabel}</span>
        </div>
        <div className="psp-stat-row">
          <span className="psp-stat-label">Date Started</span>
          <span className="psp-stat-val">{project ? shortDate(project.created_at) : '—'}</span>
        </div>
        <div className="psp-stat-row">
          <span className="psp-stat-label">Last Session</span>
          <span className="psp-stat-val">{project ? relativeDate(project.last_accessed) : '—'}</span>
        </div>
        <div className="psp-stat-row">
          <span className="psp-stat-label">Buildings Entered</span>
          <span className="psp-stat-val">{buildingsTouched} of 12</span>
        </div>
        <div className="psp-stat-row">
          <span className="psp-stat-label">Vault Items</span>
          <span className="psp-stat-val">{vaultCount} locked</span>
        </div>
        <div className="psp-stat-row">
          <span className="psp-stat-label">Current Location</span>
          <span className="psp-stat-val">{location||'THE LOT'}</span>
        </div>
        <div className="psp-stat-row">
          <span className="psp-stat-label">Project Slots</span>
          <span className="psp-stat-val">{activeCount} of {tierMax} active</span>
        </div>
      </div>

      <button className={"psp-cta"+(atLimit?" at-limit":"")}
        onClick={()=>{ if(!atLimit) onCreate(); }}>
        {atLimit ? 'PROJECT LIMIT REACHED' : '+ NEW PROJECT'}
      </button>
    </div>
  );
}

// ── STUDIO WORLD HERO ─────────────────────────────────────────────────────────
function StudioWorldHero({ studioName, archetype, phase, seed, activeProject, projects, onProjectSwitch, onProjectCreate, onProjectDelete, email, tier }) {
  const [heliosState, setHeliosState] = React.useState('initializing');
  const videoRef = React.useRef(null);

  React.useEffect(() => {
    let mounted = true;
    let reactor = null;

    async function initReactor() {
      await new Promise(r => setTimeout(r, 1200));
      if (!mounted) return;
      setHeliosState('generating');

      try {
        const res = await fetch('https://studioyou-api-198959034459.us-east1.run.app/api/reactor/token');
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          if (res.status === 402 || (errData.error && errData.error.includes('credits'))) {
            console.warn('[Helios] Reactor credits depleted — degrading to static mode');
            if (mounted) setHeliosState('live');
            return;
          }
          throw new Error('token_fail');
        }
        const { token } = await res.json();

        // Wait for the module script to expose Reactor on window (runs async before Babel)
        let attempts = 0;
        while (!window._Reactor && attempts < 40) {
          await new Promise(r => setTimeout(r, 100));
          attempts++;
        }
        if (!window._Reactor) throw new Error('Reactor SDK not loaded');
        console.log('[Helios] SDK ready. Reactor:', typeof window._Reactor);

        reactor = new window._Reactor({ modelName: 'helios' });

        // Stream ref — track arrives before generation starts
        let reactorStream = null;
        const attachStream = (stream) => {
          reactorStream = stream;
          const vid = videoRef.current;
          if (vid) {
            vid.srcObject = stream;
            // Don't play() yet — wait until after start() so frames are actually flowing
            console.log('[Helios] Stream attached to video element (holding play until start)');
          }
        };

        reactor.on('trackReceived', (name, track, stream) => {
          console.log('[Helios] trackReceived:', name, 'readyState:', track.readyState);
          attachStream(stream);
        });

        reactor.on('statusChanged', (status) => {
          console.log('[Helios] statusChanged:', status);
        });

        reactor.on('error', (error) => {
          const msg = JSON.stringify(error);
          if (msg.includes('credits_depleted') || msg.includes('402')) {
            console.warn('[Helios] Reactor credits depleted — degrading to static mode');
            if (mounted) setHeliosState('live');
            return;
          }
          console.warn('Reactor error:', error);
          if (error.recoverable) {
            setTimeout(() => reactor && reactor.reconnect(), (error.retryAfter || 3) * 1000);
          }
        });

        await reactor.connect(token);
        console.log('[Helios] Connected. Waiting for ready status...');

        // Wait for status = ready before sending commands
        await new Promise((resolve, reject) => {
          const current = reactor.getStatus();
          if (current === 'ready') { resolve(); return; }
          const onStatus = (status) => {
            console.log('[Helios] Status:', status);
            if (status === 'ready') { reactor.off('statusChanged', onStatus); resolve(); }
          };
          reactor.on('statusChanged', onStatus);
          setTimeout(() => { reactor.off('statusChanged', onStatus); reject(new Error('status ready timeout')); }, 30000);
        });

        console.log('[Helios] Ready. Configuring session...');

        await reactor.sendCommand('set_seed', { seed });
        console.log('[Helios] Seed set:', seed);

        // Upload all lot reference images upfront — CORS enabled via Netlify _headers
        // Cycling through different angles forces Helios to reanchor composition on each chunk
        const LOT_IMAGES = [
          'assets/STUDIO_WS_BASE.jpg',        // drone high, tower centered, full lot
          'assets/LOT_POV_DRONE_MEDWS_WT.jpg', // drone medium, tower left foreground
          'assets/LOT_GROUND_WS_WT_BG.jpg',   // ground wide, tower background
          'assets/LOT_GROUND_WT_FG.jpg',      // ground, tower right foreground
          'assets/LOT_GROUND_WT_BG.jpg',      // ground, tower background, backlot left
          'assets/LOT_GROUND_CU_POV_WT.jpg',  // ground, looking up through tower lattice
        ];

        const imageRefs = [];
        for (const imgPath of LOT_IMAGES) {
          try {
            const imgRes = await fetch('https://studioyou.app/' + imgPath);
            const imgBlob = await imgRes.blob();
            const imgFile = new File([imgBlob], imgPath.split('/').pop(), { type: 'image/jpeg' });
            const ref = await reactor.uploadFile(imgFile);
            imageRefs.push(ref);
            console.log('[Helios] Uploaded:', imgPath);
          } catch(e) {
            console.warn('[Helios] Failed to upload:', imgPath, e.message);
          }
        }

        // Set initial reference image — drone high establishing shot
        if (imageRefs.length > 0) {
          await reactor.sendCommand('set_image', { image: imageRefs[0] });
          console.log('[Helios] Initial reference image set');
        }

        await reactor.sendCommand('schedule_prompt', { prompt: archetype.act1, chunk: 0 });
        console.log('[Helios] Prompt 0 scheduled');
        await reactor.sendCommand('schedule_prompt', { prompt: archetype.act2, chunk: 6 });
        await reactor.sendCommand('schedule_prompt', { prompt: archetype.act3, chunk: 12 });
        console.log('[Helios] All prompts scheduled — calling start');
        await reactor.sendCommand('start', {});
        console.log('[Helios] Started — waiting for frames');

        // Stream arrived before start — now frames are flowing, play it
        console.log('[Helios] post-start check — reactorStream:', !!reactorStream, 'videoRef:', !!videoRef.current);
        if (reactorStream && videoRef.current) {
          videoRef.current.srcObject = reactorStream;
          console.log('[Helios] srcObject set, calling play()');
          try {
            await videoRef.current.play();
            console.log('[Helios] Playing — stream live');
            if (mounted) setHeliosState('live');
          } catch(playErr) {
            console.warn('[Helios] play() failed:', playErr.name, playErr.message);
            if (mounted) setHeliosState('live');
          }
        } else if (reactorStream) {
          console.warn('[Helios] videoRef null after start — setting live state');
          if (mounted) setHeliosState('live');
        } else {
          console.warn('[Helios] No stream at all after start');
          if (mounted) setHeliosState('live');
        }

        // Rapid image cycling — swap reference every 8 seconds to prevent trajectory lock
        // Don't wait for prompt_switched; preempt the dolly before it accelerates
        let imgTimerIndex = 1; // start from second image, first already set
        const imgTimer = setInterval(() => {
          if (!reactor || !imageRefs[imgTimerIndex]) return;
          reactor.sendCommand('set_image', {
            image: imageRefs[imgTimerIndex],
            transition: 'blend'
          }).catch(() => {});
          console.log('[Helios] Timer image swap → index', imgTimerIndex);
          imgTimerIndex = (imgTimerIndex + 1) % imageRefs.length;
        }, 8000);

        // Cycle prompts on chunk boundary
        const acts = [archetype.act1, archetype.act2, archetype.act3];
        let actIndex = 0;
        reactor.on('message', (msg) => {
          if (msg.type === 'state') {
            console.log('[Helios] state — running:', msg.data.running, 'chunk:', msg.data.current_chunk);
          }
          if (msg.type === 'event') {
            if (msg.data.event === 'prompt_switched') {
              actIndex = (actIndex + 1) % acts.length;
              const nextChunk = msg.data.chunk + 6;
              reactor.sendCommand('schedule_prompt', { prompt: acts[actIndex], chunk: nextChunk })
                .catch(() => {});
            }
          }
        });

        // Clean up timer on unmount
        const SESSION_LIMIT_MS = 30 * 1000; // 30 seconds — lowered pending Reactor's reply on token depletion
        const sessionTimer = setTimeout(() => {
          console.log('[Helios] 30-second session limit reached — stopping.');
          try { reactor.sendCommand('stop', {}); } catch(_) {}
          clearInterval(imgTimer);
          if (mounted) setHeliosState('initializing'); // revert to static bg
        }, SESSION_LIMIT_MS);

        const origCleanup = () => { clearInterval(imgTimer); clearTimeout(sessionTimer); };
        window._heliosReactor = reactor;
        window._heliosCleanup = origCleanup;

        document.addEventListener('visibilitychange', () => {
          if (!reactor) return;
          document.hidden
            ? reactor.sendCommand('pause', {})
            : reactor.sendCommand('resume', {});
        });

      } catch(e) {
        console.warn('Reactor init failed:', e);
        if (mounted) setHeliosState('live');
      }
    }

    initReactor();
    return () => {
      mounted = false;
      if (window._heliosCleanup) { window._heliosCleanup(); delete window._heliosCleanup; }
      if (reactor) reactor.disconnect().catch(() => {});
    };
  }, []);

  const statusConfig = {
    initializing: { text:'READING BRIEFING',  textColor:'#7a7c94',        dotBg:'rgba(0,200,255,0.5)' },
    generating:   { text:'GENERATING WORLD',  textColor:'var(--sy-gold)',  dotBg:'var(--sy-gold)' },
    live:         { text:'HELIOS LIVE',        textColor:'var(--sy-green)', dotBg:'var(--sy-green)' },
  };
  const sc = statusConfig[heliosState] || statusConfig.initializing;

  return (
    <div className="swh">
      <div className="swh-left-col">
        <ProjectStatusPanel
          project={activeProject}
          projects={projects}
          onSwitch={onProjectSwitch}
          onCreate={onProjectCreate}
          onDelete={onProjectDelete}
          email={email}
          tier={tier}
          location="THE LOT"
        />
        <div className="swh-lot-info">
          <div className="swh-lot-title fade-up d1">THE LOT</div>
          <div className="swh-lot-meta fade-up d2">
            <span>Phase {String(phase).match(/\d+/)?.[0] || '1'}</span><div className="swh-lot-meta-sep"/>
            <span>12 Buildings</span><div className="swh-lot-meta-sep"/>
            <span>{studioName.toUpperCase()}</span>
          </div>
        </div>
      </div>
      <div className="swh-video-col">
        <div className="swh-bg"/>
        <div className="swh-grad-b"/>
        <div className="swh-grad-t"/>
        <video ref={videoRef} autoPlay muted playsInline
          style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',zIndex:1,pointerEvents:'none',
                  opacity:heliosState==='live'?1:0.01,transition:'opacity 1.2s ease'}}/>
      <div className="swh-statusbar">
        <div className="swh-status-pill">
          <div style={{width:5,height:5,borderRadius:'50%',background:sc.dotBg,animation:'pg 2s infinite',flexShrink:0}}/>
          <div className="swh-status-text" style={{color:sc.textColor}}>{sc.text}</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:'7px',letterSpacing:'0.18em',textTransform:'uppercase',color:'rgba(240,242,255,0.35)',fontFamily:"'Outfit',sans-serif",fontWeight:300,whiteSpace:'nowrap'}}>Live Studio Experience by</span>
          <div
            onClick={()=>window.open('https://www.reactor.inc','_blank')}
            style={{
              display:'inline-flex',alignItems:'center',
              padding:'4px 10px',cursor:'pointer',flexShrink:0,
              background:'linear-gradient(160deg,#faf8f4 0%,#f5f2ec 50%,#ede9e1 100%)',
              border:'1px solid rgba(245,242,236,0.9)',
              borderBottom:'1px solid rgba(180,175,165,0.8)',
              borderRight:'1px solid rgba(180,175,165,0.8)',
              boxShadow:'inset 0 1px 0 rgba(255,255,255,0.9),inset 1px 0 0 rgba(255,255,255,0.6),inset 0 -1px 0 rgba(0,0,0,0.15),inset -1px 0 0 rgba(0,0,0,0.08),0 3px 10px rgba(0,0,0,0.55),0 1px 3px rgba(0,0,0,0.4)',
              transition:'all 0.15s ease',
            }}
          >
            <img src="assets/reactor-logo-dark.svg" alt="Reactor" style={{height:'9px',width:'auto',filter:'brightness(0)',display:'block',opacity:0.85}} />
          </div>
        </div>
      </div>
      </div>{/* swh-video-col */}
    </div>
  );
}

function getStatus(building, rec, bldgState) {
  // Project progress takes precedence over FY recommendations
  if (bldgState) {
    if (bldgState.state === 'complete') return 'complete';
    if (bldgState.state !== 'untouched') return 'active';
  }
  // FY recommendations
  if (!rec) return 'open';
  if (building.id === rec) return 'fy-strategic';
  const ri = BUILDINGS.findIndex(b=>b.id===rec);
  const ti = BUILDINGS.findIndex(b=>b.id===building.id);
  if (Math.abs(ri-ti)===1) return 'fy-advisory';
  return 'open';
}

function IndependentFYPanel({ bldg, cfg, studioName, formation, briefing, firstName }) {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const threadRef = useRef(null);
  const inputRef  = useRef(null);

  useEffect(()=>{ if(threadRef.current) threadRef.current.scrollTop=threadRef.current.scrollHeight; },[msgs,loading]);

  async function send() {
    if (!input.trim()||loading) return;
    const msg = input.trim(); setInput('');
    const userMsg = {role:'user',content:msg};
    setMsgs(p=>[...p,userMsg]); setLoading(true); if(window.shutterShow) window.shutterShow();
    try {
      const b = briefing||{};
      const ctx = (Array.isArray(formation)?formation:[]).map((a,i)=>`Q${i+1}: ${a||''}`).join('\n');
      const system = `You are FutureYou — ${firstName||'this creator'}'s future self, guiding them inside the ${bldg.title} building of their studio.
Studio: ${studioName||'(unnamed)'} | Building context: ${cfg.tag}
Arsenal: ${normalizePill(b.arsenal)} | Roadblock: ${normalizePill(b.roadblock)} | Horizon: ${normalizePill(b.horizon)}
Formation Q&A:\n${ctx}
This building handles: ${bldg.desc}
FY insight for this building: "${cfg.fyq}"
Rules: Specific, direct, peer register. Reference their formation answers. Under 80 words unless asked for depth. No filler.`;
      const res = await fetch(API_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[...msgs,userMsg],system,email:localStorage.getItem('sy_email')||''})});
      const d = await res.json();
      const finalMsgs = [...msgs, userMsg, {role:'assistant',content:d.message||d.content||'Connection issue.'}];
      setMsgs(finalMsgs);
      const conv = finalMsgs.map(m => ({ role: m.role === 'user' ? 'user' : 'fy', text: m.content }));
      localStorage.setItem('sy_fy_conversation', JSON.stringify(conv));
    } catch(e) {
      setMsgs(p=>[...p,{role:'assistant',content:"Can't reach FutureYou right now."}]);
    }
    setLoading(false); if(window.shutterHide) window.shutterHide(); setTimeout(()=>inputRef.current?.focus(),50);
  }

  function onKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }

  return (
    <div className="platform-hub" style={{background:'rgba(11,13,26,0.6)'}}>
      <div className="hub-header" style={{borderBottom:'1px solid var(--border)',padding:'12px 16px 10px'}}>
        <div className="hub-title-row">
          <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
            <span style={{width:'5px',height:'5px',borderRadius:'50%',background:'var(--sy-green)',animation:'pg 2s infinite',flexShrink:0,display:'inline-block'}}/>
            <span style={{fontSize:'9px',letterSpacing:'0.22em',textTransform:'uppercase',color:'var(--sy-green)',fontWeight:500}}>FutureYou Chat</span>
          </div>
          <span style={{fontSize:'8px',letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--sy-green)',opacity:0.7}}>Live</span>
        </div>
      </div>
      <div className="hub-scroll" style={{gap:'12px'}} ref={threadRef}>
        <div className="bldg-fy-panel-quote">{cfg.fyq}</div>
        {msgs.map((m,i)=>(
          <div key={i} className={m.role==='user'?'msg-user':'msg-fy'} style={{padding:'0 4px'}}>{m.content}</div>
        ))}
        {loading && <div className="fy-dots" style={{padding:'4px 0'}}><span/><span/><span/></div>}
      </div>
      <div style={{padding:'12px 16px',borderTop:'1px solid var(--border)'}}>
        <div className="bldg-fy-input-row">
          <textarea
            ref={inputRef}
            className="bldg-fy-input sy-input-3d" rows="1"
            placeholder={`Ask FutureYou about ${bldg.title.charAt(0)+bldg.title.slice(1).toLowerCase()}...`}
            value={input} onChange={e=>setInput(e.target.value)} onKeyDown={onKey}
            disabled={loading} autoComplete="off" autoCorrect="off" spellCheck="false"
          />
          <button className="bldg-fy-send" onClick={send} disabled={!input.trim()||loading}>SEND</button>
        </div>
      </div>
    </div>
  );
}

// ── AVATAR STATE — module level so slot + toggle stay in sync ─────────────────
const _fyVideoState = { on: true, listeners: [] };
function _fyVideoSubscribe(fn) { _fyVideoState.listeners.push(fn); return () => { _fyVideoState.listeners = _fyVideoState.listeners.filter(f=>f!==fn); }; }
function _fyVideoSet(val) {
  _fyVideoState.on = val;
  _fyVideoState.listeners.forEach(fn=>fn(val));
  // Tell the agent to actually close/reopen the Runway AvatarSession.
  // Previously missing entirely on dashboard — the toggle only hid the
  // <video> element locally and never published anything to the room, so
  // Runway kept billing (and could still generate/speak a queued reply)
  // regardless of what the toggle visually showed. studio.html's applyMute
  // already did this correctly; dashboard never had the equivalent call.
  const r = window._fyRoom;
  if (r && r.state === 'connected') {
    try {
      const payload = new TextEncoder().encode(JSON.stringify({ type: 'fy_avatar_control', on: val }));
      r.localParticipant.publishData(payload, { topic: 'fy_avatar_control', reliable: true });
    } catch(e) {
      console.warn('[FY] avatar control publish failed:', e);
    }
  }
}

// sy_avatar_replica_id  — Tavus replica_id once created

// sy_avatar_conv_url    — Tavus conversation_url once ready

// ── FYLiveKitRoom — connects to a LiveKit room and renders the avatar video ──
// Uses livekit-client UMD (loaded via CDN above). The avatar worker (currently
// Runway Characters) publishes its own video track into the room. We subscribe
// to any remote video track and attach it directly to a <video> element — no
// Daily iframe. Not identity-gated to a specific provider so this survives
// future avatar-provider swaps without another find/replace.
function FYLiveKitRoom({ token, url, onEnd }) {
  const containerRef = React.useRef(null);
  const roomRef = React.useRef(null);
  // Spawning cover — true once the first remote video frame source is attached.
  // Covers Runway worker boot latency so the panel is never a blank black box.
  const [spawned, setSpawned] = React.useState(false);
  // Distinguishes first arrival ("Arriving") from a mid-conversation drop and
  // reconnect, e.g. the Session AD avatar rotation swap ("Reconnecting").
  const hasBeenLiveRef = React.useRef(false);
  React.useEffect(() => { if (spawned) hasBeenLiveRef.current = true; }, [spawned]);
  // True while LiveKit is attempting to resume an existing connection
  // (RoomEvent.Reconnecting → Reconnected/Disconnected). Prevents a
  // resumable network blip from being treated as a terminal disconnect.
  const reconnectingRef = React.useRef(false);

  React.useEffect(() => {
    if (!token || !url || !containerRef.current) return;

    function initRoom() {
      const LC = window.LivekitClient;
      if (!LC) { console.error('[FYLiveKitRoom] livekit-client not loaded'); return; }

      const room = new LC.Room({
      adaptiveStream: true,
      dynacast: true,
    });
    roomRef.current = room;
    window._fyRoom = room; // expose for FYPanel chat send

    // Listen for FY agent replies and section recommendations
    room.on(LC.RoomEvent.DataReceived, function(payload, participant, kind, topic) {
      try {
        var msg = JSON.parse(new TextDecoder().decode(payload));
        if (msg.type === 'fy_reply' && msg.text) {
          window.dispatchEvent(new CustomEvent('fy_agent_reply', { detail: { text: msg.text } }));
        }
        if (msg.type === 'fy_section_recommendation' && msg.section_id) {
          window.dispatchEvent(new CustomEvent('fy_section_recommendation', { detail: { section_id: msg.section_id } }));
        }
      } catch(e) { /* ignore non-JSON */ }
    });

    room.on(LC.RoomEvent.TrackSubscribed, function(track, publication, participant) {
      if (track.kind === LC.Track.Kind.Video) {
        // Rotation (Session AD) tears down and recreates the AvatarSession every
        // ~270s, which means a new participant publishes a new video track while
        // the old one unsubscribes. Without clearing prior elements here, each
        // rotation stacks another <video> in the container — the old one never
        // gets removed, just detached, so it can end up rendering a frozen stale
        // frame instead of the new live one depending on DOM order. Clear any
        // previously attached video elements before appending the new one so
        // there's ever only one in the container.
        if (containerRef.current) {
          var stale = containerRef.current.querySelectorAll('video');
          stale.forEach(function(v){ v.remove(); });
        }
        var el = track.attach();
        el.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;position:absolute;top:0;left:0;z-index:1;';
        if (containerRef.current) containerRef.current.appendChild(el);
        setSpawned(true);
      }
      if (track.kind === LC.Track.Kind.Audio) {
        var audioEl = track.attach();
        audioEl.style.display = 'none';
        document.body.appendChild(audioEl);
      }
    });

    room.on(LC.RoomEvent.TrackUnsubscribed, function(track) {
      // detach() alone leaves the element in the DOM — remove it explicitly so
      // rotation swaps don't accumulate stale video/audio elements.
      var els = track.detach();
      els.forEach(function(el){ if (el && el.remove) el.remove(); });
      if (track.kind === LC.Track.Kind.Video) setSpawned(false);
    });

    room.on(LC.RoomEvent.Reconnecting, function() {
      // LiveKit is attempting to resume the existing connection (seen in
      // logs as "signal client closed... Resume" followed by "resuming
      // connection... attempt: N"). This is not a terminal disconnect —
      // firing onEnd here would reset local state and spin up a brand
      // new room via startStock() while the original room/agent/avatar
      // is still alive server-side, which is the multi-room credit-drain
      // bug found in Session AE. Just flag it and wait.
      reconnectingRef.current = true;
    });

    room.on(LC.RoomEvent.Reconnected, function() {
      reconnectingRef.current = false;
    });

    room.on(LC.RoomEvent.Disconnected, function() {
      window._fyRoom = null;
      // Only treat this as terminal if we weren't mid-resume. A resume
      // attempt that ultimately fails still reaches Disconnected, so this
      // isn't a full guarantee, but it stops the common case: a transient
      // blip that recovers on its own shouldn't wipe the session and
      // trigger a fresh livekit-session request on top of the still-live
      // original room.
      if (reconnectingRef.current) { reconnectingRef.current = false; return; }
      if (onEnd) onEnd();
    });

    // Browser autoplay policy: dashboard is often the first page loaded this
    // session, so no user gesture has occurred yet — audio playback (unlike
    // video) can be silently blocked until first click. Same fix as
    // studio.html (Session AB) — resume on first click anywhere on the page.
    room.on(LC.RoomEvent.AudioPlaybackStatusChanged, function() {
      if (!room.canPlaybackAudio) {
        var resume = function() { room.startAudio().catch(function(){}); document.removeEventListener('click', resume); };
        document.addEventListener('click', resume);
      }
    });

    room.connect(url, token, { autoSubscribe: true })
      .then(function() {
        // Don't wait on AudioPlaybackStatusChanged to fire — it doesn't
        // always fire, and when it doesn't the click-to-resume listener
        // never attaches, so audio stays silently blocked. Call startAudio
        // directly on connect; if the browser's autoplay gate blocks it,
        // this rejects and the click-listener below still catches it.
        room.startAudio().catch(function(){});
        // Start muted — mic only activates when creator taps the mic button
        return room.localParticipant.setMicrophoneEnabled(false);
      })
      .catch(function(e) {
        console.error('[FYLiveKitRoom] connect error', e);
        if (onEnd) onEnd();
      });

      return function() {
        room.disconnect();
        roomRef.current = null;
        window._fyRoom = null;
      };
    }

    // Load livekit-client dynamically to prevent Babel from processing it
    if (window.LivekitClient) {
      initRoom();
    } else {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/livekit-client@2.9.9/dist/livekit-client.umd.min.js';
      s.onload = initRoom;
      document.head.appendChild(s);
    }
  }, [token, url]);

  return React.createElement('div',
    { style: { width: '100%', height: '100%', position: 'relative', background: '#06091a' } },
    React.createElement('div', { ref: containerRef, style: { width: '100%', height: '100%', position: 'relative' } }),
    !spawned && React.createElement('div', {
      style: { position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, zIndex: 2, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '10px', background: '#06091a' }
    },
      React.createElement('img', { src: 'assets/shutter1.gif', alt: '', style: { width: '54px', height: '54px', objectFit: 'contain' } }),
      React.createElement('div', { style: { fontSize: '9px', letterSpacing: '0.18em', textTransform: 'uppercase', color: 'rgba(0,200,255,0.65)' } }, hasBeenLiveRef.current ? 'FutureYou is reconnecting' : 'FutureYou is arriving'),
      React.createElement('div', { style: { fontSize: '9px', color: 'rgba(240,242,255,0.35)' } }, 'one moment')
    )
  );
}

function FYAvatarSlot() {
  const email = localStorage.getItem('sy_email') || '';

  // 'idle' | 'upload' | 'uploading' | 'training' | 'ready' | 'live' | 'skipped'
  const [mode, setMode] = React.useState(() => {
    const status = localStorage.getItem('sy_avatar_status');
    const lkToken = localStorage.getItem('sy_lk_token');
    const lkTs = localStorage.getItem('sy_lk_ts');
    // Auto-expire LiveKit token after 50 minutes
    if (lkToken && lkTs && Date.now() - parseInt(lkTs) > 50 * 60 * 1000) {
      // Same leak as reset() below: the room this token pointed at is likely
      // still alive server-side. Best-effort close before dropping local state.
      const staleRoom = localStorage.getItem('sy_lk_room');
      if (staleRoom) {
        fetch(API_URL + '/api/avatar/end-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room_name: staleRoom })
        }).catch(function(){});
      }
      ['sy_lk_token','sy_lk_url','sy_lk_room','sy_lk_ts','sy_avatar_status'].forEach(k => localStorage.removeItem(k));
      return 'idle';
    }
    if (lkToken) return 'live';
    if (status === 'ready') return 'ready';
    if (status === 'training') return 'training';
    if (status === 'skipped') return 'skipped';
    return 'idle';
  });

  const [replicaId, setReplicaId] = React.useState(localStorage.getItem('sy_avatar_replica_id') || '');
  const [lkToken, setLkToken] = React.useState(localStorage.getItem('sy_lk_token') || '');
  const [lkUrl, setLkUrl] = React.useState(localStorage.getItem('sy_lk_url') || '');
  const [dragOver, setDragOver] = React.useState(false);
  const [error, setError] = React.useState('');
  const pollRef = React.useRef(null);
  const [videoOn, setVideoOn] = React.useState(_fyVideoState.on);
  React.useEffect(() => _fyVideoSubscribe(setVideoOn), []);

  // Archetype-stills cycling for idle teaser — hook always runs; interval ticks
  // through 'uploading' too so the background never cuts to a blank screen.
  const [stillIdx, setStillIdx] = React.useState(0);
  React.useEffect(() => {
    if (mode !== 'idle' && mode !== 'uploading') return;
    const t = setInterval(() => setStillIdx(i => (i + 1) % FY_AVATAR_STILLS.length), 2800);
    return () => clearInterval(t);
  }, [mode]);

  React.useEffect(() => {
    function onReset() { reset(); }
    window.addEventListener('sy_avatar_reset', onReset);
    return () => window.removeEventListener('sy_avatar_reset', onReset);
  }, []);

  // "Want to see who's talking to you?" nudge in the chat panel dispatches this
  // to launch the avatar directly — previously it only fired sy_avatar_reset,
  // which just cleared localStorage and dropped mode back to idle with no
  // visible effect if it was already idle. Dead click from the user's side.
  React.useEffect(() => {
    function onStart() { startStock(); }
    window.addEventListener('sy_avatar_start', onStart);
    return () => window.removeEventListener('sy_avatar_start', onStart);
  }, [mode, email]);

  // Poll training status
  React.useEffect(() => {
    if (mode !== 'training' || !replicaId) return;
    pollRef.current = setInterval(async () => {
      try {
        const res = await fetch(`${API_URL}/api/avatar/status/${replicaId}`);
        const d = await res.json();
        if (d.status === 'ready') {
          clearInterval(pollRef.current);
          localStorage.setItem('sy_avatar_status', 'ready');
          setMode('ready');
        } else if (d.status === 'error') {
          clearInterval(pollRef.current);
          setError('Replica training failed. Try again.');
          setMode('idle');
        }
      } catch(e) { /* keep polling */ }
    }, 8000);
    return () => clearInterval(pollRef.current);
  }, [mode, replicaId]);

  async function startStock() {
    console.log('[FYAvatar] startStock called — mode:', mode, 'email:', email);
    if (mode === 'uploading' || mode === 'live') { console.log('[FYAvatar] startStock blocked — already', mode); return; }
    setMode('uploading');
    localStorage.setItem('sy_avatar_loading', '1');
    setError('');
    try {
      const thread = JSON.parse(localStorage.getItem('sy_fy_conversation') || '[]');
      console.log('[FYAvatar] calling livekit-session, thread length:', thread.length);
      const resp = await fetch(API_URL + '/api/avatar/livekit-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, conversation_thread: thread })
      });
      console.log('[FYAvatar] response status:', resp.status, resp.ok);
      const data = await resp.json();
      console.log('[FYAvatar] response data:', JSON.stringify(data).slice(0, 120));
      if (!resp.ok || !data.token) throw new Error(data.error || 'FutureYou is temporarily unavailable.');
      localStorage.setItem('sy_lk_token', data.token);
      localStorage.setItem('sy_lk_url', data.livekit_url);
      localStorage.setItem('sy_lk_room', data.room_name);
      localStorage.setItem('sy_lk_ts', Date.now().toString());
      localStorage.setItem('sy_avatar_status', 'ready');
      setLkToken(data.token);
      setLkUrl(data.livekit_url);
      setMode('live');
      localStorage.removeItem('sy_avatar_loading');
      console.log('[FYAvatar] mode set to live — token saved, FYLiveKitRoom should mount');
    } catch(e) {
      console.error('[FYAvatar] startStock failed:', e.message);
      localStorage.removeItem('sy_avatar_loading');
      setError(e.message);
      setMode('idle');
    }
  }

  async function startConversation() {
    setMode('uploading'); // reuse loading state
    setError('');
    try {
      const resp = await fetch(`${API_URL}/api/avatar/conversation`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, replica_id: replicaId })
      });
      const data = await resp.json();
      if (!resp.ok || !data.conversation_url) throw new Error(data.error || 'Conversation failed');
      localStorage.setItem('sy_avatar_conv_url', data.conversation_url);
      setConvUrl(data.conversation_url);
      setMode('live');
    } catch(e) {
      setError(e.message);
      setMode('ready');
    }
  }

  function skip() {
    localStorage.setItem('sy_avatar_status', 'skipped');
    setMode('skipped');
  }

  function reset() {
    // Close the room server-side before wiping local state. Previously this
    // only cleared localStorage and dropped UI to idle — the backend room,
    // agent process, avatar session, and Cartesia pipeline kept running
    // untouched, and the next startStock() call opened a brand new room on
    // top of it. That's the mechanism behind the multi-room credit drain
    // (three concurrent rooms billing Runway/Cartesia independently, one
    // browser session). Best-effort, fire-and-forget — never block the UI
    // reset on this call succeeding.
    const roomName = localStorage.getItem('sy_lk_room');
    if (roomName) {
      fetch(API_URL + '/api/avatar/end-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room_name: roomName })
      }).catch(function(){});
    }
    ['sy_avatar_replica_id','sy_avatar_status','sy_lk_token','sy_lk_url','sy_lk_room','sy_lk_ts'].forEach(k => localStorage.removeItem(k));
    setReplicaId(''); setLkToken(''); setLkUrl(''); setError(''); setMode('idle');
  }

  // ── LIVE: LiveKit room (Claude agent + Tavus video rendering) ──
  if (mode === 'live' && lkToken && lkUrl && videoOn) {
    return (
      <div className="fy-avatar-slot" style={{position:'relative'}}>
        <FYLiveKitRoom token={lkToken} url={lkUrl} onEnd={reset} />
        <div style={{position:'absolute',bottom:6,right:8,cursor:'pointer',fontSize:9,letterSpacing:'0.14em',textTransform:'uppercase',color:'rgba(240,242,255,0.3)'}} onClick={reset}>End</div>
      </div>
    );
  }

  // ── VIDEO OFF — collapsed ──
  if (!videoOn) {
    return <div className="fy-avatar-slot collapsed" />;
  }

  // ── IDLE + UPLOADING: archetype cycling background stays up throughout —
  // clicking the CTA swaps the overlay text to a spawning flash instead of
  // cutting to a separate blank gif screen. ──
  if (mode === 'idle' || mode === 'uploading') {
    return (
      <div id="tour-avatar" className="fy-avatar-slot" style={{overflow:'hidden'}}>
        <div className="av-cycle-wrap">
          {FY_AVATAR_STILLS.map((src, i) => (
            <img key={src} src={src} className={`av-cycle-img${i === stillIdx ? ' active' : ''}`} alt="" />
          ))}
          <div className="av-cycle-overlay" />
        </div>
        {mode === 'idle' ? (
          <div className="av-idle-content">
            <div className="av-idle-label">FUTUREYOU AVATAR</div>
            <div className="av-idle-title">This is who<br/>you're building toward.</div>
            <div className="av-idle-sub">A live generative video of your future creative self. Different from chat — immersive, visual, generative.</div>
            <div className="av-idle-cta" onClick={startStock}>Set Up Your Avatar →</div>
          </div>
        ) : (
          <div className="av-idle-content">
            <div className="av-spawning-flash">Spawning FutureYou…</div>
          </div>
        )}
      </div>
    );
  }

  // ── TRAINING ──
  if (mode === 'training') {
    return (
      <div className="fy-avatar-slot" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,padding:'12px'}}>
        <div style={{display:'flex',gap:4}}>{[0,1,2].map(i=><span key={i} style={{width:4,height:4,borderRadius:'50%',background:'var(--sy-green)',animation:`dp 1.4s ${i*0.2}s infinite`}}/>)}</div>
        <div style={{fontSize:9,letterSpacing:'0.16em',textTransform:'uppercase',color:'rgba(76,255,145,0.6)',textAlign:'center'}}>Building FutureYou</div>
        <div style={{fontSize:9,color:'rgba(240,242,255,0.25)',textAlign:'center',lineHeight:1.5}}>Tavus Phoenix is aging<br/>your photo. ~2–5 min.</div>
      </div>
    );
  }

  // ── READY: replica trained, start conversation ──
  if (mode === 'ready') {
    return (
      <div className="fy-avatar-slot" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,padding:'12px'}}>
        <div style={{width:48,height:48,borderRadius:'50%',border:'1px solid rgba(76,255,145,0.4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>✓</div>
        <div style={{fontSize:9,letterSpacing:'0.16em',textTransform:'uppercase',color:'var(--sy-green)',textAlign:'center'}}>FutureYou Ready</div>
        {error && <div style={{fontSize:9,color:'var(--red)',textAlign:'center'}}>{error}</div>}
        <div style={{fontSize:9,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--cyan)',cursor:'pointer',border:'1px solid rgba(0,200,255,0.3)',padding:'5px 12px'}} onClick={startConversation}>Go Live →</div>
      </div>
    );
  }

  // ── SKIPPED ──
  if (mode === 'skipped') {
    return (
      <div className="fy-avatar-slot" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,cursor:'pointer'}} onClick={startStock}>
        <div style={{fontSize:9,letterSpacing:'0.16em',textTransform:'uppercase',color:'rgba(240,242,255,0.2)',textAlign:'center'}}>Avatar not set up</div>
        <div style={{fontSize:9,color:'rgba(0,200,255,0.4)',letterSpacing:'0.1em',textTransform:'uppercase'}}>Meet FutureYou →</div>
      </div>
    );
  }

  return <div className="fy-avatar-slot" />;
}

// Toggles LiveKit room mic (for agent STT) + Web Speech API (for transcript in input field)
function MicButton({ onTranscript, disabled }) {
  const [listening, setListening] = React.useState(false);
  const recRef = React.useRef(null);

  function toggle() {
    var fyRoom = window._fyRoom;
    if (listening) {
      // Stop listening
      if (recRef.current) { try { recRef.current.stop(); } catch(e) {} recRef.current = null; }
      if (fyRoom) fyRoom.localParticipant.setMicrophoneEnabled(false);
      setListening(false);
      return;
    }
    // Start listening — enable room mic for agent STT
    if (fyRoom) fyRoom.localParticipant.setMicrophoneEnabled(true);
    // Also run Web Speech API to get transcript into the input field
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      var rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = function(e) {
        var transcript = e.results[0][0].transcript;
        if (transcript && onTranscript) onTranscript(transcript);
      };
      rec.onend = function() {
        // Mute mic again after speech ends
        if (fyRoom) fyRoom.localParticipant.setMicrophoneEnabled(false);
        setListening(false);
        recRef.current = null;
      };
      rec.onerror = function() {
        if (fyRoom) fyRoom.localParticipant.setMicrophoneEnabled(false);
        setListening(false);
        recRef.current = null;
      };
      recRef.current = rec;
      rec.start();
    }
    setListening(true);
  }

  return (
    <button
      onClick={toggle}
      disabled={disabled}
      title={listening ? 'Stop listening' : 'Speak to FutureYou'}
      style={{
        background: listening ? 'rgba(76,255,145,0.12)' : 'transparent',
        border: 'none',
        borderRight: '1px solid var(--border)',
        color: listening ? 'var(--sy-green)' : 'rgba(240,242,255,0.3)',
        cursor: disabled ? 'default' : 'pointer',
        fontSize: '14px',
        padding: '0 12px',
        height: '38px',
        flexShrink: 0,
        transition: 'all 0.15s',
        display: 'flex',
        alignItems: 'center',
      }}
    >
      {listening ? '⏹' : '🎙'}
    </button>
  );
}

// Top-level, not component-scoped — its only dependency is window._fyRoom, a
// global. Session AD: was previously defined inside FYPanel only, but called
// from handlePlanReady in the outer App component too — a ReferenceError at
// that call site (confirmed via browser console on a live test) silently
// aborted the rest of that setTimeout callback, which is why the "See you
// there." handoff line never spoke AND the navigation right after it in the
// same callback never fired. Same root cause for both symptoms.
function speakLine(line){
  // Direct TTS via session.say() on the agent side — bypasses the LLM turn
  // entirely, so the line is guaranteed to be spoken exactly as written.
  // Previous approach asked the LLM to comply with a "[SPOKEN LINE]" text
  // convention it had no system-prompt awareness of — it would truncate or
  // paraphrase instead of reciting verbatim. No-op when avatar room isn't live.
  var r=window._fyRoom;
  if(r&&r.state==='connected'){
    try{
      var p=new TextEncoder().encode(JSON.stringify({type:'fy_say_verbatim',text:line}));
      r.localParticipant.publishData(p,{topic:'fy_chat',reliable:true});
    }catch(e){}
  }
}

function FYPanel({ firstName, formation, briefing, studioName, panelRef, inputRef:extRef, onRec, onNameStudio, onPlanReady }) {
