<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* CINEMATIC BACKGROUND SYSTEM */
  .bg-cinema {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }
  .bg-layer {
    position: absolute; inset: 0;
    background-size: 110%;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.8s ease;
    transform: scale(1.08);
  }
  .bg-layer.active {
    opacity: 1;
    animation: kenBurns 18s ease-out forwards;
  }
  /* Four subtle Ken Burns variants — assigned by layer id mod 4 */
  .bg-layer.active.kb-0 { animation-name: kenBurns0; }
  .bg-layer.active.kb-1 { animation-name: kenBurns1; }
  .bg-layer.active.kb-2 { animation-name: kenBurns2; }
  .bg-layer.active.kb-3 { animation-name: kenBurns3; }
  @keyframes kenBurns0 {
    from { transform: scale(1.08) translate(0px, 0px); }
    to   { transform: scale(1.0)  translate(-12px, -8px); }
  }
  @keyframes kenBurns1 {
    from { transform: scale(1.0)  translate(10px, 0px); }
    to   { transform: scale(1.08) translate(-8px, -10px); }
  }
  @keyframes kenBurns2 {
    from { transform: scale(1.08) translate(-10px, 8px); }
    to   { transform: scale(1.0)  translate(8px, -6px); }
  }
  @keyframes kenBurns3 {
    from { transform: scale(1.0)  translate(0px, 10px); }
    to   { transform: scale(1.08) translate(-10px, 0px); }
  }
  /* Dark overlay on top of image — preserves UI readability */

    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(6,9,26,0.82) 0%,
      rgba(6,9,26,0.72) 40%,
      rgba(6,9,26,0.80) 70%,
      rgba(6,9,26,0.95) 100%

  }
  /* Left vignette — keeps text readable */

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const API_URL = 'https://studioyou-api-198959034459.us-east1.run.app';

// INTRO VIDEO OVERLAY
function IntroOverlay({ onDone }) {
  const videoRef = useRef(null);
  const [stage, setStage] = useState('enter'); // 'enter' | 'playing' | 'fading'
  const [skipVisible, setSkipVisible] = useState(false);

  function handleEnter() {
    setStage('playing');
    const vid = videoRef.current;
    if (!vid) return;
    vid.muted = false;
    vid.play().catch(() => { vid.muted = true; vid.play(); });
    setTimeout(() => setSkipVisible(true), 2500);
  }

  function dismiss() {
    setStage('fading');
    localStorage.setItem('sy_intro_seen', '1');
    setTimeout(() => onDone(), 1000);
  }

  return (
    <div className={`intro-overlay${stage === 'fading' ? ' fading' : ''}`}>

      {stage === 'enter' && (
        <div className="intro-enter" onClick={handleEnter}>
          <div className="intro-enter-bg" style={{backgroundImage:"url('assets/SY_LOT1_MWS_V1.jpg')"}} />
          <div className="intro-enter-vignette" />
          <div className="intro-enter-content">
            <img src="assets/SY_LOGO_2D_OFFICIAL.png" className="intro-enter-logo" alt="StudioYou" />
            <button className="intro-enter-btn">ENTER</button>
            <div className="intro-enter-sub">Sound on</div>
          </div>
        </div>
      )}

      <video
        ref={videoRef}
        src="assets/SY_STUDIO_OPEN.mp4"
        playsInline
        preload="auto"
        onEnded={dismiss}
        style={{
          width:'100%', height:'100%', objectFit:'cover',
          display: stage === 'playing' ? 'block' : 'none'
        }}
      />

      {stage === 'playing' && (
        <button className={`intro-skip${skipVisible ? ' visible' : ''}`} onClick={dismiss}>
          Skip →
        </button>
      )}
    </div>
  );
}

// Topbar typewriter
let _twInterval = null;
function runTopbarTypewriter(label) {
  const el = document.querySelector('.topbar-label');
  if (!el) return;
  if (_twInterval) { clearInterval(_twInterval); _twInterval = null; }
  el.textContent = '';
  let i = 0, dir = 1, paused = 0;
  _twInterval = setInterval(() => {
    if (paused > 0) { paused--; return; }
    if (dir === 1) { i++; el.textContent = label.slice(0, i); if (i >= label.length) { dir = -1; paused = 50; } }
    else { i--; el.textContent = label.slice(0, i); if (i <= 0) { dir = 1; paused = 15; } }
  }, 65);
}

// FY Status Panel
function FYStatusPanel({ phase }) {
  const isBuilding = ['summary_email', 'studio_name'].includes(phase);
  const show = phase !== 'home';
  const imgRef = React.useRef(null);

  // shutter1.gif has a finite loop count — refresh src periodically to keep it animating
  React.useEffect(() => {
    if (isBuilding) return;
    const interval = setInterval(() => {
      if (imgRef.current) {
        imgRef.current.src = 'assets/shutter1.gif?' + Date.now();
      }
    }, 6000);
    return () => clearInterval(interval);
  }, [isBuilding]);

  return (
    <div className={`fy-status-panel ${show ? '' : 'hidden'}`}>
      <img ref={imgRef} className="fy-status-gif" src={isBuilding ? 'assets/process-management1.gif' : 'assets/shutter1.gif'} alt="" />
      <div className="fy-status-text">{isBuilding ? 'Adding tools to your studio' : 'Ready to add tools to your studio'}</div>
    </div>
  );
}

// Studio name input
function StudioNameInput({ value, onChange, onStatusChange }) {
  const [status, setStatus] = useState('empty');
  const timer = useRef(null);
  useEffect(() => {
    if (!value || value.trim().length < 2) { setStatus('empty'); onStatusChange('empty'); return; }
    setStatus('checking'); onStatusChange('checking');
    clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      try {
        const res = await fetch(`${API_URL}/api/check-studio-name?name=${encodeURIComponent(value.trim())}`);
        const d = await res.json();
        const s = d.available ? 'available' : 'taken';
        setStatus(s); onStatusChange(s);
      } catch { setStatus('available'); onStatusChange('available'); }
    }, 600);
  }, [value]);
  return (
    <div className="studio-name-wrap">
      <input className="q-input" type="text" value={value} onChange={e => onChange(e.target.value)} placeholder="Your studio name..." autoFocus maxLength={50} />
      <div className={`studio-name-status ${status}`}>
        {status !== 'empty' && <span className="sn-dot"></span>}
        {status === 'checking' && 'Checking availability...'}
        {status === 'available' && "Cool name. Let's go!"}
        {status === 'taken' && 'Unavailable. Try another.'}
      </div>
    </div>
  );
}

// Briefing Pills — multi-select
const BRIEFING_STEPS = [
  { eyebrow:'Step 1 of 3', question:"Let's power you up.", subquestion:"What are we working with first?", options:['A Raw Concept','Existing IP','Raw Footage','An Audience'], key:'arsenal' },
  { eyebrow:'Step 2 of 3', question:"What's preventing you from shipping?", subquestion:null, options:['Asset Generation','Post & Edit','Distribution','Capital'], key:'roadblock' },
  { eyebrow:'Step 3 of 3', question:"Which of these best describes what you do?", subquestion:"Pick everything that fits.", options:['Live Action Filmmaker','Generative AI Filmmaker','Documentary Filmmaker','YouTuber','Short-Form Creator','Musician','Podcaster','Streamer','Content Creator','Influencer','I Do It All'], key:'creator_type' }
];

function BriefingPills({ onComplete }) {
  const [step, setStep] = useState(0);
  const [selections, setSelections] = useState({ arsenal:[], roadblock:[], creator_type:[] });
  const [animating, setAnimating] = useState(false);
  const current = BRIEFING_STEPS[step];
  const selected = selections[current.key];

  function toggleOption(opt) {
    setSelections(prev => {
      const cur = prev[current.key];
      const next = cur.includes(opt) ? cur.filter(x => x !== opt) : [...cur, opt];
      return { ...prev, [current.key]: next };
    });
  }

  function advance() {
    if (selected.length === 0) return;
    if (step < BRIEFING_STEPS.length - 1) {
      setAnimating(true);
      setTimeout(() => { setStep(s => s + 1); setAnimating(false); }, 280);
    } else { onComplete(selections); }
  }

  return (
    <div className="briefing-wrap" style={{ opacity: animating ? 0 : 1, transition: 'opacity 0.28s ease' }}>
      <div className="briefing-step-indicator">
        {BRIEFING_STEPS.map((_, i) => <div key={i} className={`briefing-step-dot ${i < step ? 'done' : i === step ? 'active' : ''}`}></div>)}
        <span className="briefing-step-label">{current.eyebrow}</span>
      </div>
      <div className="briefing-eyebrow">FUTUREYOU / THE BRIEFING</div>
      <div className="briefing-question">{current.question}</div>
      {current.subquestion && <div className="briefing-subquestion">{current.subquestion}</div>}
      <div className="briefing-multi-note">Select all that apply</div>
      <div className="briefing-pills">
        {current.options.map(opt => (
          <button key={opt} className={`pill ${selected.includes(opt) ? 'selected' : ''}`} onClick={() => toggleOption(opt)}>{opt}</button>
        ))}
      </div>
      <div className="q-actions">
        <button className="syb syb-primary" onClick={advance} disabled={selected.length === 0} style={{fontSize:'15px',padding:'14px 32px'}}>
          {step < BRIEFING_STEPS.length - 1 ? 'Next →' : 'Lock It In →'}
        </button>
      </div>
    </div>
  );
}

// Preamble screen
function Preamble({ onBegin }) {
  return (
    <div className="preamble-wrap fade-up">
      <div className="preamble-eyebrow">STUDIOYOU / FORMATION</div>
      <div className="preamble-headline">
        <span className="grad">THE FIRST TIME</span><br/>
        <span>YOU MEET YOU.</span>
      </div>
      <div className="preamble-body">
        What follows isn't a profile setup. It isn't onboarding. FutureYou is you — years from now. Imagine meeting yourself after you've succeeded, failed, learned, made mistakes, knocked it out of the park. Made great deals and some bad ones too. But now YOU are on top. Running your own studio. Creating the work you dreamed about.
      </div>
      <div className="preamble-body">
        FutureYou has traveled back in time — here NOW to guide YOU to build the studio and the creative products you have in your head TODAY. This briefing process is the first time FutureYou meets TodayYou. You're about to build something that already knows where you're going, because it's made entirely from you.
      </div>
      <div className="preamble-body">
        Dive in. Have fun with it. Building your empire is a process. Only now you're not going it alone. Set aside 20–30 minutes. No answer is wrong.
      </div>
      <button className="syb syb-grad btn-begin" onClick={onBegin} style={{fontSize:'18px',padding:'18px 52px'}}>BEGIN FORMATION</button>
    </div>
  );
}

// 12-Question FY Chat
const QUESTIONS = [
  { q:"What do you make?", placeholder:"Tell me in your own words...", phase:"Phase 1 — What You're Building",
    chips:["Film & Video","Music","Photography","Writing","Podcasting","Animation","Streaming","Comedy","Fine Art","Design"],
    multiSelect:true, openFirst:true,
    fyInvite:"If none of these feel quite right — good. Type what you actually make below and I'll work with that." },
  { q:"Where does your work live?", placeholder:"Platforms, channels, formats — or just describe it...", phase:"Phase 1 — What You're Building",
    chips:["YouTube","TikTok","Instagram","Spotify","Twitch","LinkedIn","Newsletter","My own site","No audience yet"],
    multiSelect:true, openFirst:true,
    fyInvite:"If none of these fit — type where you actually show up." },
  { q:"How long have you been building?", placeholder:"Be specific if you want...", phase:"Phase 1 — What You're Building",
    chips:["Just starting","Under 1 year","1–3 years","3–5 years","5–10 years","10+ years"],
    openFirst:true, fyInvite:"Or describe it in your own words." },
  { q:"What's your biggest win so far?", placeholder:"Don't be modest...", phase:"Phase 2 — Your Current State",
    chips:[] },
  { q:"Any project you'd like another crack at? What would you do differently?", placeholder:"The one that got away...", phase:"Phase 2 — Your Current State",
    chips:[] },
  { q:"Who's making stuff that influences you?", placeholder:"Creators, directors, artists...", phase:"Phase 2 — Your Current State",
    chips:[] },
  { q:"A year from now — what are you creating?", placeholder:"Add more or press send...", phase:"Phase 3 — Lock Your Horizon",
    chips:["More consistent output","First big project launch","Monetizing my work","Building an audience","Going full-time"],
    multiSelect:true, fyInvite:"If none of these fit — type where you actually want to be." },
  { q:"Five years — what are you building?", placeholder:"Add more or press send...", phase:"Phase 3 — Lock Your Horizon",

  { q:"When it's truth time, what style resonates?", placeholder:"Add anything that makes this more specific to you...", phase:"Phase 4 — Calibrate FutureYou",
    chips:["Straight up, no filter","Data and examples","Story and metaphor","Big picture strategy","Step by step"],

];

function FYFormationChat({ briefingData, onComplete }) {
  const [qIndex, setQIndex] = useState(0);
  const [messages, setMessages] = useState([{ type:'fy', text:QUESTIONS[0].q }]);
  const [input, setInput] = useState('');
  const [answers, setAnswers] = useState([]);
  const [isTyping, setIsTyping] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [selectedChips, setSelectedChips] = useState([]);
  const [q12Count, setQ12Count] = useState(0);
  const messagesEndRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);
  useEffect(() => { if (!isTyping) inputRef.current?.focus(); }, [isTyping, qIndex]);
  // Reset chip state on question change
  useEffect(() => { setSelectedChips([]); setQ12Count(0); }, [qIndex]);

  async function generateSummary(finalAnswers) {
    setIsGenerating(true);
    setMessages(prev => [...prev, { type:'fy', text:'', isGenerating:true }]);
    try {
      // Build messages array for the API
      const apiMessages = finalAnswers.map((ans, i) => ([
        { role:'user', content: QUESTIONS[i].q },
        { role:'assistant', content: JSON.stringify({ message: QUESTIONS[i].q, formation:{}, complete: i === QUESTIONS.length - 1 }) },
        { role:'user', content: ans || '(no answer)' }
      ])).flat();

      const res = await fetch(`${API_URL}/api/formation/chat`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          messages: apiMessages,
          formation: {
            briefing: briefingData,
            answers: finalAnswers
          }
        })
      });
      const data = await res.json();
      const summaryText = data.message || "Briefing complete. FutureYou has everything it needs. Your studio is being built around you — your answers, your arc, your ambition. When you enter your studio, FutureYou will be waiting with its first words.";
      setIsGenerating(false);
      onComplete({ answers: finalAnswers, briefingData, summaryText });
    } catch {
      setIsGenerating(false);
      onComplete({ answers: finalAnswers, briefingData, summaryText: "Briefing complete. FutureYou has everything it needs. Your studio is being built around you — your answers, your arc, your ambition. When you enter your studio, FutureYou will be waiting with its first words." });
    }
  }

  function submitAnswer(answer) {
    const ans = answer.trim();
    const newAnswers = [...answers, ans];
    setAnswers(newAnswers);
    setMessages(prev => [...prev, { type:'user', text: ans || '—' }]);
    setInput('');
    if (qIndex >= QUESTIONS.length - 1) {
      setIsTyping(true);
      setTimeout(() => { setIsTyping(false); generateSummary(newAnswers); }, 600);
      return;
    }
    setIsTyping(true);
    setTimeout(() => {
      setMessages(prev => [...prev, { type:'fy', text:QUESTIONS[qIndex + 1].q }]);
      setQIndex(qIndex + 1); setIsTyping(false);
    }, 700);
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (input.trim()) submitAnswer(input); }
  }

  return (
    <div className="fy-chat-wrap">
      <div className="fy-chat-progress">
        {QUESTIONS.map((_, i) => <div key={i} className={`fy-chat-dot ${i <= qIndex ? 'filled' : ''}`} style={{ opacity: i <= qIndex ? 1 : 0.3 }}></div>)}
        <span className="fy-chat-dot-label">{qIndex + 1} of {QUESTIONS.length}</span>
      </div>
      <div className="fy-chat-messages">
        {messages.map((msg, i) => (
          <div key={i} className={msg.type === 'fy' ? 'fy-chat-msg-fy' : 'fy-chat-msg-user'}>
            {msg.type === 'fy' && <div className="fy-chat-msg-label">{msg.isGenerating ? 'FUTUREYOU IS READING THE ROOM...' : 'FUTUREYOU'}</div>}
            {msg.isGenerating
              ? <img src="assets/shutter1.gif" style={{width:28,height:28,objectFit:'contain',verticalAlign:'middle',opacity:0.8}} alt="" />
              : msg.text}
          </div>
        ))}
        {isTyping && (
          <div className="fy-chat-msg-fy">
            <div className="fy-chat-msg-label">FUTUREYOU</div>
            <img src="assets/shutter1.gif" style={{width:24,height:24,objectFit:'contain',verticalAlign:'middle',opacity:0.7}} alt="" />
          </div>
        )}
        <div ref={messagesEndRef} />
      </div>
      <div className="fy-chat-phase-label">{QUESTIONS[qIndex].phase}</div>

      {/* openFirst questions: input first, chips below as anchors */}
      {QUESTIONS[qIndex].openFirst ? (
        <>
          <div className="fy-chat-input-row">
            <textarea ref={inputRef} className="fy-chat-input" value={input}
              onChange={e => setInput(e.target.value)} onKeyDown={handleKeyDown}
              placeholder={isGenerating ? 'FutureYou is processing your briefing...' : QUESTIONS[qIndex].placeholder}
              disabled={isTyping || isGenerating} rows={1} />
            <button className="fy-chat-send" onClick={() => input.trim() && submitAnswer(input)} disabled={isTyping || isGenerating || !input.trim()}>→</button>
          </div>
          {QUESTIONS[qIndex].chips && QUESTIONS[qIndex].chips.length > 0 && !isTyping && !isGenerating && (
            <>
              {QUESTIONS[qIndex].fyInvite && (
                <div className="fy-invite-line">{QUESTIONS[qIndex].fyInvite}</div>
              )}
              <div className="fy-chat-chips">
                {QUESTIONS[qIndex].chips.map(chip => {
                  const isSelected = selectedChips.includes(chip);
                  return (
                    <button key={chip} className={`fy-chip ${isSelected ? 'active' : ''}`}
                      onClick={() => {
                        setSelectedChips(prev => {
                          const next = prev.includes(chip)
                            ? prev.filter(c => c !== chip)
                            : [...prev, chip];
                          setInput(next.join(', '));
                          return next;
                        });
                        inputRef.current?.focus();
                      }}>
                      {chip}
                    </button>
                  );
                })}
              </div>
            </>
          )}
        </>
      ) : (
        <>
          {/* Standard questions: chips first, input below */}
          {QUESTIONS[qIndex].chips && QUESTIONS[qIndex].chips.length > 0 && !isTyping && !isGenerating && (
            <div className="fy-chat-chips">
              {QUESTIONS[qIndex].chips.map(chip => {
                const q = QUESTIONS[qIndex];
                const isSelected = selectedChips.includes(chip);

                if (q.multiSelect) {
                  return (
                    <button key={chip} className={`fy-chip ${isSelected ? 'active' : ''}`}
                      onClick={() => {
                        setSelectedChips(prev => {
                          const next = prev.includes(chip)
                            ? prev.filter(c => c !== chip)
                            : [...prev, chip];
                          setInput(next.join(', '));
                          return next;
                        });
                        inputRef.current?.focus();
                      }}>
                      {chip}
                    </button>
                  );
                }

                // populateOnly: single chip sets input, doesn't submit — user adds context then sends
                if (q.populateOnly) {
                  return (
                    <button key={chip} className={`fy-chip ${isSelected ? 'active' : ''}`}
                      onClick={() => {
                        setSelectedChips([chip]);
                        setInput(chip);
                        inputRef.current?.focus();
                      }}>
                      {chip}
                    </button>
                  );
                }

                if (q.autoSubmitOnThird) {
                  return (
                    <button key={chip} className={`fy-chip ${isSelected ? 'active' : ''}`}
                      onClick={() => {
                        if (isSelected) return;
                        const newCount = q12Count + 1;
                        setQ12Count(newCount);
                        setSelectedChips(prev => [...prev, chip]);
                        const newInput = input ? input + ', ' + chip : chip;
                        if (newCount >= 3) {
                          submitAnswer(newInput);
                        } else {
                          setInput(newInput);
                          inputRef.current?.focus();
                        }
                      }}>
                      {chip}
                    </button>
                  );
                }

                return (
                  <button key={chip} className="fy-chip"
                    onClick={() => submitAnswer(chip)}>
                    {chip}
                  </button>
                );
              })}
            </div>
          )}
          {QUESTIONS[qIndex].fyInvite && !isTyping && !isGenerating && (
            <div className="fy-invite-line">{QUESTIONS[qIndex].fyInvite}</div>
          )}
          <div className="fy-chat-input-row">
            <textarea ref={inputRef} className="fy-chat-input" value={input}
              onChange={e => setInput(e.target.value)} onKeyDown={handleKeyDown}
              placeholder={isGenerating ? 'FutureYou is processing your briefing...' : QUESTIONS[qIndex].placeholder}
              disabled={isTyping || isGenerating} rows={1} />
            <button className="fy-chat-send" onClick={() => input.trim() && submitAnswer(input)} disabled={isTyping || isGenerating || !input.trim()}>→</button>
          </div>
        </>
      )}
    </div>
  );
}

// Summary + Email on same screen
function SummaryAndEmail({ summaryText, briefingData, answers, onComplete }) {
  const [displayed, setDisplayed] = useState('');
  const [summaryDone, setSummaryDone] = useState(false);
  const [firstName, setFirstName] = useState('');
  const [lastName, setLastName] = useState('');
  const [email, setEmail] = useState('');
  const [status, setStatus] = useState('idle');
  const [error, setError] = useState('');

  useEffect(() => {
    if (!summaryText) return;
    let i = 0;
    const iv = setInterval(() => {
      setDisplayed(summaryText.slice(0, i)); i++;
      if (i > summaryText.length) { clearInterval(iv); setSummaryDone(true); }
    }, 20);
    return () => clearInterval(iv);
  }, [summaryText]);

  async function handleSubmit() {
    if (!email.trim()) { setError('Email is required.'); return; }
    setStatus('loading'); setError('');
    try {
      const payload = {
        first_name: firstName.trim() || '',
        last_name: lastName.trim() || '',
        email: email.trim(),
        studio_name: localStorage.getItem('sy_studio_name') || '',
        formation: { briefing: briefingData || {}, answers: answers || [] }
      };
      const res = await fetch(`${API_URL}/api/formation/verify`, {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      localStorage.setItem('sy_email', email.trim());
      localStorage.setItem('sy_first_name', firstName.trim());
      localStorage.setItem('sy_last_name', lastName.trim());
      if (data.first_words) localStorage.setItem('sy_first_words', data.first_words);
      if (data.archetype)   localStorage.setItem('sy_archetype', data.archetype);
      if (data.phase)       localStorage.setItem('sy_phase', data.phase);
      if (!res.ok) { setError(data.error || 'Something went sideways. Try again.'); setStatus('idle'); return; }
      // Send magic link — user must click it to reach studio naming
      await fetch(`${API_URL}/api/auth/magic-link`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.trim() })
      }).catch(() => {}); // non-blocking — formation already saved
      setStatus('sent');
      setTimeout(() => onComplete(), 3000);
    } catch { setError('Connection error. Try again.'); setStatus('idle'); }
  }

  if (status === 'sent') {
    return (
      <div className="screen fade-up" style={{position:'relative',zIndex:10}}>
        <div style={{textAlign:'center',maxWidth:'640px',margin:'0 auto',padding:'0 24px'}}>
          <div style={{fontSize:'9px',letterSpacing:'0.3em',textTransform:'uppercase',color:'var(--cyan)',opacity:0.6,marginBottom:'32px'}}>BRIEFING SAVED</div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'clamp(52px,8vw,96px)',lineHeight:0.95,marginBottom:'40px',letterSpacing:'0.02em'}}>
            Your Briefing<br/>Is Saved.
          </div>
          <div style={{fontFamily:"'Playfair Display',serif",fontStyle:'italic',fontSize:'clamp(20px,2.5vw,26px)',color:'var(--cyan)',lineHeight:1.7,marginBottom:'32px'}}>
            Your briefing is complete.<br/>FutureYou is ready to meet TodayYou.
          </div>
          <div style={{fontSize:'12px',letterSpacing:'0.16em',textTransform:'uppercase',color:'var(--mute)',opacity:0.5,marginBottom:'40px'}}>We emailed you a link to return from any device.</div>
          <div className="confirm-progress-wrap" style={{marginTop:24}}>
            <div className="confirm-progress-fill" style={{animation:'drain 3s linear forwards'}}/>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="screen summary-email-screen">
      <div className="summary-email-wrap">
        <div className="summary-label">BRIEFING COMPLETE</div>
        <div className="summary-text">
          {displayed}
          {!summaryDone && <img src="assets/shutter1.gif" style={{width:18,height:18,objectFit:'contain',verticalAlign:'middle',marginLeft:4,opacity:0.7}} alt="" />}
        </div>

        {summaryDone && (
          <div className="fade-up">
            <div className="summary-divider"></div>
            <div style={{display:'flex',justifyContent:'center',marginBottom:12}}>
              <img src="assets/id-card-key.gif" style={{width:64,height:64,objectFit:'contain'}} alt=""/>
            </div>
            <div className="email-capture-label">SAVE YOUR PROGRESS — ENTER YOUR DETAILS</div>
            <div className="email-capture-title">Save Your Briefing.</div>
            <div className="email-capture-body">Your briefing is complete. Enter your details and we'll send a magic link so you can return from any device. Your first words from FutureYou are waiting on the other side.</div>
            <div className="es-fields">
              <div className="es-name-row">
                <input className="es-input" type="text" placeholder="First name" value={firstName} onChange={e => setFirstName(e.target.value)} />
                <input className="es-input" type="text" placeholder="Last name" value={lastName} onChange={e => setLastName(e.target.value)} />
              </div>
              <input className="es-input" type="email" placeholder="your@email.com" value={email}
                onChange={e => { setEmail(e.target.value); setError(''); }}
                onKeyDown={e => e.key === 'Enter' && handleSubmit()} />
            </div>
            <div className="es-note">No password. One click and you're back anytime.</div>
            {error && <div className="es-error">{error}</div>}
            <div className="q-actions">
              <button className="syb syb-primary" onClick={handleSubmit} disabled={status === 'loading'} style={{fontSize:'15px',padding:'14px 32px'}}>
                {status === 'loading'
                  ? <img src="assets/shutter1.gif" style={{width:24,height:24,objectFit:'contain',verticalAlign:'middle'}} alt="" />
                  : 'Save Your Information →'}
              </button>
            </div>
            <div className="es-privacy">StudioYou does not share or sell your information. Ever. Your data is yours and yours alone.</div>
          </div>
        )}
      </div>
    </div>
  );
}

// CINEMATIC BACKGROUND
const BG_MAP = {
  home:          'assets/STUDIOYOU_STUDIO_GATE_CLOSED.jpg',
  briefing:      'assets/SY_WATER_TOWER_MCU.jpg',
  preamble:      'assets/FY_EXT_V1.jpg',
  fy:            'assets/FY_TIMEMACHINE_V2.jpg',
  summary_email: 'assets/STUDIOYOU_STUDIO_GATE_OPEN.jpg',
  studio_name:   'assets/SY_DAY_LOTWS.jpg',
};

function CinematicBackground({ phase }) {
  const [layers, setLayers] = useState([
    { id: 0, src: BG_MAP['home'], active: true },
  ]);
  const [counter, setCounter] = useState(1);
  const prevPhase = useRef('home');

  useEffect(() => {
    const src = BG_MAP[phase];
    if (!src || phase === prevPhase.current) return;
    prevPhase.current = phase;

    const newId = counter;
    setCounter(c => c + 1);

    // Add new layer (inactive)
    setLayers(prev => [...prev, { id: newId, src, active: false }]);

    // Activate new layer after paint
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        setLayers(prev => prev.map(l => ({ ...l, active: l.id === newId })));
      });
    });

    // Remove old layers after transition completes
    setTimeout(() => {
      setLayers(prev => prev.filter(l => l.id === newId));
    }, 2200);
  }, [phase]);

  return (
    <div className="bg-cinema">
      {layers.map(l => (
        <div
          key={l.id}
          className={`bg-layer kb-${l.id % 4} ${l.active ? 'active' : ''}`}
          style={{ backgroundImage: `url('${l.src}')` }}
        />
      ))}
    </div>
  );
}

  const [showReturnModal, setShowReturnModal] = useState(false);
  const [showAbout, setShowAbout] = useState(false);
  const [briefingData, setBriefingData] = useState(null);
  const [chatAnswers, setChatAnswers] = useState([]);
  const [summaryText, setSummaryText] = useState('');
  const [studioName, setStudioName] = useState('');
  const [studioNameStatus, setStudioNameStatus] = useState('empty');
  const [studioConfirmed, setStudioConfirmed] = useState(false);
  const [signInEmail, setSignInEmail] = useState('');
  const [signInStatus, setSignInStatus] = useState('idle');
  const [signInError, setSignInError] = useState('');

  const savedBriefing = localStorage.getItem('sy_briefing');
  const isBuilding = ['summary_email','studio_name'].includes(phase);

  useEffect(() => {
    const label = isBuilding ? 'BUILDING YOUR STUDIO' : 'BUILD YOUR STUDIO NOW';
    requestAnimationFrame(() => runTopbarTypewriter(label));
  }, [phase]);

  // Dev backdoor — Ctrl+Shift+A -> admin.html (admin has its own password gate)
  useEffect(() => {
    function handleAdminShortcut(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'A') {
        window.location.href = '/admin.html';
      }
    }
    document.addEventListener('keydown', handleAdminShortcut);
    return () => document.removeEventListener('keydown', handleAdminShortcut);
  }, []);

  function goTo(nextPhase) {
    setScreenOut(true);
    setTimeout(() => { setPhase(nextPhase); setTimeout(() => setScreenOut(false), 50); }, 420);
  }

  const progressMap = { home:0, briefing:10, preamble:20, fy:45, summary_email:72, studio_name:90 };
  const progress = progressMap[phase] || 0;

  async function handleSignIn() {
    if (!signInEmail.trim()) { setSignInError('Enter your email.'); return; }
    setSignInStatus('loading'); setSignInError('');
    try {
      const res = await fetch(`${API_URL}/api/auth/magic-link`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email:signInEmail.trim() }) });
      if (res.ok) setSignInStatus('sent');
      else { setSignInStatus('error'); setSignInError('Email not found. Have you completed your briefing?'); }
    } catch { setSignInStatus('error'); setSignInError('Connection error. Try again.'); }
  }

  return (
    <>
      {showIntro && <IntroOverlay onDone={() => setShowIntro(false)} />}

      <CinematicBackground phase={phase} />

      <div className="topbar">
        <LogoMenu phase={phase} goTo={goTo} onShowReturn={() => setShowReturnModal(true)} onShowAbout={() => setShowAbout(true)} />
        <div className="topbar-label"></div>
      </div>

      {phase !== 'home' && (
        <div className="progress-track">
          <div className="progress-fill" style={{ width:`${progress}%` }}></div>
        </div>
      )}

      <FYStatusPanel phase={phase} />
      {showReturnModal && <ReturnModal onClose={() => setShowReturnModal(false)} />}
      {showAbout && <AboutModal onClose={() => setShowAbout(false)} />}

      {/* HOME */}
      {phase === 'home' && (
        <div className={`screen lp-screen ${screenOut ? 'out' : ''}`}>
          <div className="lp-wrap">
            <div className="lp-eyebrow">STUDIOYOU | CREATOR PLATFORM</div>
            <div className="lp-headline">
              <span className="grad">THE DISTANCE BETWEEN<br/>'I HAVE AN IDEA'<br/>AND 'I MADE THIS'</span><br/>
              <span>IS NOW ZERO.</span>
            </div>
            <div className="lp-subhead">
              <span>No gatekeepers. No permission.</span>
              <span>They give you a tool — We give you the entire studio.</span>
            </div>
            <div className="lp-ctas">
              <button className="syb syb-grad btn-begin" onClick={() => goTo('briefing')} style={{fontSize:'18px',padding:'18px 52px'}}>LET'S DO THIS!</button>
              <button className="lp-signin-link" onClick={() => setShowReturnModal(true)}>Already have a studio? Sign in →</button>
            </div>
            {savedBriefing && (
              <div className="resume-banner">
                <div className="resume-text">You started your briefing. Pick up where you left off.</div>
                <button className="syb syb-grad" onClick={() => goTo('fy')} style={{fontSize:'13px',padding:'9px 20px'}}>Resume</button>
              </div>
            )}
            <div className="lp-pillars">
              <div className="lp-pillar">
                <div className="lp-pillar-icon">🏗</div>
                <div className="lp-pillar-title">THE STUDIO</div>
                <div className="lp-pillar-accent">No token anxiety. No platforms. No learning curve. No multiple subscriptions. Just YOU and building.</div>
                <div className="lp-pillar-body">Twelve active buildings covering every stage from brain to screen. A sovereign environment to build your empire without asking the 1% for a key.</div>
              </div>
              <div className="lp-pillar">
                <div className="lp-pillar-icon">⚡</div>
                <div className="lp-pillar-title">FUTUREYOU</div>
                <div className="lp-pillar-body">Imagine meeting yourself after you've already built it. Made the deals, learned the hard lessons, created the work. FutureYou is that version — traveling back to guide TodayYou through every decision, every building, every next move. Not a chatbot. Not a tool. The only advisor who already knows exactly where you're capable of going, because it's made entirely from you.</div>
              </div>
              <div className="lp-pillar">
                <div className="lp-pillar-icon">💬</div>
                <div className="lp-pillar-title">THE BRIEFING</div>
                <div className="lp-pillar-body">Before FutureYou can guide you, it needs to know you. Three screens map your arsenal, your roadblock, and your creator type. Then twelve questions — your history, your wins, how you think, where you're going, and what you want to be known for. No answer is wrong. At the end, your studio is calibrated to you specifically. Not a creator like you. You.</div>
              </div>
            </div>
            <div className="lp-who">
              <div className="lp-who-label">BUILT FOR</div>
              <div className="lp-who-tags">
                {['Filmmakers','YouTubers','Musicians','Podcasters','Writers','Photographers','Animators','Streamers','Creators'].map(t => <span key={t} className="lp-who-tag">{t}</span>)}
              </div>
            </div>
            <div className="lp-signin-section">
              <div className="lp-signin-label">Already have a studio?</div>
              <div className="lp-signin-note">We'll send a sign-in link to your email.</div>
              {signInStatus === 'sent' ? (
                <div className="signin-sent">Check your email — your studio link is on its way.</div>
              ) : (
                <>
                  <div className="signin-row">
                    <input className="signin-input" type="email" placeholder="your@email.com" value={signInEmail}
                      onChange={e => { setSignInEmail(e.target.value); setSignInStatus('idle'); setSignInError(''); }}
                      onKeyDown={e => e.key === 'Enter' && handleSignIn()} />
                    <button className="syb syb-primary" onClick={handleSignIn} disabled={signInStatus === 'loading'} style={{fontSize:'14px',padding:'13px 22px'}}>
                      {signInStatus === 'loading' ? <img src="assets/shutter1.gif" style={{width:32,height:32,objectFit:'contain',verticalAlign:'middle'}} alt="" /> : 'Return to Studio →'}
                    </button>
                  </div>
                  {signInError && <div className="signin-error">{signInError}</div>}
                </>
              )}
            </div>
          </div>
        </div>
      )}

      {/* BRIEFING PILLS */}
      {phase === 'briefing' && (
        <div className={`screen ${screenOut ? 'out' : ''}`}>
          <BriefingPills onComplete={selections => {
            setBriefingData(selections);
            localStorage.setItem('sy_briefing', JSON.stringify(selections));
            goTo('preamble');
          }} />
        </div>
      )}

      {/* PREAMBLE */}
      {phase === 'preamble' && (
        <div className={`screen ${screenOut ? 'out' : ''}`}>
          <Preamble onBegin={() => goTo('fy')} />
        </div>
      )}

      {/* FY 12Q CHAT */}
      {phase === 'fy' && (
        <div className={`screen ${screenOut ? 'out' : ''}`}>
          <FYFormationChat
            briefingData={briefingData || JSON.parse(localStorage.getItem('sy_briefing') || 'null')}
            onComplete={({ answers, briefingData, summaryText }) => {
              setChatAnswers(answers);
              localStorage.setItem('sy_formation', JSON.stringify(answers));
              setSummaryText(summaryText);
              goTo('summary_email');
            }}
          />
        </div>
      )}

      {/* SUMMARY + EMAIL */}
      {phase === 'summary_email' && (
        <SummaryAndEmail
          summaryText={summaryText}
          briefingData={briefingData}
          answers={chatAnswers}
          onComplete={() => goTo('studio_name')}
        />
      )}

      {/* STUDIO NAME */}
      {phase === 'studio_name' && !studioConfirmed && (
        <div className={`screen ${screenOut ? 'out' : ''}`}>
          <div className="q-wrap fade-up">
            <div className="q-phase">YOUR FIRST ACT</div>
            <div className="q-text">Name Your Studio.</div>
            <div className="q-subtext">Your name, your production company, your brand — whatever this is. FutureYou can help you find it, or name it now and refine it later.</div>
            <StudioNameInput value={studioName} onChange={setStudioName} onStatusChange={setStudioNameStatus} />
            <div className="q-actions" style={{marginTop:'28px'}}>
              <button className="syb syb-primary"
                style={{fontSize:'15px',padding:'14px 32px'}}
                onClick={async () => {
                  const name = studioName.trim();
                  if (name) localStorage.setItem('sy_studio_name', name);
                  localStorage.setItem('sy_fresh_formation', 'true');
                  // Persist studio name to backend so magic link returns correctly
                  const email = localStorage.getItem('sy_email');
                  if (email) {
                    await fetch(`${API_URL}/api/update-studio`, {
                      method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ email, studio_name: name || 'Your Studio' })
                    }).catch(() => {});
                  }
                  setStudioConfirmed(true);
                  setTimeout(() => { window.location.href = '/dashboard.html'; }, 1900);
                }}
                disabled={studioName.trim().length > 0 && studioNameStatus === 'taken'}>
                {studioName.trim() ? 'Build My Studio →' : 'Name It Later →'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* STUDIO NAME CONFIRMED — velvet rope moment */}
      {phase === 'studio_name' && studioConfirmed && (
        <div className="screen fade-up" style={{position:'relative',zIndex:10}}>
          <div style={{textAlign:'center',maxWidth:'560px',margin:'0 auto',padding:'0 24px',display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
            <img src="assets/award-ceremony.gif" style={{width:88,height:88,objectFit:'contain'}} alt="" />
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'clamp(44px,6vw,72px)',lineHeight:1,letterSpacing:'0.03em'}}>
              {studioName.trim()
                ? <><span style={{background:'linear-gradient(135deg,#00c8ff,#a06be8)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>{studioName.trim().toUpperCase()}</span><br/><span style={{color:'#f0f2ff',fontSize:'0.55em',letterSpacing:'0.08em'}}>IS ON THE GATE.</span></>
                : <span style={{color:'#f0f2ff'}}>YOUR STUDIO<br/><span style={{background:'linear-gradient(135deg,#00c8ff,#a06be8)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>IS OPEN.</span></span>
              }
            </div>
            <div style={{fontFamily:"'Playfair Display',serif",fontStyle:'italic',fontSize:16,color:'rgba(240,242,255,0.55)',lineHeight:1.7}}>FutureYou is waiting on the other side.</div>
          </div>
        </div>
      )}

      <div className={`phase-label ${['home','summary_email','studio_name'].includes(phase) ? 'hidden' : ''}`}>
        {phase === 'briefing' && 'Calibrating your command center'}
        {phase === 'preamble' && 'FutureYou is waiting'}
        {phase === 'fy' && 'Your studio is taking shape'}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script src="assets/sy-3d.js" defer></script>

</body>
