  const [pendingTaskContext, setPendingTaskContext] = useState(null); // task waiting for user input before confirm
  const bodyRef = useRef(null);
  const inputRef = useRef(null);
  const lcRef = useRef(null);
  const roomRef = useRef(null);
  const pendingTaskContextRef = useRef(null);
  const lastSendHiddenRef = useRef(false); // true when the last user msg sent was a hidden system prompt
  const anyReplyRef = useRef(false); // true once any fy_reply has arrived over the data channel
  const initDoneRef = useRef(false);
  const msgsRef = useRef([]);
  const remoteAudioElsRef = useRef([]); // hidden <audio> els from LiveKit attach — muted in sync with avatar toggle
  const [lkConnected, setLkConnected] = useState(false);
  const [remoteVideoTrack, setRemoteVideoTrack] = useState(null);
  const isIndependent = tier !== 'operator';
  const email = localStorage.getItem('sy_email') || '';

  // Keep ref in sync so DataReceived handler sees current value
  useEffect(() => { pendingTaskContextRef.current = pendingTaskContext; }, [pendingTaskContext]);
  useEffect(() => { initDoneRef.current = initDone; }, [initDone]);
  useEffect(() => { msgsRef.current = msgs; }, [msgs]);

  // Avatar toggle previously only hid the <video> element — remote audio kept
  // playing regardless, AND the agent kept running Cartesia TTS + Runway
  // avatar rendering every turn no matter what, burning Runway credits
  // (billed per 6s of active avatar-session time, not per utterance — muting
  // playback client-side does nothing to stop that). Mirror the toggle onto
  // attached audio elements for immediate local silence, AND publish it to
  // the agent on 'fy_avatar_control' so it can close/reopen the actual
  // Runway avatar session — that's what stops the billing.
  useEffect(() => {
    const applyMute = (on) => {
      remoteAudioElsRef.current.forEach(el => { el.muted = !on; });
      if (roomRef.current && lkConnected) {
        try {
          const payload = new TextEncoder().encode(JSON.stringify({ type: 'fy_avatar_control', on }));
          roomRef.current.localParticipant.publishData(payload, { topic: 'fy_avatar_control', reliable: true });
        } catch (e) {
          console.warn('[Studio FY] avatar control publish failed:', e);
        }
      }
    };
    applyMute(_fyVideoState.on);
    return _fyVideoSubscribe(applyMute);
  }, [lkConnected]);

  React.useImperativeHandle(ref, () => ({
    addMonologue(text) {
      setMsgs(prev => [...prev, { role:'agent', text }]);
    },
    triggerTask(task, building, sectionIdx, taskIdx) {
      const toolMeta = TOOL_REGISTRY[task.title];
      // Always open with a conversation — gather context before offering to build
      // Store pending task so user response can trigger confirm
      const prompt = toolMeta
        ? [
            `[TASK ACTIVATED: "${task.title}"]`,
            `Creator tapped BEGIN on: "${task.level1}" in ${building.title}.`,
            `You will use ${toolMeta.name} to generate this — but first you need the creator's specific direction.`,
            `Check the conversation history first — if the premise, logline, or core idea is already established, do not ask for it again, reference it directly.`,
            `Ask ONE focused question to understand what they have in mind. Make it specific to their archetype and formation. Do NOT mention the tool yet. Do NOT offer to build yet. Under 50 words.`,
          ].join(' ')
        : [
            `[TASK ACTIVATED: "${task.title}"]`,
            `Creator tapped BEGIN: "${task.level1}" in ${building.title}.`,
            `Check the conversation history first — if the premise, logline, or core idea is already established, do not ask for it again, reference it directly.`,
            `Respond as FutureYou — warm, one specific opening question, meet them where they are. Under 60 words.`,
          ].join(' ');
      // Store task context for when user replies — confirm fires after first user response (tool steps only)
      if (toolMeta) {
        setPendingTaskContext({ task, building, sectionIdx, taskIdx, tool: toolMeta });
      } else {
        setPendingTaskContext(null);
      }
      sendMsg(prompt, true);
    },
    setRecommendedSection(sectionName) {
      const prompt = [
        `[SECTION RECOMMENDED: "${sectionName}"]`,
        `You are FutureYou in ${bldg.title}. Direct the creator to start with the "${sectionName}" section.`,
        `One sentence, direct, warm. Tell them why this is the right first move. Under 40 words.`,
      ].join(' ');
      sendMsg(prompt, true);
    }
  }));

  function addMonologue(text) {
    setMsgs(prev => [...prev, { role:'agent', text }]);
  }

  function buildSystemPrompt() {
    const arch = localStorage.getItem('sy_archetype') || '';
    const ph   = localStorage.getItem('sy_phase') || '';
    const rec  = localStorage.getItem('sy_recommended_building') || '';
    const brandStory = localStorage.getItem('sy_brand_story') || '';
    const b = briefing ? (typeof briefing === 'string' ? JSON.parse(briefing) : briefing) : {};
    const f = formation ? (typeof formation === 'string' ? JSON.parse(formation) : formation) : [];
    function normPill(v) { if (!v) return ''; if (Array.isArray(v)) return v.join(', '); if (typeof v==='object') return Object.values(v).filter(Boolean).join(', '); return String(v); }
    const ctx = Array.isArray(f) ? f.map((a,i)=>`Q${i+1}: ${a||'(skipped)'}`).join('\n') : '';
    const modeNote = isIndependent
      ? 'DIRECTIVE MODE: You initiate. Always propose the next concrete action. Lead — do not wait to be asked.'
      : 'PEER MODE: The creator drives. You are available, sharp, never preachy. Respond when called upon.';
    const sections = BUILDING_TASKS[bldg.id] || [];
    const buildingMap = sections.length
      ? [
          `--- ${bldg.title} MAP ---`,
          sections.map((s, si) => [
            `Section ${si + 1}: ${s.section}`,
            ...s.tasks.map((t, ti) => `  ${si + 1}.${ti + 1} ${t.title}`),
          ].join('\n')).join('\n'),
          'This is the complete structure of this building. When you refer to any section or step by name, use the exact titles above — never invent or paraphrase one.',
        ].join('\n')
      : '';
    let stepBlock = '';
    if (activeStep) {
      const { si, ti, task } = activeStep;
      const section = sections[si];
      stepBlock = [
        '--- ACTIVE STEP ---',
        `Currently on Step ${si + 1}.${ti + 1}: ${task.title}`,
        task.level1 ? `Purpose: ${task.level1}` : '',
        task.level2 ? `Context: ${task.level2}` : '',
        'Stay anchored to the current step. Do not move the creator forward until it is complete.',
        'Before asking anything, check the conversation history above (including the dashboard triage summary) for whether this is already answered — the premise, logline, or core idea especially. If it is, reference it directly instead of asking again. Only ask what is genuinely still missing for this step.',
      ].filter(Boolean).join('\n');
    }
    return [
      `You are FutureYou — ${firstName||'this creator'}'s future self, back to guide the build. You already built the studio, made the mistakes, and know exactly what needs to happen next.`,
      '',
      `Studio: ${studioName||'(unnamed)'} | Archetype: ${arch} | Phase: ${ph}`,
      `Active building: ${bldg.title} (${bldg.tag}) — ${bldg.desc}`,
      `Your insight on this building: "${bldg.fyq}"`,
      `Arsenal: ${normPill(b.arsenal)} | Roadblock: ${normPill(b.roadblock)} | Creator Type: ${normPill(b.creator_type)}`,
      brandStory ? `Brand story: ${brandStory}` : '',
      rec ? `Recommended building: ${rec}` : '',
      ctx ? `Formation Q&A:\n${ctx}` : '',
      buildingMap,
      stepBlock,
      '',
      modeNote,
      '',
      'VOICE: Sovereign. Anti-gatekeeper. You do not hedge. You are not a therapist — you are a strategist who already won. Speak in short sentences, directly. No bullet points. No lists.',
      '',
      'RULES:',
      '- Never start a response with "I". Start with the insight.',
      '- Under 40 words unless the creator explicitly asks for depth.',
      '- End with a question or a directive — never a summary.',
      '- Never say "great question", "absolutely", "certainly", "amazing", "that\'s solid".',
      '- Never evaluate their creative output. Use additive language only: "let\'s build on this" / "let this breathe".',
      '- Never perform enthusiasm. Act. "Got it. Here\'s the move."',
      '- The creator wandering into another building is not a tangent — it is a piece of the active project. Connect it, do not redirect.',
      '- If three exchanges pass with no clear direction, synthesize once: state the move, get a yes/no, then proceed.',
      '- The only thing that breaks the active thread is the creator saying they want something else.',
    ].filter(Boolean).join('\n');
  }

  // Direct TTS via session.say() on the agent side, same fy_say_verbatim
  // convention as dashboard.html — bypasses the LLM turn entirely so the line
  // is guaranteed spoken exactly as written. No-op when the room isn't live.
  function speakLine(line) {
    if (!roomRef.current || roomRef.current.state !== 'connected') return;
    try {
      const p = new TextEncoder().encode(JSON.stringify({ type: 'fy_say_verbatim', text: line }));
      roomRef.current.localParticipant.publishData(p, { topic: 'fy_chat', reliable: true });
    } catch (e) {}
  }

  async function connectLiveKit(onReady) {
    if (roomRef.current) { if (onReady) onReady(); return; }
    try {
      // Reuse existing dashboard LiveKit session if valid (same room, agent already warm)
      const existingToken = localStorage.getItem('sy_lk_token');
      const existingTs = localStorage.getItem('sy_lk_ts');
      const existingUrl = localStorage.getItem('sy_lk_url');
      const tokenValid = existingToken && existingTs && (Date.now() - parseInt(existingTs) < 50 * 60 * 1000);

      let token, livekit_url;
      if (tokenValid) {
        token = existingToken;
        livekit_url = existingUrl;
        console.log('[Studio FY] Reusing dashboard LiveKit session');
      } else {
        const convHistory = JSON.parse(localStorage.getItem('sy_fy_conversation') || '[]');
        const res = await fetch(API_URL + '/api/avatar/livekit-session', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, conversation_thread: convHistory.slice(-10), surface: 'studio' })
        });
        const data = await res.json();
        if (!data.token || !data.livekit_url) throw new Error('no token');
        token = data.token;
        livekit_url = data.livekit_url;
      }
      const LC = lcRef.current;
      const room = new LC.Room();
      room.on(LC.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
        if (topic !== 'fy_directive') return;
        try {
          const msg = JSON.parse(new TextDecoder().decode(payload));
          if (msg.type === 'fy_vault_capture') {
            const projectId = localStorage.getItem('sy_active_project_id');
            const capturedAt = new Date().toISOString();
            // Recent thread for this step as context — last 8 messages is enough
            // to show the refinement path without carrying the whole session.
            const rawThread = msgsRef.current.slice(-8).map(m => ({
              role: m.role, content: m.text
            }));
            vaultAdd({
              name: msg.step_title,
              type: 'answer',
              section: msg.section_name,
              buildingId: msg.building_slug,
              lockedAt: new Date().toLocaleDateString(),
              text: msg.captured_answer,
            });
            // Surface this in Canvas Details so the creator can see FY's
            // activity, not just the chat reply — this event log was built
            // for image-gen tool calls only and never reflected capture or
            // routing decisions, which are FY's actual visible work in most
            // sessions so far.
            {
              const secTasks = BUILDING_TASKS[bldg.id] || [];
              const secIdx = secTasks.findIndex(s => s.section === msg.section_name);
              if (secIdx >= 0) {
                cdPushEvent(secIdx, {
                  id: 'capture-' + msg.building_slug + '-' + msg.section_name + '-' + msg.step_title,
                  tool: 'Vault',
                  desc: `Captured: ${msg.step_title}`,
                  step: `${msg.section_name} · ${msg.step_title}`,
                  status: 'done',
                });
              }
            }
            if (projectId) {
              fetch(`${API_URL}/api/vault/capture`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  project_id: projectId,
                  building_slug: msg.building_slug,
                  section_name: msg.section_name,
                  step_title: msg.step_title,
                  captured_answer: msg.captured_answer,
                  raw_thread: rawThread,
                })
              }).catch(() => {});
            }
            return;
          }
          if (msg.type === 'fy_section_recommendation' && msg.section_id) {
            if (onSectionRecommendation) onSectionRecommendation(msg.section_id);
            return;
          }
          if (msg.type === 'fy_generate_visual' && msg.task_title) {
            // Agent-triggered generation — mirrors the manual BEGIN-tap ->
            // triggerTask() -> BUILD IT button path, but fired directly from
            // the live conversation instead of requiring a UI tap first.
            // Without this case, generate_visual calls had nowhere to land:
            // the tool existed on the agent side with no listener here.
            const secTasks = BUILDING_TASKS[bldg.id] || [];
            let foundTask = null, foundSectionIdx = -1, foundTaskIdx = -1;
            secTasks.forEach((sec, si) => {
              (sec.tasks || []).forEach((t, ti) => {
                if (t.title === msg.task_title) { foundTask = t; foundSectionIdx = si; foundTaskIdx = ti; }
              });
            });
            const tool = TOOL_REGISTRY[msg.task_title];
            if (foundTask && tool) {
              runGeneration(foundTask, bldg, foundSectionIdx, foundTaskIdx, tool, msg.visual_prompt || null);
            } else {
              console.warn('[Studio FY] generate_visual: no matching task/tool for', msg.task_title);
            }
            return;
          }
          if (msg.type !== 'fy_reply') return;
          anyReplyRef.current = true;
          const text = msg.text;
          setMsgs(prev => {
            const updated = [...prev, { role:'fy', text }];
            localStorage.setItem('sy_fy_conversation', JSON.stringify(updated));
            return updated;
          });
          setLoading(false);
          if (onDirective) onDirective(text);
          if (bodyRef.current) setTimeout(() => { if(bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, 50);
          // Fire confirm flow only if this reply answers a VISIBLE user message —
          // never on replies to hidden activation prompts (creator hasn't answered yet).
          // Mirrors the !hidden guard already present on the REST path.
          const ptc = pendingTaskContextRef.current;
          if (ptc && ptc.tool && !lastSendHiddenRef.current) {
            const { task, building, sectionIdx, taskIdx, tool } = ptc;
            const confirmDesc = `I have what I need. Ready to build your ${task.title.toLowerCase()} with ${tool.name}?`;
            setPendingTaskContext(null);
            setPendingConfirm({ task, building, sectionIdx, taskIdx, tool, confirmDesc });
            addMonologue(`Preparing ${tool.name} — ${tool.desc}`);
          }
        } catch(e) {}
      });

      // Activation gate — two conditions, in order of strictness:
      //   agent joined + video attached  → fire immediately (clean speech + render)
      //   agent joined, no video in 6s   → fire anyway (replies + TTS work; video
      //                                    attaches whenever Runway finishes booting)
      //   25s absolute                   → fire regardless; initFY's REST watchdog
      //                                    keeps chat alive even with no agent.
      // Never activate into an agentless room before the absolute timeout — a
      // published opening prompt with no agent listening never gets a reply and
      // permanently locks the panel in loading.
      let fired = false;
      let agentJoined = false;
      let videoSeen = false;
      let agentVideoGrace = null;
      const absoluteTimeout = setTimeout(() => {
        if (!fired) {
          fired = true;
          console.warn('[Studio FY] Activation timeout — agent never joined, REST watchdog will cover');
          if (onReady) onReady();
        }
      }, 25000);
      const fireReady = () => {
        if (fired) return;
        fired = true;
        clearTimeout(absoluteTimeout);
        if (agentVideoGrace) clearTimeout(agentVideoGrace);
        setTimeout(() => { if (onReady) onReady(); }, 600);
      };
      const maybeFire = () => {
        if (fired) return;
        if (agentJoined && videoSeen) { fireReady(); return; }
        if (agentJoined && !agentVideoGrace) {
          agentVideoGrace = setTimeout(() => {
            console.warn('[Studio FY] Agent joined, video slow — activating without render');
            fireReady();
          }, 6000);
        }
      };
      room.on(LC.RoomEvent.ParticipantConnected, () => { agentJoined = true; maybeFire(); });
      room.on(LC.RoomEvent.Disconnected, () => { roomRef.current = null; setLkConnected(false); });
      room.on(LC.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === 'video') { setRemoteVideoTrack(track); videoSeen = true; maybeFire(); }
        if (track.kind === 'audio') {
          const audioEl = track.attach();
          audioEl.style.display = 'none';
          audioEl.muted = !_fyVideoState.on;
          remoteAudioElsRef.current.push(audioEl);
          document.body.appendChild(audioEl);
        }
      });
      room.on(LC.RoomEvent.TrackUnsubscribed, (track) => {
        if (track.kind === 'video') setRemoteVideoTrack(null);
        if (track.kind === 'audio') {
          const removed = track.detach();
          removed.forEach(el => el.remove());
          remoteAudioElsRef.current = remoteAudioElsRef.current.filter(el => !removed.includes(el));
        }
      });
      // Browser autoplay policy: studio loads via navigation, so no user gesture has
      // occurred on this page yet — audio playback may be blocked until first click.
      room.on(LC.RoomEvent.AudioPlaybackStatusChanged, () => {
        if (!room.canPlaybackAudio) {
          const resume = () => { room.startAudio().catch(()=>{}); document.removeEventListener('click', resume); };
          document.addEventListener('click', resume);
        }
      });

      await room.connect(livekit_url, token);
      await room.localParticipant.setMicrophoneEnabled(false);
      roomRef.current = room;
      setLkConnected(true);

      // Warm-room path: agent and avatar worker may already be present — feed
      // the gate so a fully-warm room activates immediately.
      if (room.remoteParticipants.size > 0) { agentJoined = true; }
      room.remoteParticipants.forEach((participant) => {
        participant.trackPublications.forEach((pub) => {
          if (pub.track && pub.track.kind === 'video') {
            setRemoteVideoTrack(pub.track);
            videoSeen = true;
          }
          if (pub.track && pub.track.kind === 'audio') {
            const audioEl = pub.track.attach();
            audioEl.style.display = 'none';
            audioEl.muted = !_fyVideoState.on;
            remoteAudioElsRef.current.push(audioEl);
            document.body.appendChild(audioEl);
          }
        });
      });
      maybeFire();

    } catch(e) {
      console.warn('[Studio FY] LiveKit connect failed, REST fallback active:', e);
      if (onReady) onReady();
    }
  }

  // Load LC on mount, connect, fire initFY when agent joins
  useEffect(() => {
    async function loadAndConnect() {
      const prevConv = localStorage.getItem('sy_fy_conversation');
      if (prevConv) {
        try {
          const hist = JSON.parse(prevConv).filter(m => !m.hidden).slice(-20);
          if (hist.length) setMsgs(hist);
        } catch(e) {}
      }
      if (!window.LivekitClient) {
        await new Promise(resolve => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/livekit-client@2.9.9/dist/livekit-client.umd.min.js';
          s.onload = resolve;
          document.head.appendChild(s);
        });
      }
      lcRef.current = window.LivekitClient;
      await connectLiveKit(() => {
        const line = ARRIVAL_LINES[bldg.id];
        if (line && !hasVisitedBuilding(bldg.id)) {
          setMsgs(prev => [...prev, { role: 'fy', text: line }]);
          speakLine(line);
          markBuildingVisited(bldg.id);
        }
        initFY();
      });
    }
    loadAndConnect();
    return () => { if (roomRef.current) { roomRef.current.disconnect(); roomRef.current = null; } };
  }, []);

  async function sendViaRest(newMsgs, hidden) {
    try {
      const res = await fetch(API_URL + '/api/chat', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          context: 'fy_chat',
          email: email,
          building_id: bldg.id,
          mode: isIndependent ? 'independent' : 'peer',
          messages: newMsgs.map(m => ({ role: m.role==='user' ? 'user' : 'assistant', content: m.text }))
        })
      });
      const data = await res.json();
      const reply = data.message || (data.content&&data.content[0]&&data.content[0].text) || 'Something went wrong.';
      setMsgs(prev => {
        const updated = [...prev, { role:'fy', text:reply }];
        localStorage.setItem('sy_fy_conversation', JSON.stringify(updated));
        return updated;
      });
      if (onDirective) onDirective(reply);
      if (!hidden && pendingTaskContextRef.current && pendingTaskContextRef.current.tool) {
        const { task, building, sectionIdx, taskIdx, tool } = pendingTaskContextRef.current;
        const confirmDesc = `I have what I need. Ready to build your ${task.title.toLowerCase()} with ${tool.name}?`;
        setPendingTaskContext(null);
        setPendingConfirm({ task, building, sectionIdx, taskIdx, tool, confirmDesc });
        addMonologue(`Preparing ${tool.name} — ${tool.desc}`);
      }
    } catch(e) {
      setMsgs(prev => [...prev, { role:'fy', text:'Something went sideways. Try again.' }]);
    }
    setLoading(false);
    if (bodyRef.current) setTimeout(() => { if(bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, 50);
  }

  async function sendMsg(userText, hidden=false) {
    lastSendHiddenRef.current = hidden;
    const newMsgs = hidden
      ? [...msgs, { role:'user', text:userText, hidden:true }]
      : [...msgs, { role:'user', text:userText }];
    setMsgs(newMsgs);
    if (!hidden) localStorage.setItem('sy_fy_conversation', JSON.stringify(newMsgs));
    setLoading(true);
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;

    if (roomRef.current && lkConnected) {
      try {
        const payload = new TextEncoder().encode(JSON.stringify({ type: 'fy_chat', text: userText }));
        await roomRef.current.localParticipant.publishData(payload, { topic: 'fy_chat', reliable: true });
        // Reply arrives via DataReceived handler — sets loading false there
        return;
      } catch(e) {
        console.warn('[Studio FY] publishData failed, falling back to REST:', e);
      }
    }
    await sendViaRest(newMsgs, hidden);
  }

  async function initFY() {
    if (initDoneRef.current) return;
    setInitDone(true);
    initDoneRef.current = true;
    setLoading(true);

    // Build context-aware opening prompt
    const sections = (BUILDING_TASKS[bldg.id] || []).map(s => s.section);
    const sectionList = sections.join(', ');
    const recentHistory = msgs.filter(m => !m.hidden).slice(-6);
    const convSummary = recentHistory.length
      ? recentHistory.map(m => `${m.role === 'user' ? 'CREATOR' : 'FY'}: ${m.text}`).join('\n')
      : '';

    // Read nav destination written by dashboard pill, then clear
    const navSection = localStorage.getItem('sy_nav_section') || '';
    const navStep = localStorage.getItem('sy_nav_step') || '';
    if (navSection) localStorage.removeItem('sy_nav_section');
    if (navStep) localStorage.removeItem('sy_nav_step');

    const openingPrompt = [
      `You are FutureYou. Creator has arrived in ${bldg.title} (${bldg.tag}).`,
      `This is the creator's FIRST time inside a studio building — they have never seen this layout. Sections live in the SECTIONS list on the left rail; clicking a section reveals its numbered steps.`,
      navSection ? `They were routed here to section: "${navSection}"${navStep ? `, step: "${navStep}"` : ''} — that section is pulsing on the left rail right now.` : '',
      convSummary ? `Recent conversation:\n${convSummary}` : '',
      `Sections in ${bldg.title}: ${sectionList}.`,
      navSection
        ? `Open by walking them to the exact spot: tell them to select "${navSection}" on the left${navStep ? `, then choose the step "${navStep}"` : ''} — and that you'll work through it together. One sentence on why this is where their answer starts. Under 45 words. No preamble. End with the instruction to click it.`
        : `Direct them to the right section by name and tell them to select it on the left rail. If the conversation didn't point anywhere specific, pick the logical first section. Under 40 words. No preamble. End with the instruction to click it.`
    ].filter(Boolean).join('\n');

    if (roomRef.current) {
      try {
        lastSendHiddenRef.current = true; // opening prompt is a system message, not a creator answer
        anyReplyRef.current = false;
        const payload = new TextEncoder().encode(JSON.stringify({ type: 'fy_chat', text: openingPrompt }));
        await roomRef.current.localParticipant.publishData(payload, { topic: 'fy_chat', reliable: true });
        // Reply arrives via DataReceived — sets loading false, updates msgs.
        // Watchdog: a publish into a room where the agent isn't actually
        // listening never produces a reply — that permanently locks the panel
        // in loading. If nothing arrives in 12s, run the REST opening instead.
        setTimeout(() => {
          if (!anyReplyRef.current) {
            console.warn('[Studio FY] No agent reply to opening prompt in 12s — REST fallback');
            restInit(openingPrompt);
          }
        }, 12000);
        return;
      } catch(e) {
        console.warn('[Studio FY] initFY via LiveKit failed, falling back:', e);
      }
    }
    await restInit(openingPrompt);
  }

  async function restInit(openingPrompt) {
    try {
      const res = await fetch(API_URL + '/api/chat', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ context: 'fy_chat', email: email, building_id: bldg.id, mode: isIndependent ? 'independent' : 'peer', messages:[{ role:'user', content: openingPrompt }] })
      });
      const data = await res.json();
      const reply = data.message || (data.content&&data.content[0]&&data.content[0].text) || `You are in ${bldg.title}. Let's build.`;
      setMsgs(prev => [...prev, { role:'fy', text:reply }]);
      if (onDirective) onDirective(reply);
    } catch(e) {
      setMsgs(prev => [...prev, { role:'fy', text:`You are inside ${bldg.title}. ${bldg.fyq}` }]);
    }
    setLoading(false);
  }


  // Clear chat and reinit FY on every building switch (skip mount — loadAndConnect handles that)
  const isFirstRender = useRef(true);
  useEffect(() => {
    if (isFirstRender.current) { isFirstRender.current = false; return; }
    setMsgs([]);
    setInput('');
    setPendingConfirm(null);
    setPendingLock(null);
    setPendingTaskContext(null);
    pendingTaskContextRef.current = null;
    setInitDone(false);
    const line = ARRIVAL_LINES[bldg.id];
    if (line && !hasVisitedBuilding(bldg.id)) {
      setMsgs(prev => [...prev, { role: 'fy', text: line }]);
      speakLine(line);
      markBuildingVisited(bldg.id);
    }
    const t = setTimeout(() => initFY(), 80);
    return () => clearTimeout(t);
  }, [bldg.id]);
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [msgs, loading]);

  function handleKey(e) {
    if (e.key==='Enter' && !e.shiftKey) {
      e.preventDefault();
      const val = input.trim();
      if (val && !loading) { setInput(''); sendMsg(val); }
    }
  }

  function handleReset() {
    setMsgs([]); setInitDone(false);
    setPendingConfirm(null); setPendingLock(null); setPendingTaskContext(null);
    pendingTaskContextRef.current = null;
    // Disconnect and reconnect LiveKit so agent gets fresh context
    if (roomRef.current) {
      roomRef.current.disconnect();
      roomRef.current = null;
      setLkConnected(false);
    }
    setTimeout(async () => {
      await connectLiveKit(() => initFY());
    }, 200);
  }

  // Confirmation: user approved — fire model, push to Canvas Details
  // Synthesize the generation prompt from the actual conversation. Chain:
  // (1) FY brain distills the creator's stated visual via /api/chat,
  // (2) fallback: creator's own recent words verbatim,
  // (3) final fallback: null -> buildModelParams uses the static step template.
  async function buildConversationPrompt(taskTitle) {
    const visible = msgs.filter(m => !m.hidden);
    const conv = visible.slice(-12).map(m => (m.role === 'user' ? 'CREATOR: ' : 'FY: ') + m.text).join('\n');
    const creatorWords = visible.filter(m => m.role === 'user').slice(-4).map(m => m.text).join('. ');
    if (!conv) return null;
    try {
      const res = await fetch(API_URL + '/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          context: 'prompt_synth',
          messages: [{ role: 'user', content: 'Conversation:\n' + conv + '\n\nWrite ONE generation prompt, under 80 words, for the asset "' + taskTitle + '". Describe exactly the visual the creator stated — subject, setting, mood, lighting, style. Use only what the creator actually said; do not invent a different scene. Return only the prompt.' }]
        })
      });
      const data = await res.json();
      const p = ((data.message || (data.content && data.content[0] && data.content[0].text) || '') + '').trim();
      if (p && p.length > 15 && p.length < 900 && !/^(i |sorry|unable)/i.test(p)) return p;
    } catch (e) {}
    return creatorWords || null;
  }

  async function runGeneration(task, building, sectionIdx, taskIdx, tool, visualDesc) {
    const eventId = `${building.id}-${sectionIdx}-${taskIdx}`;

    window.dispatchEvent(new CustomEvent('sy:canvasGenerating', { detail: { eventId, taskTitle: task.title, tool: tool.name, cardType: tool.cardType || 'image' } }));

    cdPushEvent(sectionIdx, {
      id: eventId, tool: tool.name,
      desc: tool.desc,
      step: `STEP ${taskIdx+1} · ${task.title}`,
      status: 'running', tutorial: tool.tutorial,
    });

    addMonologue("Building now — watch the Canvas Details for progress.");

    // Animate progress bar via DOM
    let prog = 0;
    const progInterval = setInterval(() => {
      prog = Math.min(prog + Math.random()*15 + 8, 90);
      const el = document.getElementById(`cprog-${eventId}`);
      if (el) el.style.width = `${prog}%`;
    }, 450);

    const result = await invokeModel({
      task: tool.task || 'image_generate', building: building.id, tier,
      params: buildModelParams(tool.task || 'image_generate', task, visualDesc),
      email,
    });

    clearInterval(progInterval);
    const el = document.getElementById(`cprog-${eventId}`);
    if (el) el.style.width = '100%';

    if (result.success) {
      const outputUrl = result.output?.images?.[0]?.url || result.output?.video?.url || result.output?.url || null;
      cdPushEvent(sectionIdx, { id: eventId, tool: tool.name, desc: tool.desc, step: `STEP ${taskIdx+1} · ${task.title}`, status:'done', tutorial: tool.tutorial });
      // Push result to canvas via event
      const canvasEvent = new CustomEvent('sy:canvasOutput', { detail: { eventId, outputUrl, taskTitle: task.title, model: result.model, cardType: tool.cardType || 'image' } });
      window.dispatchEvent(canvasEvent);
      addMonologue(`Your ${task.title.toLowerCase()} is on the canvas.`);
      setTimeout(() => {
        setPendingLock({ assetName: task.title, assetType:'image', section:`Section ${sectionIdx+1}`, outputUrl });
        addMonologue("If you're satisfied with this result, save it to the Vault and we'll move on.");
      }, 800);
    } else {
      cdPushEvent(sectionIdx, { id: eventId, tool: tool.name, desc:'Something went wrong generating this asset.', step:`STEP ${taskIdx+1} · ${task.title}`, status:'error', tutorial: tool.tutorial });
      addMonologue("That didn\'t come through. Try again or let\'s adjust the direction.");
    }
  }

  async function handleConfirm() {
    if (!pendingConfirm) return;
    const { task, building, sectionIdx, taskIdx, tool } = pendingConfirm;
    setPendingConfirm(null);
    const visualDesc = await buildConversationPrompt(task.title);
    await runGeneration(task, building, sectionIdx, taskIdx, tool, visualDesc);
  }

  function handleConfirmCancel() {
    setPendingConfirm(null);
    addMonologue("No problem. Let me know when you\'re ready.");
  }

  function handleLock() {
    if (!pendingLock) return;
    const { assetName, assetType, section, outputUrl } = pendingLock;
    setPendingLock(null);
    const lockedAt = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    vaultAdd({ name: assetName, type: assetType, section, buildingId: bldg.id, lockedAt, outputUrl: outputUrl || null });
    addMonologue(`Locked. ${assetName} is in your Vault.`);
  }

  function handleLockKeep() {
    setPendingLock(null);
    addMonologue("Still on the canvas whenever you\'re ready.");
  }

  return (
    <div className={"fy-col" + (fyCollapsed ? " fy-collapsed" : "")}>
      <div className="fy-rail-collapse-btn" onClick={onToggleFYCollapse}>{fyCollapsed ? "<" : ">"}</div>
      <FYAvatarSlot tier={tier} firstName={firstName} videoTrack={remoteVideoTrack} />
      <div className="fy-rail-header">
        <div className="fy-rail-header-left">
          <div className="fy-rail-dot" />
          <div className="fy-rail-label">FUTUREYOU</div>
        </div>
        <FYVideoToggle />
        <button className="fy-rail-reset" onClick={handleReset}>RESET</button>
      </div>
      <div className="fy-chat-section">
        <div className="fy-chat-body" ref={bodyRef}>
          {msgs.filter(m => !m.hidden).map((m,i) => {
            if (m.role === 'agent') return (
              <div key={i} className="fy-msg-agent">
                <div className="fy-msg-agent-text">{m.text}</div>
              </div>
            );
            return (
              <div key={i} className={`fy-msg fy-msg-${m.role}`}>
                <div className="fy-msg-sender">{m.role==='user' ? (firstName||'YOU') : 'FUTUREYOU'}</div>
                <div className="fy-msg-bubble">{m.text}</div>
              </div>
            );
          })}
          {loading && (
            <div className="fy-msg fy-msg-fy">
              <div className="fy-msg-sender">FUTUREYOU</div>
              <div className="fy-msg-bubble fy-typing"><span/><span/><span/></div>
            </div>
          )}
        </div>

        {pendingConfirm && (
          <div className="fy-confirm-bar">
            <div className="fy-confirm-desc">{pendingConfirm.confirmDesc}</div>
            <div className="fy-confirm-actions">
              <button className="fy-confirm-btn confirm" onClick={handleConfirm}>BUILD IT</button>
              <button className="fy-confirm-btn cancel" onClick={handleConfirmCancel}>NOT YET</button>
            </div>
          </div>
        )}
        {pendingLock && (
          <div className="fy-lock-bar">
            <div className="fy-lock-desc"><strong>{pendingLock.assetName}</strong> is ready. Save it to your Vault and we'll move on.</div>
            <div className="fy-lock-actions">
              <button className="fy-lock-btn lock" onClick={handleLock}>LOCK IT</button>
              <button className="fy-lock-btn keep" onClick={handleLockKeep}>KEEP OPEN</button>
            </div>
          </div>
        )}

        <div className="fy-mode-label">{isIndependent ? 'DIRECTIVE MODE' : 'PEER MODE'}</div>
        <div className="fy-input-area">
          <div className="fy-input-row">
            <textarea
              ref={inputRef}
              className="fy-input"
              rows="1"
              placeholder={`Ask FutureYou about ${bldg.title.charAt(0)+bldg.title.slice(1).toLowerCase()}...`}
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={handleKey}
            />
            <button
              className="fy-send"
              onClick={()=>{ const v=input.trim(); if(v&&!loading){setInput('');sendMsg(v);} }}
              disabled={!input.trim()||loading}
            >SEND</button>
          </div>
        </div>
      </div>
    </div>
  );
});

/* ── Output Card ── */
function OutputCard({ card, onVault }) {
  const ext = card.cardType === 'video' ? '.mp4' : card.cardType === 'audio' ? '.mp3' : '.png';
  return (
    <div className="canvas-card-wrap">
      <div className="canvas-card-controls">
        <button className="canvas-ctrl" title="Regenerate">&#x21BA;</button>
        <button className="canvas-ctrl" title="Download" onClick={() => {
          if (card.outputUrl) { const a = document.createElement('a'); a.href = card.outputUrl; a.download = card.title + ext; a.click(); }
        }}>&#x2193;</button>
        <button className="canvas-ctrl" title="Fullscreen" onClick={() => { if (card.outputUrl) window.open(card.outputUrl, '_blank'); }}>&#x29C9;</button>
        <button className="canvas-ctrl lock-ctrl" title="Vault" onClick={() => onVault(card.id)}>&#x2B21;</button>
      </div>
      <div className="canvas-card-label">
        <span className="canvas-card-label-title">{card.title}</span>
        {card.tool && <span className="canvas-card-label-tool">{card.tool}</span>}
      </div>
      <div className={["canvas-card", card.state === 'vaulted' ? 'vaulted' : '', card.state === 'generating' ? 'generating' : ''].filter(Boolean).join(' ')}>
        {card.state === 'vaulted' && <div className="canvas-card-vault-badge">VAULTED</div>}
        {card.state === 'generating' && (
          <React.Fragment>
            <div className="canvas-card-gen-icon">&#x2B21;</div>
            <div className="canvas-card-gen-label">GENERATING</div>
            <div className="canvas-card-gen-sub">{card.title.toLowerCase()}&hellip;</div>
            <div className="canvas-card-gen-bar"><div className="canvas-card-gen-fill" id={"cprog-" + card.id} /></div>
          </React.Fragment>
        )}
        {card.state !== 'generating' && card.outputUrl && card.cardType === 'video' && (
          <video className="canvas-card-video" src={card.outputUrl} controls preload="metadata" />
        )}
        {card.state !== 'generating' && card.outputUrl && card.cardType === 'audio' && (
          <audio className="canvas-card-audio" src={card.outputUrl} controls />
        )}
        {card.state !== 'generating' && card.outputUrl && (card.cardType === 'image' || !card.cardType) && (
          <img className="canvas-card-img" src={card.outputUrl} alt={card.title} />
        )}
        {card.state !== 'generating' && !card.outputUrl && (
          <div style={{padding:'16px 14px', fontSize:'11px', color:'var(--fg3)', fontFamily:'"Playfair Display",serif', fontStyle:'italic', lineHeight:'1.6'}}>Output not available.</div>
        )}
      </div>
    </div>
  );
}

/* ── Canvas ── */
function CanvasCol({ bldg, tier, directive, fyRailRef, activeSection, sectionToggle, recommendedStep, onSectionChange, onBuildingSwitch, onStepActivate, onSectionVisit }) {
  const [activeStep, setActiveStep] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [canvasCards, setCanvasCards] = useState([]);
  const [vaultAssets, setVaultAssets] = useState([]);
  const [editingStepKey, setEditingStepKey] = useState(null);
  const [editText, setEditText] = useState('');
  useEffect(() => vaultSubscribe(setVaultAssets), []);
  const tasks = BUILDING_TASKS[bldg.id] || [];
  const isIndependent = tier !== 'operator';
  const isFYRecommended = (localStorage.getItem('sy_recommended_building')||'') === bldg.id;
  const normStepTitle = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const isRecommendedStep = task => {
    if (!recommendedStep) return false;
    const a = normStepTitle(task.title), b = normStepTitle(recommendedStep);
    return a === b || a.includes(b) || b.includes(a);
  };
  const spatialRef = useRef(null);
  const prevSection = useRef(-2);

  useEffect(() => {
    setActiveStep(null);
    setDrawerOpen(false);
    setCanvasCards([]);
    onSectionChange(-1);
    prevSection.current = -2;
  }, [bldg.id]);

  useEffect(() => {
    if (activeSection >= 0 && activeSection !== prevSection.current) {
      prevSection.current = activeSection;
      setDrawerOpen(true);
      setActiveStep(null);
      if (activeSection >= 0) onSectionVisit(activeSection);
    }
  }, [activeSection]);

  useEffect(() => {
    function onGenerating(e) {
      const { eventId, taskTitle, tool, cardType } = e.detail;
      setCanvasCards(prev => {
        if (prev.find(c => c.id === eventId)) return prev;
        return [...prev, { id: eventId, title: taskTitle, tool, cardType: cardType || 'image', outputUrl: null, state: 'generating' }];
      });
      setTimeout(() => { if (spatialRef.current) spatialRef.current.scrollTop = spatialRef.current.scrollHeight; }, 50);
    }
    window.addEventListener('sy:canvasGenerating', onGenerating);
    return () => window.removeEventListener('sy:canvasGenerating', onGenerating);
  }, []);

  useEffect(() => {
    function onOutput(e) {
      const { eventId, outputUrl, taskTitle, model, cardType } = e.detail;
      setCanvasCards(prev => {
        const exists = prev.find(c => c.id === eventId);
        if (exists) return prev.map(c => c.id === eventId ? { ...c, outputUrl, cardType: cardType || c.cardType || 'image', state: 'done', tool: model || c.tool } : c);
        return [...prev, { id: eventId, title: taskTitle, tool: model || '', cardType: cardType || 'image', outputUrl, state: 'done' }];
      });
      setTimeout(() => { if (spatialRef.current) spatialRef.current.scrollTop = spatialRef.current.scrollHeight; }, 50);
    }
    window.addEventListener('sy:canvasOutput', onOutput);
    return () => window.removeEventListener('sy:canvasOutput', onOutput);
  }, []);

  useEffect(() => {
    if (sectionToggle === 0) return;
    if (activeStep) {
      setActiveStep(null);
      setDrawerOpen(true);
    } else if (drawerOpen) {
      setDrawerOpen(false);
      onSectionChange(-1);
    } else {
      setDrawerOpen(true);
    }
  }, [sectionToggle]);

  function handleSectionSelect(si) {
    onSectionChange(si);
    onSectionVisit(si);
    setActiveStep(null);
    setDrawerOpen(true);
  }

  function handleStepSelect(si, ti, task) {
    if (activeStep && activeStep.si === si && activeStep.ti === ti) {
      setActiveStep(null);
      setDrawerOpen(true);
      return;
    }
    setActiveStep({ si, ti, task });
    setDrawerOpen(false);
    onStepActivate({ si, ti, task });
    if (isIndependent && fyRailRef && fyRailRef.current) {
      fyRailRef.current.triggerTask(task, bldg, si, ti);
    }
  }

  function handleVaultCard(cardId) {
    const card = canvasCards.find(c => c.id === cardId);
    if (!card || card.state === 'vaulted') return;
    setCanvasCards(prev => prev.map(c => c.id === cardId ? { ...c, state: 'vaulted' } : c));
    vaultAdd({
      name: card.title, type: card.cardType || 'image',
      section: activeStep ? 'Section ' + (activeStep.si + 1) : 'Canvas',
      buildingId: bldg.id,
      lockedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      outputUrl: card.outputUrl || null
    });
    if (fyRailRef && fyRailRef.current) {
      fyRailRef.current.addMonologue('Locked. ' + card.title + ' is in your Vault.');
    }
  }

  const currentSection = tasks[activeSection];
  const buildingVault = vaultAssets.filter(a => a.buildingId === bldg.id && a.type === 'answer');
  function answerFor(task) {
    return currentSection ? buildingVault.find(a => a.section === currentSection.section && a.name === task.title) : null;
  }
  function startEdit(task, existing) {
    setEditingStepKey(task.title);
    setEditText(existing ? existing.text : '');
  }
  function cancelEdit() {
    setEditingStepKey(null);
    setEditText('');
  }
  async function saveStepEdit(task) {
    if (!currentSection) return;
    const text = editText.trim();
    if (!text) { cancelEdit(); return; }
    const lockedAt = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    vaultUpdate(
      a => a.buildingId === bldg.id && a.section === currentSection.section && a.name === task.title && a.type === 'answer',
      { text, lockedAt }
    );
    // If this step had no prior answer, the vaultUpdate above matches nothing —
    // add it fresh so it shows immediately instead of waiting on a round trip.
    const alreadyExists = buildingVault.some(a => a.section === currentSection.section && a.name === task.title);
    if (!alreadyExists) {
      vaultAdd({ name: task.title, type: 'answer', section: currentSection.section, buildingId: bldg.id, lockedAt, text });
    }
    setEditingStepKey(null);
    const projectId = localStorage.getItem('sy_active_project_id');
    if (projectId) {
      fetch(`${API_URL}/api/vault/capture`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          project_id: projectId,
          building_slug: bldg.id,
          section_name: currentSection.section,
          step_title: task.title,
          captured_answer: text,
        })
      }).catch(() => {});
    }
  }

  return (
    <div className="canvas-col" style={{position:'relative'}}>

      {/* Canvas header */}
      <div className={`canvas-header${activeStep ? ' workspace-mode' : ''}`}>
        <div className="canvas-header-left">
          <div className="canvas-building-eyebrow">{bldg.tag.toUpperCase()}</div>
          <div className="canvas-building-title">{bldg.title}</div>
          <div className="canvas-building-fy-quote">"{bldg.fyq}"</div>
        </div>
        <div className="canvas-header-right">
          {bldg.gif && <img src={bldg.gif} alt="" className="canvas-bldg-gif" />}
          {activeStep ? (
            <div className="canvas-workspace-badge">CANVAS ACTIVE</div>
          ) : (
            <div className={`canvas-state-badge${isIndependent ? ' active' : ''}`}>
              {isIndependent ? 'FY DIRECTING' : 'OPERATOR MODE'}
            </div>
          )}
        </div>
      </div>

      {/* Building tab strip */}
      <div className="building-tab-strip">
        <span className="canvas-strip-label">Canvas</span>
        {BUILDINGS.map(b => (
          <div key={b.id}
            className={`building-tab${b.id === bldg.id ? ' active' : ''}`}
            onClick={() => { if (b.id !== bldg.id) onBuildingSwitch(b.id); }}
          >
            <span className="building-tab-icon">{b.icon}</span>{b.title}
          </div>
        ))}
      </div>

      {/* Step drawer */}
      {drawerOpen && currentSection && (
        <div className="step-drawer">
          <div className="step-drawer-header">
            <div className="step-drawer-section">{currentSection.section}</div>
            <div className="step-drawer-sub">Section {activeSection + 1} &middot; {currentSection.tasks.length} steps</div>
            <button className="step-drawer-close" onClick={() => setDrawerOpen(false)}>&#x2715;</button>
          </div>
          <div className="step-drawer-list">
            {currentSection.tasks.map((task, ti) => (
              <div key={ti}
                className={`step-drawer-item${isRecommendedStep(task) ? ' recommended' : ''}`}
                onClick={() => handleStepSelect(activeSection, ti, task)}
              >
                <div className="step-drawer-num">STEP {ti + 1}</div>
                <div>
                  <div className="step-drawer-title">{task.title}</div>
                  <div className="step-drawer-desc">{task.level1}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Spatial canvas — always visible */}
      <div className="canvas-spatial" ref={spatialRef}>

        {/* Active step chip */}
        {activeStep && (
          <div className="canvas-step-chip">
            <div className="canvas-step-chip-dot" />
            <span className="canvas-step-chip-text">STEP {activeStep.ti + 1}</span>
            <span style={{color:'rgba(0,200,255,0.25)',margin:'0 4px'}}>&#xB7;</span>
            <span className="canvas-step-chip-title">{activeStep.task.title}</span>
          </div>
        )}

        {/* Live step answers — one sticky per step in the active section.
            Filled steps show the captured answer, click to edit in place.
            Open steps show an empty slot so the whole section's shape is
            visible at a glance, not just what's been answered so far. */}
        {currentSection && (
          <div className="canvas-step-answers">
            {currentSection.tasks.map((task, ti) => {
              const existing = answerFor(task);
              const editing = editingStepKey === task.title;
              if (editing) {
                return (
                  <div key={ti} className="canvas-answer-sticky editing">
                    <div className="canvas-answer-sticky-header">
                      <span className="canvas-answer-sticky-section">{currentSection.section} · Step {ti + 1}</span>
                      <span className="canvas-answer-sticky-title">{task.title}</span>
                    </div>
                    <textarea
                      className="canvas-answer-sticky-textarea"
                      value={editText}
                      onChange={e => setEditText(e.target.value)}
                      autoFocus
                    />
                    <div className="canvas-answer-sticky-actions">
                      <button className="canvas-answer-sticky-save" onClick={() => saveStepEdit(task)}>Save</button>
                      <button className="canvas-answer-sticky-cancel" onClick={cancelEdit}>Cancel</button>
                    </div>
                  </div>
                );
              }
              if (existing) {
                return (
                  <div key={ti} className="canvas-answer-sticky filled" onClick={() => startEdit(task, existing)}>
                    <div className="canvas-answer-sticky-header">
                      <span className="canvas-answer-sticky-section">{currentSection.section} · Step {ti + 1}</span>
                      <span className="canvas-answer-sticky-title">{task.title}</span>
                    </div>
                    <div className="canvas-answer-sticky-text">{existing.text}</div>
                    <div className="canvas-answer-sticky-edit-hint">Click to edit</div>
                  </div>
                );
              }
              return (
                <div key={ti} className="canvas-answer-sticky open">
                  <div className="canvas-answer-sticky-header">
                    <span className="canvas-answer-sticky-section">{currentSection.section} · Step {ti + 1}</span>
                    <span className="canvas-answer-sticky-title">{task.title}</span>
                  </div>
                  <div className="canvas-answer-sticky-waiting">Awaiting answer</div>
                </div>
              );
            })}
          </div>
        )}

        {/* Empty state — only when no section selected and nothing generated yet */}
        {!currentSection && canvasCards.length === 0 && (
          <div className="canvas-spatial-empty">
            <div className="canvas-spatial-empty-icon">{bldg.icon}</div>
            <div className="canvas-spatial-empty-label">{bldg.title}</div>
            <div className="canvas-spatial-empty-sub">
              {tasks.length > 0
                ? 'Select a section from the left. FutureYou will guide you from there.'
                : 'This building is being configured.'}
            </div>
          </div>
        )}

        {/* Output cards — FY sequenced */}
        {canvasCards.map(card => (
          <OutputCard key={card.id} card={card} onVault={handleVaultCard} />
        ))}

      </div>
    </div>
  );
}

/* ── Studio Root ── */
function Studio() {
  const [slug, setSlug] = useState(getSlugFromURL);
  const [bldg, setBldg] = useState(() => getBuildingById(getSlugFromURL()));
  const [directive, setDirective] = useState('');
  const [activeSection, setActiveSection] = useState(-1);
  const [activeStep, setActiveStep] = useState(null);
  const [visitedSections, setVisitedSections] = useState([]);
  const [recommendedSection, setRecommendedSection] = useState(-1);
  const [navStepTitle, setNavStepTitle] = useState('');
  const [sectionToggle, setSectionToggle] = useState(0);
  const [showAbout, setShowAbout] = useState(false);
  const [fyCollapsed, setFYCollapsed] = useState(false);
  const fyRailRef = useRef(null);

  const firstName  = localStorage.getItem('sy_first_name') || '';
  const studioName = localStorage.getItem('sy_studio_name') || 'YOUR STUDIO';
  const tier       = localStorage.getItem('sy_tier') || 'independent';
  const formation  = localStorage.getItem('sy_formation') || '[]';
  const briefing   = localStorage.getItem('sy_briefing') || '{}';
  const email      = localStorage.getItem('sy_email') || '';
  const [projects, setProjects] = React.useState([]);
  const [activeProject, setActiveProject] = React.useState(null);

  useEffect(() => {
    if (activeProject && activeProject.id) vaultLoadFromServer(activeProject.id);
  }, [activeProject && activeProject.id]);

  async function loadProjects() {
    if (!email) return;
    try {
      const res = await fetch(`${API_URL}/api/projects/list?email=${encodeURIComponent(email)}`);
      const d = await res.json();
      if (d.success && d.projects && d.projects.length) {
        setProjects(d.projects);
        const storedId = localStorage.getItem('sy_active_project_id');
        const preferred = storedId && d.projects.find(p=>p.id===storedId);
        const active = preferred || d.projects[0];
        setActiveProject(active);
        localStorage.setItem('sy_active_project_id', active.id);
        localStorage.setItem('sy_active_project_name', active.name || '');
      }
    } catch(e) { console.warn('[Studio] projects load failed:', e); }
  }

  async function handleProjectSwitch(project) {
    setActiveProject(project);
    localStorage.setItem('sy_active_project_id', project.id);
    localStorage.setItem('sy_active_project_name', project.name || '');
    fetch(API_URL+'/api/projects/set-active', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ project_id: project.id, email })
    }).catch(()=>{});
  }

  async function handleProjectCreate() {
    try {
      const res = await fetch(API_URL+'/api/projects/create', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, tier })
      });
      const d = await res.json();
      if (d.success) await loadProjects();
    } catch(e) { console.warn('[Studio] project create failed:', e); }
  }

  async function handleProjectDelete(project) {
    try {
      const res = await fetch(API_URL+'/api/projects/delete', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ project_id: project.id, email })
      });
      const d = await res.json();
      if (d.success) {
        await loadProjects();
        if (activeProject && activeProject.id === project.id) {
          setActiveProject(null);
          localStorage.removeItem('sy_active_project_id');
          localStorage.removeItem('sy_active_project_name');
        }
      }
    } catch(e) { console.warn('[Studio] project delete failed:', e); }
  }

  // Seed Section 1 in path and apply building bg on building load
  useEffect(() => {
    setVisitedSections([]);
    if (bldg.bg) {
      document.body.style.backgroundImage = `url(${bldg.bg})`;
    } else {
      document.body.style.backgroundImage = '';
    }
    return () => { document.body.style.backgroundImage = ''; };
  }, [bldg.id]);

  // On mount: read FY nav destination from dashboard pill and flash section + step
  useEffect(() => {
    const navSection = localStorage.getItem('sy_nav_section');
    const navStep = localStorage.getItem('sy_nav_step');
    if (navSection) {
      const tasks = BUILDING_TASKS[bldg.id] || [];
      const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const target = norm(navSection);
      let si = tasks.findIndex(s => norm(s.section) === target);
      if (si < 0) si = tasks.findIndex(s => norm(s.section).includes(target) || target.includes(norm(s.section)));
      // Backend named a destination but it didn't match any known section title —
      // still flash the first section rather than silently show nothing.
      if (si < 0 && tasks.length > 0) si = 0;
      if (si >= 0) setRecommendedSection(si);
    }
    if (navStep) setNavStepTitle(navStep);
    // localStorage cleared by initFY after it reads them for the opening prompt
  }, []);

  // Redirect to home if no session
  useEffect(() => {
    if (!email) { window.location.href = '/'; }
    else { loadProjects(); }
  }, []);

  // Redirect to subscribe if no tier
  useEffect(() => {
    if (email && !localStorage.getItem('sy_tier')) {
      window.location.href = '/subscribe.html';
    }
  }, []);

  function switchBuilding(newSlug) {
    const b = getBuildingById(newSlug);
    setSlug(newSlug);
    setBldg(b);
    setDirective('');
    setActiveStep(null);
    setRecommendedSection(-1);
    setActiveSection(-1);
    setVisitedSections([]);
    const url = new URL(window.location.href);
    url.searchParams.set('building', newSlug);
    window.history.pushState({}, '', url.toString());
  }

  function handleLotClick() { window.location.href = '/dashboard.html'; }

  return (
    <div className="studio-shell">
      {showAbout && ReactDOM.createPortal(
        <AboutModal onClose={() => setShowAbout(false)} />,
        document.body
      )}
      {/* Top bar — 3-zone: left nav / center studio name / right user info */}
      <div className="studio-topbar">
        {/* Left: menu + breadcrumb path */}
        <div className="topbar-left">
          <LogoButton onShowAbout={() => setShowAbout(true)} />
          <div className="topbar-sep" />
          <div className="topbar-path">
            <div className="topbar-path-seg" onClick={handleLotClick}>THE LOT</div>
            <div className="topbar-path-arrow">›</div>
            <div className="topbar-path-seg" onClick={() => { setActiveSection(0); setVisitedSections([0]); }}>{bldg.title}</div>
            {visitedSections.map((si, idx) => {
              const isCurrent = idx === visitedSections.length - 1;
              return (
                <React.Fragment key={si}>
                  <div className="topbar-path-arrow">›</div>
                  <div
                    className={`topbar-path-seg${isCurrent ? ' current' : ''}`}
                    onClick={isCurrent ? undefined : () => setActiveSection(si)}
                    style={isCurrent ? {} : {cursor:'pointer'}}
                  >
                    SECTION {si + 1}
                  </div>
                </React.Fragment>
              );
            })}
          </div>
        </div>

        {/* Center: studio name */}
        <div className="topbar-center">
          <div className="topbar-studio-name">{studioName.toUpperCase()}</div>
        </div>

        {/* Right: user info — mirrors dashboard exactly */}
        <div className="topbar-right">
          {firstName && <span className="topbar-welcome">Welcome back, {firstName}</span>}
          {firstName && <div className="topbar-sep" />}
          {email && (
            <>
              <span className="topbar-signed-label">Signed In</span>
              <span className="topbar-user-email">{email}</span>
            </>
          )}
          {email && <div className="topbar-sep" />}
          {tier && (
            <div className={`sy-badge-3d ${tier === 'operator' ? 'sy-badge-3d-gold' : 'sy-badge-3d-cyan'}`} style={{fontSize:'8px',padding:'4px 10px'}}>
              <div className="sy-badge-3d-dot" style={{width:'4px',height:'4px'}} />
              {tier.charAt(0).toUpperCase()+tier.slice(1)}
            </div>
          )}
          {tier && <div className="topbar-sep" />}
          <div className="sy-badge-3d sy-badge-3d-green" style={{fontSize:'7px',padding:'4px 10px'}}>
            <div className="sy-badge-3d-dot" style={{width:'4px',height:'4px',animation:'pg 2s infinite'}} />
            FUTUREYOU LIVE
          </div>
        </div>
      </div>

      {/* Three-column body */}
      <div className="studio-body">
        <JourneyCol
          bldg={bldg}
          activeSection={activeSection}
          recommendedSection={recommendedSection}
          onSectionSelect={(si) => {
            setActiveSection(si);
            setVisitedSections(prev => prev.includes(si) ? prev : [...prev, si]);
          }}
          onSectionToggle={() => setSectionToggle(t => t+1)}
          projects={projects}
          activeProject={activeProject}
          onProjectSwitch={handleProjectSwitch}
          onProjectCreate={handleProjectCreate}
          onProjectDelete={handleProjectDelete}
          email={email}
          tier={tier}
        />
        <CanvasCol
          bldg={bldg} tier={tier} directive={directive} fyRailRef={fyRailRef}
          activeSection={activeSection}
          sectionToggle={sectionToggle}
          recommendedStep={navStepTitle}
          onSectionChange={setActiveSection}
          onBuildingSwitch={switchBuilding}
          onStepActivate={setActiveStep}
          onSectionVisit={(si) => setVisitedSections(prev => prev.includes(si) ? prev : [...prev, si])}
        />
        <FYRail
          ref={fyRailRef}
          bldg={bldg} tier={tier} firstName={firstName}
          studioName={studioName} formation={formation} briefing={briefing}
          activeStep={activeStep}
          fyCollapsed={fyCollapsed}
          onToggleFYCollapse={() => setFYCollapsed(c => !c)}
          onDirective={d => {
            setDirective(d);
            // Parse FY directive for section recommendation — normalize & match
            const bldgTasks = BUILDING_TASKS[bldg.id] || [];
            const dLower = d.toLowerCase().replace(/[*_]/g, ''); // strip markdown bold/italic
            // Try exact section name match first, then first-word match
            let match = bldgTasks.findIndex(s => dLower.includes(s.section.toLowerCase()));
            if (match < 0) {
              match = bldgTasks.findIndex(s => dLower.includes(s.section.split(' ')[0].toLowerCase()));
            }
            if (match >= 0) setRecommendedSection(match);
          }}
          onSectionRecommendation={sectionId => {
            // Live recommend_section tool call from the agent (distinct from the
            // onDirective text-sniff above). section_id is the backend's Supabase
            // key for the section, which doesn't necessarily match the frontend's
            // display title string, so normalize both sides the same way the
            // mount-time sy_nav_section matcher already does and compare.
            const bldgTasks = BUILDING_TASKS[bldg.id] || [];
            const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const target = norm(sectionId);
            let si = bldgTasks.findIndex(s => norm(s.section) === target);
            if (si < 0) si = bldgTasks.findIndex(s => norm(s.section).includes(target) || target.includes(norm(s.section)));
            if (si >= 0) {
              setRecommendedSection(si);
              cdPushEvent(si, {
                id: 'route-' + bldg.id + '-' + sectionId + '-' + Date.now(),
                tool: 'Routing',
                desc: `FY moved you here — ${bldgTasks[si].section}`,
                status: 'done',
              });
            }
          }}
        />
      </div>

      {/* Process indicator */}
      <div className="shutter-indicator" id="shutterInd">
        <img src="assets/shutter1.gif" alt="" />
      </div>
    </div>
  );
}

ReactDOM.render(<Studio />, document.getElementById('root'));
</script>
