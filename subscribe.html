<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudioYou — Subscribe</title>
<link rel="icon" type="image/png" href="assets/SY_OFFICIAL_SHUTTER_KEY.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { cursor: default; }
  input, textarea, [contenteditable] { cursor: text; }
  button, [role="button"], .sub-card, .sub-toggle-btn, .sub-chat-send, .syb, .auth-btn, .auth-back, .sub-back-btn, .sub-topbar-back, .sub2-back-link { cursor: pointer; }
  :root {
    --black: #06091a; --navy: #0b0d1a; --white: #f0f2ff;
    --dim: rgba(240,242,255,0.75); --mute: rgba(240,242,255,0.6);
    --cyan: #00c8ff; --purple: #7b35d4; --green: #00e676;
    --grad: linear-gradient(135deg, #00c8ff 0%, #5e28a8 60%, #7b35d4 100%);
    --gradT: linear-gradient(135deg, #00c8ff 0%, #a06be8 100%);
    --border: rgba(0,200,255,0.08); --border-mid: rgba(0,200,255,0.14);
    --sy-green: #4cff91; --sy-gold: #e8c97a;
  }
  html, body, #root { height: 100%; }
  body { background: var(--black); color: var(--white); font-family: 'Outfit', sans-serif; font-weight: 300; min-height: 100vh; }
  .bg-layer {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: url('assets/SY_HILLSIDE_SIGN1.png');
    background-size: 110%; background-position: center; background-repeat: no-repeat;
  }
  .bg-layer::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom,rgba(6,9,26,0.82) 0%,rgba(6,9,26,0.72) 40%,rgba(6,9,26,0.80) 70%,rgba(6,9,26,0.95) 100%); }
  .bg-layer::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to right,rgba(6,9,26,0.7) 0%,transparent 50%,rgba(6,9,26,0.4) 100%); z-index: 1; }
  #root { position: relative; z-index: 1; }

  /* ── AUTH STATES ── */
  .auth-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .auth-card {
    width: 100%; max-width: 480px; background: rgba(10,12,24,0.98);
    border: 1px solid rgba(0,200,255,0.18); padding: 44px 48px 40px; position: relative;
    animation: rise 0.4s cubic-bezier(0.22,1,0.36,1) both;
  }
  .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--grad); }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .auth-logo { height: 36px; width: auto; margin-bottom: 32px; display: block; }
  .auth-eyebrow { font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mute); margin-bottom: 10px; }
  .auth-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(32px,5vw,48px); letter-spacing: 0.03em; line-height: 1; margin-bottom: 8px; }
  .auth-title span { background: var(--gradT); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .auth-body { font-size: 13px; color: var(--dim); line-height: 1.7; margin-bottom: 24px; }
  .auth-error { font-size: 12px; color: rgba(255,100,100,0.85); margin-bottom: 14px; line-height: 1.55; }
  .auth-error strong { display: block; font-size: 13px; color: rgba(255,130,130,0.95); margin-bottom: 3px; }
  .auth-input-row { display: flex; position: relative; margin-bottom: 10px; }
  .auth-input-row::before { content: ''; position: absolute; inset: -1px; background: linear-gradient(135deg, #00c8ff, #7b35d4); z-index: 0; opacity: 0.35; transition: opacity 0.3s; }
  .auth-input-row:focus-within::before { opacity: 0.8; }
  .auth-email { flex: 1; position: relative; z-index: 1; border: none; color: var(--white); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 300; padding: 13px 18px; outline: none; caret-color: var(--cyan); background: linear-gradient(180deg,#020407 0%,#050810 60%,#08091a 100%); box-shadow: inset 0 3px 8px rgba(0,0,0,0.75),inset 0 1px 3px rgba(0,0,0,0.90),inset 0 -1px 0 rgba(0,200,255,0.04); }
  .auth-email::placeholder { color: var(--mute); }
  .auth-btn { position: relative; z-index: 1; border: none; cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.08em; padding: 13px 22px; background: var(--grad); color: var(--white); white-space: nowrap; transition: opacity 0.15s; }
  .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-note { font-size: 11px; color: var(--mute); margin-top: 12px; line-height: 1.6; }
  .auth-note a { color: var(--cyan); text-decoration: none; }
  .auth-back { display: block; margin-top: 24px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); text-decoration: none; transition: color 0.2s; background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .auth-back:hover { color: var(--cyan); }
  .auth-spinner { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; }

  /* ── SUBSCRIBE UI ── */
  .sub-page { min-height: 100vh; display: flex; flex-direction: column; }
  .sub-topbar { height: 52px; background: rgba(11,13,26,0.9); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; gap: 16px; flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
  .sub-topbar-logo { height: 28px; width: auto; }
  .sub-topbar-sep { width: 1px; height: 14px; background: var(--border-mid); }
  .sub-topbar-label { font-size: 9px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--mute); }
  .sub-topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .sub-topbar-user { font-size: 11px; color: var(--mute); }
  .sub-topbar-back { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; transition: color 0.2s; padding: 0; }
  .sub-topbar-back:hover { color: var(--white); }
  .sub-logo-wrap { position:relative; cursor:pointer; display:flex; align-items:center; }
  .sub-logo-menu { position:absolute; top:calc(100% + 8px); left:0; background:rgba(8,11,28,0.98); border:1px solid rgba(240,242,255,0.08); min-width:200px; z-index:9000; box-shadow:0 8px 32px rgba(0,0,0,0.6); }
  .sub-logo-menu-section { font-size:8px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(240,242,255,0.25); padding:8px 16px 4px; }
  .sub-logo-menu-item { display:flex; align-items:center; gap:10px; padding:9px 16px; font-size:11px; color:rgba(240,242,255,0.55); cursor:pointer; font-family:'Outfit',sans-serif; border:none; background:none; width:100%; text-align:left; }
  .sub-logo-menu-item:hover { background:rgba(0,200,255,0.06); color:#f0f2ff; }
  .sub-logo-menu-divider { height:1px; background:rgba(240,242,255,0.06); margin:4px 0; }

  .sub-body-wrap { flex: 1; overflow-y: auto; }
  .sub-content-wrap { width: 100%; max-width: 1100px; margin: 0 auto; }
  .sub-content-wrap-narrow { width: 100%; max-width: 880px; margin: 0 auto; }

  /* headline bar */
  .sub-headline-bar { padding: 24px 40px 20px; border-bottom: 1px solid rgba(0,200,255,0.08); position: relative; text-align: center; }
  .sub-headline-bar::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 100% at 50% 50%,rgba(0,200,255,0.04) 0%,transparent 70%); pointer-events: none; }
  .sub-headline { font-family: 'Bebas Neue', sans-serif; font-size: clamp(32px,4vw,52px); letter-spacing: 0.03em; line-height: 1.1; opacity: 0; transition: opacity 0.7s ease; min-height: 2.6em; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  .sub-headline.visible { opacity: 1; }
  .sub-headline-grad { background: linear-gradient(135deg,#00c8ff 0%,#a06be8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: block; text-align: center; }
  .sub-headline-white { display: block; color: #f0f2ff; text-align: center; }

  /* tiers */
  .sub-tiers-section { padding: 22px 28px 0; border-bottom: 1px solid rgba(0,200,255,0.08); }
  .sub-tiers-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; gap: 12px; }
  .sub-choose-label { font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: #7a7c94; margin-bottom: 3px; text-align: center; }
  .sub-choose-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.07em; text-align: center; }
  .sub-billing-row { display: flex; align-items: center; gap: 10px; }
  .sub-toggle { display: flex; border: 1px solid rgba(0,200,255,0.14); }
  .sub-toggle-btn { font-family: 'Outfit', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 18px; background: transparent; border: none; color: #7a7c94; cursor: pointer; transition: all 0.15s; }
  .sub-toggle-btn.active { background: rgba(0,200,255,0.1); color: #00c8ff; }
  .sub-save-badge { font-size: 8px; letter-spacing: 0.1em; padding: 3px 8px; background: rgba(0,230,118,0.1); color: #00e676; border: 1px solid rgba(0,230,118,0.2); }
  .sub-cards-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: rgba(0,200,255,0.08); margin: 0; }
  .sub-card { padding: 24px 28px 20px; position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    background: linear-gradient(155deg,rgba(24,34,64,0.55) 0%,rgba(14,21,48,0.5) 55%,rgba(9,13,30,0.45) 100%);
    border: 1px solid rgba(0,200,255,0.18);
    box-shadow: inset 1px 1px 0 rgba(0,200,255,0.35),inset -1px -1px 0 rgba(0,0,0,0.85),inset 0 0 32px rgba(0,200,255,0.03),0 4px 18px rgba(0,0,0,0.55),0 1px 0 rgba(0,200,255,0.12);
    transition: box-shadow 0.2s;
  }
  .sub-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(135deg,rgba(0,200,255,0.7) 0%,rgba(123,53,212,0.4) 60%,rgba(123,53,212,0.15) 100%); z-index: 0; }
  .sub-card:hover { box-shadow: inset 1px 1px 0 rgba(0,200,255,0.5),inset -1px -1px 0 rgba(0,0,0,0.85),inset 0 0 32px rgba(0,200,255,0.05),0 6px 24px rgba(0,0,0,0.65),0 1px 0 rgba(0,200,255,0.2); }
  .sub-card.ind { background: linear-gradient(155deg,rgba(0,40,80,0.6) 0%,rgba(0,28,60,0.55) 55%,rgba(0,18,42,0.5) 100%); border-color: rgba(0,200,255,0.28); }
  .sub-card.ind::before { background: linear-gradient(135deg,rgba(0,200,255,0.9) 0%,rgba(94,40,168,0.5) 60%,rgba(123,53,212,0.2) 100%); }
  .sub-rec-tag { z-index: 1; }
  .sub-rec-tag { position: absolute; top: -1px; right: 20px; font-size: 7px; letter-spacing: 0.2em; text-transform: uppercase; background: rgba(0,200,255,0.12); color: #00c8ff; border: 1px solid rgba(0,200,255,0.35); border-top: none; padding: 3px 8px; }
  .sub-card-name { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.05em; line-height: 1; margin-bottom: 3px; }
  .sub-card-desc { font-size: 12px; font-style: italic; color: #7a7c94; margin-bottom: 14px; }
  .sub-card-name-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .sub-price-big { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 0.02em; line-height: 1; }
  .sub-price-unit { font-size: 13px; color: #7a7c94; }
  .sub-price-annual-note { font-size: 12px; color: #7a7c94; text-align: right; margin-bottom: 14px; }
  .sub-cta-wrap { margin-bottom: 18px; }
  .sub-cta-wrap .syb { width: 100%; padding: 12px; font-size: 15px; }
  .sub-divider { height: 1px; background: rgba(0,200,255,0.07); margin-bottom: 14px; }
  .sub-features { list-style: none; margin-bottom: 10px; flex: 1; }
  .sub-features li { font-size: 12px; color: #c8cadc; line-height: 1.8; display: flex; gap: 7px; align-items: baseline; }
  .sub-features li::before { content: '✓'; color: #00c8ff; font-size: 9px; flex-shrink: 0; }
  .sub-card.op .sub-features li::before { color: #a06be8; }
  .sub-fee-note { font-size: 11px; color: #7a7c94; margin-top: auto; padding-top: 8px; }
  .sub-fee-note .waived { color: #00e676; font-weight: 500; }

  /* founding block */
  .sub-shared-info { border-bottom: 1px solid rgba(0,200,255,0.08); }
  .sub-founding-block { padding: 20px 40px; text-align: center; }
  .sub-founding-label { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,180,0,0.8); margin-bottom: 8px; }
  .sub-founding-text { font-size: 12px; color: #c8cadc; line-height: 1.65; max-width: 580px; margin: 0 auto; }
  .sub-founding-text strong { color: #00c8ff; font-weight: 500; }
  .sub-bill-link { font-size: 11px; color: #7a7c94; margin-top: 10px; }
  .sub-bill-link a { color: #00c8ff; text-decoration: none; }

  /* FY chat */
  .sub-bottom { display: flex; flex-direction: column; align-items: center; padding: 0 28px 28px; }
  .sub-bottom-inner { width: 100%; max-width: 560px; display: flex; flex-direction: column; }
  .sub-chat-header { padding: 14px 0 0; display: flex; align-items: center; gap: 8px; }
  .sub-chat-dot { width: 5px; height: 5px; border-radius: 50%; background: #00e676; animation: pg 2s infinite; flex-shrink: 0; }
  @keyframes pg { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .sub-chat-label { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: #00e676; }
  .sub-chat-sublabel { font-size: 10px; color: #7a7c94; margin-left: auto; font-style: italic; }
  .sub-chat-thread { padding: 10px 0 0; max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
  .sub-chat-thread::-webkit-scrollbar { display: none; }
  .sub-msg-fy { font-family: 'Playfair Display', serif; font-style: italic; font-size: 13px; line-height: 1.75; color: #f0f2ff; }
  .sub-msg-user { font-size: 12px; color: #c8cadc; text-align: right; padding-left: 60px; line-height: 1.6; }
  .sub-chat-input-row { display: flex; margin: 10px 0 0; border: 1px solid rgba(0,200,255,0.14); background: rgba(0,200,255,0.02); transition: border-color 0.2s; }
  .sub-chat-input-row:focus-within { border-color: rgba(0,230,118,0.3); }
  .sub-chat-input { flex: 1; background: linear-gradient(180deg,#020407 0%,#050810 60%,#08091a 100%); box-shadow: inset 0 3px 8px rgba(0,0,0,0.75),inset 0 1px 3px rgba(0,0,0,0.90),inset 0 -1px 0 rgba(0,200,255,0.04); border: none; color: #f0f2ff; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 300; padding: 10px 14px; outline: none; resize: none; min-height: 40px; max-height: 80px; caret-color: #00e676; line-height: 1.5; }
  .sub-chat-input::placeholder { color: #7a7c94; font-style: italic; }
  .sub-chat-send { background: transparent; border: none; border-left: 1px solid rgba(0,200,255,0.1); color: #00e676; font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.08em; padding: 0 16px; cursor: pointer; transition: background 0.15s; align-self: flex-end; height: 40px; flex-shrink: 0; }
  .sub-chat-send:hover { background: rgba(0,230,118,0.06); }
  .sub-chat-send:disabled { opacity: 0.25; cursor: default; }

  /* step 2 */
  .sub-step2 { display: grid; grid-template-columns: 1fr 1fr; min-height: 520px; }
  .sub2-left { padding: 48px 44px 40px; border-right: 1px solid rgba(0,200,255,0.08); display: flex; flex-direction: column; background: linear-gradient(155deg,rgba(24,34,64,0.55) 0%,rgba(14,21,48,0.5) 55%,rgba(9,13,30,0.45) 100%); }
  .sub2-building-label { font-size: 9px; letter-spacing: 0.26em; text-transform: uppercase; color: #7a7c94; margin-bottom: 6px; }
  .sub-back-btn { background: none; border: none; color: rgba(240,242,255,0.4); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 6px; font-family: 'Outfit', sans-serif; margin-bottom: 20px; transition: color 0.15s; }
  .sub-back-btn:hover { color: #f0f2ff; }
  .sub2-tier-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .sub2-tier-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(52px,6.5vw,76px); letter-spacing: 0.03em; line-height: 1; margin-bottom: 4px; user-select: none; }
  .sub2-tier-name.ind { background: linear-gradient(135deg,#00c8ff 0%,#a06be8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub2-tier-name.op { color: #a06be8; }
  .sub2-tier-name.player { background: linear-gradient(135deg,#e8c97a 0%,#c9a84c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub2-tier-desc { font-size: 12px; font-style: italic; color: #7a7c94; margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid rgba(0,200,255,0.08); }
  .sub2-line { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid rgba(0,200,255,0.07); font-size: 12px; }
  .sub2-line-label { color: #c8cadc; }
  .sub2-line-val { font-weight: 400; }
  .sub2-line-val.waived { color: #00e676; }
  .sub2-line-val.strike { color: #7a7c94; text-decoration: line-through; font-size: 11px; }
  .sub2-due { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 0; margin-bottom: 20px; }
  .sub2-due-label { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.1em; }
  .sub2-due-val { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 0.04em; color: #00c8ff; }
  .sub2-founding-note { padding: 12px 14px; border: 1px solid rgba(255,180,0,0.2); background: rgba(255,180,0,0.03); margin-bottom: 20px; }
  .sub2-founding-label { font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,180,0,0.8); margin-bottom: 5px; }
  .sub2-founding-text { font-size: 10px; color: #c8cadc; line-height: 1.65; }
  .sub2-features-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #7a7c94; margin-bottom: 8px; }
  .sub2-features-list { list-style: none; }
  .sub2-features-list li { font-size: 10px; color: #c8cadc; line-height: 1.7; display: flex; gap: 7px; align-items: baseline; }
  .sub2-features-list li::before { content: '✓'; color: #00c8ff; font-size: 9px; flex-shrink: 0; }
  .sub2-right { padding: 48px 40px 40px; display: flex; flex-direction: column; background: rgba(14,16,32,0.35); }
  .sub2-right-headline { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.08em; margin-bottom: 4px; }
  .sub2-right-sub { font-size: 10px; color: #7a7c94; margin-bottom: 28px; line-height: 1.6; }
  .sub2-field-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #7a7c94; margin-bottom: 6px; }
  .sub2-field { width: 100%; padding: 12px 14px; margin-bottom: 16px; background: rgba(0,200,255,0.03); border: 1px solid rgba(0,200,255,0.14); color: #f0f2ff; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 300; outline: none; transition: border-color 0.2s; caret-color: #00e676; }
  .sub2-field:focus { border-color: rgba(0,200,255,0.35); }
  .sub2-beta-note { padding: 12px 14px; background: rgba(0,200,255,0.05); border: 1px solid rgba(0,200,255,0.15); font-size: 10px; color: #c8cadc; line-height: 1.65; margin-bottom: 16px; }
  .sub2-beta-note strong { color: #00c8ff; font-weight: 500; }
  .sub2-card-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #7a7c94; margin-bottom: 6px; }
  .sub2-card-placeholder { padding: 12px 14px; border: 1px solid rgba(0,200,255,0.08); font-size: 12px; color: #7a7c94; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .sub2-card-icons { display: flex; gap: 4px; }
  .sub2-card-icon { font-size: 9px; padding: 2px 6px; border: 1px solid rgba(0,200,255,0.12); color: #7a7c94; letter-spacing: 0.06em; }
  .sub2-reserve-btn-wrap { margin-bottom: 10px; }
  .sub2-reserve-btn-wrap .syb { width: 100%; padding: 14px; font-size: 18px; }

function AuthGate({ onAuth }) {
  const [mode, setMode] = useState('idle'); // idle | sending | sent | subscribed
  const [email, setEmail] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    const tier = localStorage.getItem('sy_tier');
    const storedEmail = localStorage.getItem('sy_email');
    if (tier) { setMode('subscribed'); return; }
    if (storedEmail) { onAuth(); } // known unsubscribed — skip gate
  }, []);

  async function handleSubmit() {
    if (!email.trim()) { setError('Enter your email.'); return; }
    setLoading(true); setError('');
    try {
      localStorage.setItem('sy_post_auth_redirect', '?fromsubscribe=1');
      const res = await fetch(`${API_URL}/api/auth/magic-link`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: email.trim() })
      });
      if (res.status === 404) {
        localStorage.removeItem('sy_post_auth_redirect');
        setError('NO_ACCOUNT');
        setLoading(false); return;
      }
      if (!res.ok) {
        localStorage.removeItem('sy_post_auth_redirect');
        setError('Something went wrong. Please try again.');
        setLoading(false); return;
      }
      setMode('sent');
    } catch(e) {
      localStorage.removeItem('sy_post_auth_redirect');
      setError('Connection error. Please try again.');
    }
    setLoading(false);
  }

  async function handleSubscribedSignIn() {
    if (!email.trim()) { setError('Enter your email.'); return; }
    setLoading(true); setError('');
    try {
      const res = await fetch(`${API_URL}/api/auth/magic-link`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: email.trim() })
      });
      if (!res.ok) { setError('Email not found. Try a different address.'); setLoading(false); return; }
      setMode('sent');
    } catch(e) { setError('Connection error.'); }
    setLoading(false);
  }

  if (mode === 'sent') return (
    <div className="auth-wrap">
      <div className="auth-card">
        <img src="assets/SY_LOGO_2D_OFFICIAL.png" className="auth-logo" alt="StudioYou" />
        <div style={{fontSize:32,marginBottom:18}}>✉️</div>
        <div className="auth-title">Check Your <span>Email.</span></div>
        <div className="auth-body">Your sign-in link is on its way. One click and your subscription options will be open and waiting.</div>
        <a href="index.html" className="auth-back">← Back to StudioYou</a>
      </div>
    </div>
  );

  if (mode === 'subscribed') return (
    <div className="auth-wrap">
      <div className="auth-card">
        <img src="assets/SY_LOGO_2D_OFFICIAL.png" className="auth-logo" alt="StudioYou" />
        <div className="auth-eyebrow">StudioYou — Member</div>
        <div className="auth-title">You're already <span>in.</span></div>
        <div className="auth-body">Your studio membership is active. Sign in below to get back to your work.</div>
        {error && <div className="auth-error">{error}</div>}
        <div className="auth-input-row">
          <input className="auth-email" type="email" placeholder="your@email.com" value={email} onChange={e=>{setEmail(e.target.value);setError('');}} onKeyDown={e=>e.key==='Enter'&&handleSubscribedSignIn()} autoFocus />
          <button className="auth-btn" onClick={handleSubscribedSignIn} disabled={loading}>{loading?<img src="assets/shutter1.gif" className="auth-spinner" alt=""/>:'Sign In'}</button>
        </div>
        <a href="dashboard.html" className="auth-back">← Back to The Lot</a>
      </div>
    </div>
  );

  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <img src="assets/SY_LOGO_2D_OFFICIAL.png" className="auth-logo" alt="StudioYou" />
        <div className="auth-eyebrow">StudioYou — Creator Platform</div>
        <div className="auth-title">Join the <span>Studio.</span></div>
        <div className="auth-body">Enter the email you used during your formation. We'll send a sign-in link — your subscription options will be waiting the moment you land.</div>
        {error === 'NO_ACCOUNT' ? (
          <div className="auth-error"><strong>No studio found for that email.</strong>You need to complete your formation before subscribing. <a href="index.html" style={{color:'var(--cyan)',textDecoration:'none'}}>Start here →</a></div>
        ) : error ? (
          <div className="auth-error">{error}</div>
        ) : null}
        <div className="auth-input-row">
          <input className="auth-email" type="email" placeholder="your@email.com" value={email} onChange={e=>{setEmail(e.target.value);setError('');}} onKeyDown={e=>e.key==='Enter'&&handleSubmit()} autoFocus />
          <button className="auth-btn" onClick={handleSubmit} disabled={loading}>{loading?<img src="assets/shutter1.gif" className="auth-spinner" alt=""/>:'Continue'}</button>
        </div>
        <div className="auth-note">No account yet? <a href="index.html">Complete your formation first →</a></div>
        <a href="index.html" className="auth-back">← Back to StudioYou</a>
      </div>
    </div>
  );
}

              )}
              <div className="sub-chat-input-row">
                <textarea className="sub-chat-input" placeholder="What's the difference between Independent and Operator?" value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={handleChatKey} rows={1} autoComplete="off"/>
                <button className="sub-chat-send" onClick={sendChat} disabled={!chatInput.trim()||chatLoading}>ASK</button>
              </div>
            </div>
          </div>
        </>)}

        {step===3&&(
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'64px 40px',minHeight:'420px',gap:20,textAlign:'center',position:'relative'}}>
            <div style={{position:'absolute',top:0,left:0,right:0,height:'1px',background:'linear-gradient(135deg,#00c8ff 0%,#5e28a8 60%,#7b35d4 100%)'}}/>
            <img src="assets/award-ceremony.gif" style={{width:96,height:96,objectFit:'contain'}} alt=""/>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'clamp(36px,5vw,56px)',letterSpacing:'0.04em',lineHeight:1}}>
              <span style={{background:'linear-gradient(135deg,#00c8ff,#a06be8)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text',display:'block'}}>YOU'RE IN.</span>
              <span style={{color:'#f0f2ff',display:'block'}}>THE LOT IS YOURS.</span>
            </div>
            <div style={{fontFamily:"'Playfair Display',serif",fontStyle:'italic',fontSize:15,color:'rgba(240,242,255,0.6)',lineHeight:1.75,maxWidth:380}}>
              Founding Member secured. Your rate is locked permanently. FutureYou is waiting on the other side.
            </div>
            <div style={{height:2,background:'rgba(0,200,255,0.1)',width:'100%',maxWidth:320,overflow:'hidden',marginTop:8}}>
              <div style={{height:'100%',width:'100%',background:'linear-gradient(90deg,#00c8ff,#7b35d4)',transformOrigin:'left',animation:'drain 4s linear forwards'}}/>
            </div>
          </div>
        )}

        {step===2&&selectedTier&&(
          <div style={{display:"flex",justifyContent:"center",padding:"0"}}><div className="sub-step2" style={{width:"100%",maxWidth:"1000px"}}>
            <div className="sub2-left">
              <div className="sub2-building-label">YOU'RE BUILDING</div>
              <button className="sub-back-btn" onClick={goBack}>← BACK</button>
              <div className="sub2-tier-row">
                <div className={`sub2-tier-name ${selectedTier==='independent'?'ind':selectedTier==='player'?'player':'op'}`}>{selectedTier.toUpperCase()}</div>
                <img src="assets/trophy.gif" style={{width:80,height:80,objectFit:'contain',mixBlendMode:'lighten'}} alt=""/>
              </div>
              <div className="sub2-tier-desc">{SUB_PRICES[selectedTier].desc}</div>
              <div className="sub2-line"><span className="sub2-line-label">Annual subscription</span><span className="sub2-line-val">${billing==='annual'?SUB_PRICES[selectedTier].annual:SUB_PRICES[selectedTier].monthly}/mo</span></div>
              <div className="sub2-line"><span className="sub2-line-label">Billed annually</span><span className="sub2-line-val">${SUB_PRICES[selectedTier].annualTotal}/yr</span></div>
              {(selectedTier==='independent'||selectedTier==='player')&&<><div className="sub2-line"><span className="sub2-line-label">Formation fee (one-time)</span><span className="sub2-line-val waived">WAIVED</span></div><div className="sub2-line"><span className="sub2-line-label">Regular formation fee</span><span className="sub2-line-val strike">$149</span></div></>}
              <div className="sub2-due"><span className="sub2-due-label">DUE TODAY</span><span className="sub2-due-val">$0</span></div>
              <div className="sub2-founding-note">
                <div className="sub2-founding-label">FOUNDING MEMBER — RATE LOCKED</div>
                <div className="sub2-founding-text">Your intro rate is locked permanently — it never increases. {(selectedTier==='independent'||selectedTier==='player')?'The $149 formation fee is waived. Your first session with FutureYou is on us.':'No formation fee applies to Operator.'}</div>
              </div>
              <div className="sub2-features-label">WHAT'S INCLUDED</div>
              <ul className="sub2-features-list">{SUB_FEATURES[selectedTier].map((f,i)=><li key={i}>{f}</li>)}</ul>
            </div>
            <div className="sub2-right">
              <div className="sub2-right-headline">COMPLETE YOUR STUDIO</div>
              <div className="sub2-right-sub">Beta access — your tier is locked in today. Billing activates at public launch.</div>
              <div className="sub2-field-label">FULL NAME</div>
              <input className="sub2-field" type="text" defaultValue={nameVal} placeholder="Your name" autoComplete="off"/>
              <div className="sub2-field-label">EMAIL</div>
              <input className="sub2-field" type="email" defaultValue={emailVal} placeholder="your@email.com" autoComplete="off"/>
              <div className="sub2-beta-note"><strong>Beta pricing is locked in today — no payment collected now.</strong> When billing activates at public launch, your founding rate is guaranteed.</div>
              <div className="sub2-card-label">CARD DETAILS — RESERVED FOR LAUNCH</div>
              <div className="sub2-card-placeholder"><span>Will be collected at launch</span><div className="sub2-card-icons"><span className="sub2-card-icon">VISA</span><span className="sub2-card-icon">MC</span><span className="sub2-card-icon">AMEX</span></div></div>
              <div className="sub2-reserve-btn-wrap">
                <button className="syb syb-grad" style={selectedTier==='operator'?{background:'linear-gradient(135deg,#a06be8 0%,#5e28a8 50%,#7b35d4 100%)'}:{}} onClick={handleReserve} disabled={submitting}>
                  {submitting?'RESERVING...':'RESERVE MY STUDIO'}
                </button>
              </div>
              <div className="sub2-back-link" onClick={goBack}>← Back to tier selection</div>
              <div className="sub2-no-charge">No charge today · Your founding rate is locked permanently.<br/>Cancel any time before launch with no obligation.</div>
            </div>
          </div></div>
        )}
      </div>
    </div>
  );
}

// ── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [authed, setAuthed] = useState(false);

  useEffect(() => {
    const tier = localStorage.getItem('sy_tier');
    const email = localStorage.getItem('sy_email');
    // Check for post-auth redirect param
    if (new URLSearchParams(window.location.search).get('fromsubscribe') === '1') {
      window.history.replaceState({}, '', window.location.pathname);
      localStorage.removeItem('sy_post_auth_redirect');
    }
    if (!tier && email) setAuthed(true);
  }, []);

  if (authed || (!localStorage.getItem('sy_tier') && localStorage.getItem('sy_email'))) {
    return <SubscribePage />;
  }
  return <AuthGate onAuth={()=>setAuthed(true)} />;
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
