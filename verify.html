<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Your Studio — StudioYou</title>
    <link rel="icon" type="image/png" href="assets/SY_OFFICIAL_SHUTTER_KEY.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --black: #06091a;
            --white: #f0f2ff;
            --dim: rgba(240,242,255,0.65);
            --mute: rgba(240,242,255,0.3);
            --cyan: #00c8ff;
            --grad: linear-gradient(135deg, #00c8ff 0%, #5e28a8 60%, #7b35d4 100%);
        }
        html, body { height: 100%; }
        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .logo {
            height: 48px;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeIn 0.6s ease 0.3s forwards;
        }
        .headline {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(36px, 6vw, 72px);
            line-height: 1;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeIn 0.6s ease 0.6s forwards;
        }
        .headline .grad {
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subheading {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 18px;
            color: var(--dim);
            line-height: 1.6;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeIn 0.6s ease 0.9s forwards;
        }
        .status {
            padding: 24px;
            border-radius: 4px;
            background: rgba(0,200,255,0.06);
            border: 1px solid rgba(0,200,255,0.2);
            margin-bottom: 32px;
            opacity: 0;
            animation: fadeIn 0.6s ease 1.2s forwards;
        }
        .status-label {
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--cyan);
            margin-bottom: 12px;
            opacity: 0.7;
        }
        .status-text {
            font-size: 16px;
            color: var(--white);
        }
        .spinner {
            width: 36px;
            height: 36px;
            margin: 24px auto;
            background: url('assets/shutter1.gif') center/contain no-repeat;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-message {
            color: rgba(255,100,100,0.8);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        /* SYB base — 3D overrides from sy-3d.css on body.sy-3d */
        .syb {
            padding: 14px 32px;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }
        .syb-grad { background: var(--grad); color: var(--black); }
        .syb-grad:hover { opacity: 0.88; }
        .syb-ghost { background: transparent; border: 1px solid rgba(0,200,255,0.5); color: var(--cyan); }
        .syb-ghost:hover { background: rgba(0,200,255,0.06); }
        .progress-bar-wrap {
            height: 2px;
            background: rgba(0,200,255,0.12);
            border-radius: 0 0 4px 4px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(135deg, #00c8ff 0%, #7b35d4 100%);
            transform-origin: left;
            animation: drain 4s linear forwards;
        }
        @keyframes drain {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        /* ── VERIFY-SPECIFIC 3D OVERRIDES ── */
        /* Resend email input */
        .resend-input-wrap {
            display: flex;
            gap: 0;
            border: 1px solid rgba(0,200,255,0.18);
        }
        .resend-input-wrap:focus-within {
            border-color: rgba(0,200,255,0.38);
            box-shadow: 0 0 0 2px rgba(0,200,255,0.08);
        }
        #resend-email {
            flex: 1;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 300;
            padding: 13px 16px;
            outline: none;
            border: none;
            caret-color: #4cff91;
        }
        /* Success verified badge */
        .verify-success-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
            background: linear-gradient(180deg,#1eaa50 0%,#108238 55%,#0a6a2c 100%);
            color: #ccffe0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.25),
                0 5px 0 #042e14, 0 6px 0 #021c0c,
                0 8px 18px rgba(76,255,145,0.22), 0 14px 26px rgba(0,0,0,0.48);
            animation: badgeIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
        }
        .verify-success-badge-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4cff91;
            box-shadow: 0 0 8px rgba(76,255,145,0.9);
            animation: pg 2s infinite;
        }
        /* Error badge */
        .verify-error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 0.14em;
            margin-bottom: 14px;
            background: linear-gradient(180deg,#c84040 0%,#a42828 55%,#8a1a1a 100%);
            color: #ffd0d0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),
                0 4px 0 #3a0000, 0 5px 0 #240000,
                0 7px 16px rgba(255,107,107,0.22), 0 12px 22px rgba(0,0,0,0.42);
        }
        .verify-error-badge-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #ff6b6b;
            box-shadow: 0 0 6px rgba(255,107,107,0.9);
        }
        /* Status label badge */
        .status-label-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 14px;
            background: linear-gradient(180deg,#0d8fad 0%,#006b88 55%,#005878 100%);
            color: #ccf6ff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.22),
                0 3px 0 #002a38, 0 4px 0 #001820,
                0 6px 12px rgba(0,200,255,0.18), 0 10px 18px rgba(0,0,0,0.38);
        }
        .status-label-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: #44f0ff;
            box-shadow: 0 0 6px rgba(0,200,255,0.8);
            animation: pgC 2s infinite;
        }
        @keyframes pg  { 0%,100%{box-shadow:0 0 0 0 rgba(76,255,145,0.5)} 50%{box-shadow:0 0 0 5px rgba(76,255,145,0)} }
        @keyframes pgC { 0%,100%{box-shadow:0 0 6px rgba(0,200,255,0.8)} 50%{box-shadow:0 0 2px rgba(0,200,255,0.4)} }
        @keyframes badgeIn { from{opacity:0;transform:translateY(10px) scale(0.92)} to{opacity:1;transform:translateY(0) scale(1)} }
    </style>
<link rel="stylesheet" href="assets/sy-3d.css">
</head>
<body class="sy-3d">
    <div class="container">
        <img src="assets/SY_LOGO_2D_OFFICIAL.png" alt="StudioYou" class="logo">
        
        <h1 class="headline">
            <span class="grad">Verifying</span> Your Studio
        </h1>
        
        <p class="subheading" id="subtext">
            One moment while we unlock your formation...
        </p>
        
        <div class="sy-card-3d-wrap" style="width:100%;display:block;">
          <div class="status sy-card-3d" id="status">
            <div class="sy-card-3d-shine"></div>
            <div class="status-label-badge" id="status-badge">
                <div class="status-label-dot"></div>
                VERIFYING
            </div>
            <div class="status-text">
                <div class="spinner" id="spinner"></div>
                <div id="message">Validating your magic link...</div>
            </div>
          </div>
        </div>
        
        <div id="content"></div>
    </div>

    <script>
        const API_URL = "https://studioyou-api-198959034459.us-east1.run.app";
        
        async function verifyToken() {
            try {
                // Get token from URL
                const params = new URLSearchParams(window.location.search);
                const token = params.get("token");
                
                if (!token) {
                    showError("No verification link found. Check your email and try again.");
                    return;
                }
                
                // Verify token with backend
                const response = await fetch(`${API_URL}/api/formation/validate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    showError(data.error || "Verification failed. Try requesting a new link.");
                    return;
                }
                
                // Success — save user data and redirect
                const user = data.user;
                localStorage.setItem("sy_email", user.email || "");
                localStorage.setItem("sy_first_name", user.first_name || "");
                localStorage.setItem("sy_last_name", user.last_name || "");
                const sn = (user.studio_name || "").trim();
                if (sn) { localStorage.setItem("sy_studio_name", sn); }
                else { localStorage.removeItem("sy_studio_name"); }
                // Formation data — normalize to array
                const fd = user.formation || {};
                const answers = Array.isArray(fd.answers) ? fd.answers : (Array.isArray(fd) ? fd : []);
                const briefing = fd.briefing || {};
                localStorage.setItem("sy_formation", JSON.stringify(answers));
                localStorage.setItem("sy_briefing",  JSON.stringify(briefing));
                // FY context
                if (user.first_words)          localStorage.setItem("sy_first_words",          user.first_words);
                if (user.archetype)            localStorage.setItem("sy_archetype",            user.archetype);
                if (user.phase)                localStorage.setItem("sy_phase",                user.phase);
                if (user.recommended_building) localStorage.setItem("sy_recommended_building", user.recommended_building);
                if (fd.brand_story)            localStorage.setItem("sy_brand_story",          fd.brand_story);
                // Mark fresh only if we have real formation data
                if (answers.length > 0 && !user.first_words) {
                    localStorage.setItem("sy_fresh_formation", "true");
                }
                
                showSuccess(user.first_name || "Creator");
                
                // Redirect: new users (no studio name) go to studio naming; returning users go to dashboard
                setTimeout(() => {
                    const postAuth = localStorage.getItem('sy_post_auth_redirect') || '';
                    localStorage.removeItem('sy_post_auth_redirect');
                    if (postAuth === '?fromsubscribe=1') {
                        window.location.href = 'subscribe.html?fromsubscribe=1';
                    } else {
                        const hasStudioName = !!(user.studio_name || '').trim();
                        if (!hasStudioName) {
                            window.location.href = 'index.html?phase=studio_name';
                        } else {
                            window.location.href = 'dashboard.html' + postAuth;
                        }
                    }
                }, 4000);
                
            } catch (err) {
                console.error("Verification error:", err);
                showError("Something went wrong. Please try again or request a new link.");
            }
        }
        
        function showError(message) {
            const spinner = document.getElementById("spinner");
            const msgEl   = document.getElementById("message");
            const subtext = document.getElementById("subtext");
            const content = document.getElementById("content");
            const badge   = document.getElementById("status-badge");

            if (spinner) spinner.remove();

            // Upgrade status badge to red FAILED
            if (badge) {
                badge.className = 'verify-error-badge';
                badge.innerHTML = '<div class="verify-error-badge-dot"></div>VERIFICATION FAILED';
            }

            msgEl.textContent = "Something went wrong.";
            subtext.textContent = message;

            content.innerHTML = `
                <div class="action-buttons">
                    <button class="syb syb-grad" onclick="location.href='index.html'">
                        Start Over
                    </button>
                    <button class="syb syb-ghost" onclick="requestNewLink()">
                        Request New Link
                    </button>
                </div>
            `;
            setTimeout(() => { if (window.SY3D) window.SY3D.init(); }, 50);
        }
        
        function showSuccess(firstName) {
            const spinner = document.getElementById("spinner");
            const msgEl   = document.getElementById("message");
            const subtext = document.getElementById("subtext");
            const badge   = document.getElementById("status-badge");

            if (spinner) spinner.remove();

            // Upgrade status badge to green VERIFIED
            if (badge) {
                badge.className = 'verify-success-badge';
                badge.innerHTML = '<div class="verify-success-badge-dot"></div>VERIFIED';
            }

            msgEl.innerHTML = `
                <img src="assets/id-card-key.gif" style="width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 12px;" alt="" />
                <div style="font-size:15px;font-weight:400;letter-spacing:0.04em;margin-bottom:4px;">
                    Your studio is unlocked.
                </div>
                <div style="font-size:12px;color:rgba(240,242,255,0.45);letter-spacing:0.06em;margin-bottom:0;">
                    Entering your lot now.
                </div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill"></div>
                </div>
            `;
            subtext.innerHTML = `Welcome back, <strong style="color:#f0f2ff;font-weight:400">${firstName}</strong>. Entering your studio...`;
        }
        
        function requestNewLink() {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div id="resend-form" style="max-width:380px;margin:0 auto;">
                    <div style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(240,242,255,0.35);margin-bottom:10px;">ENTER YOUR EMAIL</div>
                    <div class="resend-input-wrap">
                        <input id="resend-email" type="email"
                            class="sy-input-3d"
                            placeholder="your@email.com"
                            onkeydown="if(event.key==='Enter') sendResendLink()" />
                        <button class="syb syb-grad" onclick="sendResendLink()"
                            style="font-size:13px;padding:0 20px;flex-shrink:0;">
                            SEND LINK
                        </button>
                    </div>
                    <div id="resend-feedback" style="font-size:11px;margin-top:10px;min-height:18px;letter-spacing:0.06em;"></div>
                    <button class="syb syb-ghost" onclick="location.href='index.html'"
                        style="margin-top:16px;width:100%;font-size:12px;padding:10px;">
                        BACK TO HOME
                    </button>
                </div>
            `;
            setTimeout(() => {
                document.getElementById("resend-email")?.focus();
                if (window.SY3D) window.SY3D.init();
            }, 50);
        }

        async function sendResendLink() {
            const emailEl = document.getElementById("resend-email");
            const feedback = document.getElementById("resend-feedback");
            const email = emailEl ? emailEl.value.trim() : "";
            if (!email) { feedback.textContent = "Enter your email."; feedback.style.color = "rgba(255,100,100,0.8)"; return; }
            feedback.textContent = "Sending..."; feedback.style.color = "rgba(240,242,255,0.4)";
            try {
                const res = await fetch(API_URL + "/api/auth/magic-link", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                if (res.ok) {
                    feedback.textContent = "Link sent. Check your email.";
                    feedback.style.color = "#00c8ff";
                    emailEl.disabled = true;
                } else {
                    feedback.textContent = "Email not found. Have you completed your briefing?";
                    feedback.style.color = "rgba(255,100,100,0.8)";
                }
            } catch(e) {
                feedback.textContent = "Connection error. Try again.";
                feedback.style.color = "rgba(255,100,100,0.8)";
            }
        }
        
        // Verify on page load
        window.addEventListener("load", verifyToken);
    </script>
<script src="assets/sy-3d.js" defer></script>
</body>
</html>
